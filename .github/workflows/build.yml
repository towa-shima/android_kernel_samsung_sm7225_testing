name: Build towa kernel

# One run gives you two files:
#   * a flashable AnyKernel3 zip whose kernel carries a NEW syscall, and
#   * towa_core.ko - the module that holds the actual read/write logic.
#
# Why split it that way:
#   RT and CShell get their syscall by writing sys_call_table[] at runtime. On
#   this kernel that table is read-only (.rodata + STRICT_KERNEL_RWX), which is
#   the most likely reason RT loads and then never hooks anything, and it is
#   certainly why it would collide with KernelSU's manual hook, which wants the
#   very same table. We don't write it at all - the compiler emits the entry,
#   once, at build time. Nothing at runtime touches sys_call_table.
#
#   The stub that lives in the flashed kernel is ~40 lines and does nothing but
#   tail-call a registered function pointer. All the real code sits in the
#   module, so after this one flash every future change is insmod / rmmod with
#   no reflash. With the module unloaded the syscall returns -ENOSYS, i.e. it
#   looks exactly like the hole in the table it sits in.
#
# The build log prints TOWA_NR=<n>. That is the syscall number - normally 294,
# but the run reads it out of the tree rather than assuming it.
#
# DEFAULTS ARE THE 325 BUILD (branch Boostkernel2-cip, clang-r563880). The
# source below is version-agnostic - none of it cares which 4.19 it lands in -
# so the 191 tree is the same run with branch=cheetkernel and
# clang_dir=clang-r487747c.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch'
        required: true
        default: 'Boostkernel2-cip'
      model:
        description: 'Device model'
        required: true
        default: 'm23xq'
      clang_dir:
        description: 'AOSP clang revision directory'
        required: true
        default: 'clang-r563880'
      builtin:
        description: 'y = build towa into the kernel (nothing in /proc/modules), n = loadable towa_core.ko'
        required: true
        default: 'n'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git kmod libelf-dev libssl-dev \
            lz4 python3 rsync unzip wget xz-utils zip

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 --branch "${{ inputs.branch }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/Aflaungos/android_kernel_samsung_sm7225_testing.git \
            "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          echo "--- commit we are building ---"
          git log -1 --format='%H %ad %s' --date=iso
          echo "--- version ---"
          head -5 Makefile
          ls -l build_kernel.sh build_lito_kernel.sh 2>/dev/null || true

      # r487747c is the clang 17.0.2 that built the CheetKernal 191 banner.
      - name: Toolchain - ${{ inputs.clang_dir }}
        run: |
          mkdir -p "$HOME/linux-x86-main"
          cd "$HOME/linux-x86-main"
          D="${{ inputs.clang_dir }}"

          # $1 = url, then the strip-depths to try, in order.
          #
          # The depth is NOT a property of the mirror, it is a property of how
          # the tarball was made, and there are two shapes in the wild:
          #
          #   a GitHub repo tarball  ->  one wrapper directory, so strip 1
          #       linux-x86-clang-21.0.0-r563880-main/bin/clang
          #   an AOSP-style tarball  ->  bin/, lib/, include/ right at the root,
          #       so strip 0  (googlesource's +archive, and release assets named
          #       linux-x86-<sha>-<revision>.tar.gz)
          #
          # Hardcoding one depth is what broke this: kiy017's asset is the
          # AOSP-named shape, so strip 1 deleted bin/ itself and the check for
          # bin/clang failed on a perfectly good download.  So try each depth and
          # PROVE it worked by looking for the binary - and say what the layout
          # actually was when none of them do.
          fetch() {
            url="$1"; shift
            echo "=== trying: $url"
            curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --no-progress-meter \
                 -o /tmp/clang.tar.gz "$url" || { echo "  download failed"; return 1; }
            echo "  downloaded: $(stat -c%s /tmp/clang.tar.gz) bytes"

            for n in "$@"; do
              rm -rf "$D" && mkdir -p "$D"
              if ! tar -xzf /tmp/clang.tar.gz -C "$D" --strip-components="$n"; then
                echo "  strip=$n: extract failed, trying the next depth"
                continue
              fi
              if [ -x "$D/bin/clang" ]; then
                echo "  OK with --strip-components=$n"
                "$D/bin/clang" --version || return 1
                rm -f /tmp/clang.tar.gz
                return 0
              fi
              echo "  strip=$n: no bin/clang; what came out was:"
              ls "$D" 2>/dev/null | head -6
            done

            echo "  none of the depths produced bin/clang"
            echo "  first entries of the tarball were:"
            tar -tzf /tmp/clang.tar.gz 2>/dev/null | head -6
            rm -f /tmp/clang.tar.gz
            return 1
          }

          # AOSP prunes old revisions out of prebuilts/clang/host/linux-x86, so
          # whether a given revision is still downloadable depends entirely on
          # who mirrored it, and that is NOT the same for the two trees this
          # workflow can build: r563880 (the 325 tree) lives in Aeron-Aeron's and
          # kiy017's imports, r487747c (the 191 tree) in halogenOS's and
          # project-raspberry's.  Try them all; the first that yields a working
          # clang wins.
          # kiy017 first: measured to have no wrapper directory (its root really
          # is AndroidVersion.txt, bin/, lib/), so strip 0 is right and there is
          # nothing to interpret.  Aeron-Aeron is a GitHub repo tarball and needs
          # strip 1 - checked, its root is linux-x86-clang-...-main/.
          fetch "https://github.com/kiy017/${D}c/releases/download/release/linux-x86-f8439f0628d799092dd07df440a6334cab28939c-${D}c.tar.gz" 0 1 2 \
          || fetch "https://codeload.github.com/Aeron-Aeron/linux-x86-clang-21.0.0-${D#clang-}/tar.gz/refs/heads/main" 1 0 2 \
          || fetch "https://codeload.github.com/halogenOS/android_prebuilts_clang_host_linux-x86_$D/tar.gz/refs/heads/XOS-13.0" 1 0 2 \
          || fetch "https://codeload.github.com/project-raspberry/prebuilts_clang_host_linux-x86_$D/tar.gz/refs/heads/fifteen" 1 0 2 \
          || fetch "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/$D.tar.gz" 0 1 \
          || { echo "ALL CLANG SOURCES FAILED - no mirror of $D yielded a clang"; df -h /; exit 1; }

          echo "--- which clang did we actually end up with? ---"
          ls -d "$HOME/linux-x86-main/$D" && "$HOME/linux-x86-main/$D/bin/clang" --version

      - name: Toolchain - aarch64-linux-android-4.9
        run: |
          mkdir -p "$HOME/aarch64-linux-android-4.9"
          curl -fsSL \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android11-release.tar.gz" \
            | tar -xz -C "$HOME/aarch64-linux-android-4.9"
          ls "$HOME/aarch64-linux-android-4.9/bin" | head

      # ------------------------------------------------------- the towa source
      # The four files are written here so this workflow stays a single upload.
      - name: Write towa sources
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          mkdir -p drivers/towa include/linux
          cat > drivers/towa/towa.h <<'TW_H'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _TOWA_H
          #define _TOWA_H
          
          /*
           * Shared between the kernel side and the userspace client.
           *
           * TOWA_COOKIE is the first argument of every call. Without it the syscall
           * answers -ENOSYS, so a blind probe of the number sees the same thing it would
           * see from an unused table slot.
           */
          #define TOWA_COOKIE	0x9E3779B97F4A7C15ULL
          
          /* TOWA_OP_PING returns this. */
          #define TOWA_MAGIC	0x5032300AUL
          
          enum {
          	TOWA_OP_PING       = 0,	/* -> TOWA_MAGIC				*/
          	TOWA_OP_READ       = 1,	/* a1=pid a2=addr a3=buf a4=len -> bytes	*/
          	TOWA_OP_WRITE      = 2,	/* a1=pid a2=addr a3=buf a4=len -> bytes	*/
          	TOWA_OP_BASE       = 3,	/* a1=pid a2=name a3=&out -> 0		*/
          
          	/*
          	 * Hardware breakpoints.  A breakpoint costs no code change at all:
          	 * nothing is written to the target, so there is no byte to notice and
          	 * nothing that survives a restart of the game.  Four registers is what
          	 * the architecture gives us.
          	 */
          	TOWA_OP_HWBP_SET   = 4,	/* a1=pid a2=addr a3=type a4=len -> slot	*/
          	TOWA_OP_HWBP_DEL   = 5,	/* a1=slot -> 0				*/
          	TOWA_OP_HWBP_STAT  = 6,	/* a1=slot a2=&u64[3] -> 0		*/
          	TOWA_OP_HWBP_ARM   = 7,	/* a1=&struct towa_hbp_cfg -> slot		*/
          
          	/*
          	 * Page watches - the fault-path half of a PTE hook.  Arming takes the
          	 * access away from one page in one process; the next time that process
          	 * touches it the kernel records who, from where, and whether it was a
          	 * write, then lets the access through.  The page's own contents are
          	 * never modified, which is the point.
          	 */
          	TOWA_OP_WATCH_ARM  = 8,	/* a1=&struct towa_watch_cfg -> slot		*/
          	TOWA_OP_WATCH_STAT = 9,	/* a1=slot a2=&struct towa_watch_info -> 0	*/
          	TOWA_OP_WATCH_OFF  = 10,/* a1=slot -> 0				*/
          };
          
          /* a3 of TOWA_OP_HWBP_SET.  X = execute, i.e. call me at this address.
           *
           * TOWA_BP_W (a data watchpoint) is REFUSED by the kernel: the debug exception
           * is taken before the access completes, this kernel does not single-step it,
           * and the access therefore re-executes and traps forever - a storm that freezes
           * the target, whose only escape is skipping the access, which corrupts it.
           * Use a page watch (TOWA_OP_WATCH_*) to find out who touches memory. */
          #define TOWA_BP_X	0
          #define TOWA_BP_W	1
          
          #define TOWA_HBP_SLOTS	4
          
          /*
           * Safety net.  An execute breakpoint traps *before* the instruction runs, so
           * unless the kernel single-steps over it the CPU retries the same instruction
           * and traps again - a livelock that pins a core.  In counting mode, after this
           * many hits the handler skips the instruction once and stops being a loop.
           */
          #define TOWA_HBP_TRIP	64
          
          /*
           * What the breakpoint handler does when it fires.
           *
           * The four that act all leave the pc somewhere else on purpose: an action that
           * left pc alone would trip again on the same instruction and never get out.
           * Nothing here needs a trampoline, so nothing here copies the game's code.
           */
          /*
           * TOWA_ACT_NONE is also REFUSED: counting needs the instruction to execute
           * again after the trap, which is the same storm.  There is no safe way to count
           * hits without single-stepping, so an action is mandatory.
           */
          #define TOWA_ACT_NONE	0	/* refused - see above */
          #define TOWA_ACT_SKIP	1	/* pc += 4 - the instruction does not run  */
          #define TOWA_ACT_RET	2	/* return from the function: pc = x30,
          				   x0 = value.  A function that answers
          				   "yes" forever costs not one byte.        */
          #define TOWA_ACT_PC	3	/* pc = value                              */
          #define TOWA_ACT_X0	4	/* x0 = value, then skip that instruction  */
          #define TOWA_ACT_REG	5	/* regs[reg] = value, then skip it         */
          
          /* TOWA_OP_WATCH_ARM modes. */
          #define TOWA_WATCH_WRITE	0	/* next write to the page			*/
          #define TOWA_WATCH_ACCESS	1	/* next read, write or execute		*/
          
          #define TOWA_WATCH_SLOTS	4
          
          #define TOWA_MAX_XFER		(1024 * 1024)
          
          /* towa_watch_info.flags */
          #define TOWA_WF_ARMED	0x0001
          #define TOWA_WF_SPENT	0x0002
          #define TOWA_WF_WRITE	0x0004	/* the access that fired was a write	*/
          #define TOWA_WF_ACCESS	0x0008	/* armed in ACCESS mode			*/
          
          struct towa_hbp_cfg {
          	int		pid;
          	unsigned long	type;
          	unsigned long	addr;
          	unsigned long	len;
          	unsigned long	action;
          	unsigned long	value;
          	unsigned long	reg;
          };
          
          struct towa_watch_cfg {
          	int		pid;
          	unsigned long	addr;
          	unsigned long	mode;
          };
          
          struct towa_watch_info {
          	unsigned long long	hits;
          	unsigned long long	last_pc;
          	unsigned long long	last_task;
          	unsigned long		addr;
          	unsigned long		flags;
          };
          
          /* What towa_syscall.c holds and calls. */
          typedef long (*towa_handler_t)(unsigned long op, unsigned long a1,
          			       unsigned long a2, unsigned long a3,
          			       unsigned long a4);
          
          /* Implemented in towa_syscall.c.  towa_core.c has to register itself through
           * this, so it needs the prototype - which it did not have, and this tree builds
           * with -Werror=implicit-function-declaration. */
          void towa_set_handler(towa_handler_t fn);
          
          /* Implemented in towa_watch.c, which is built into the kernel, not the module:
           * it needs the page-fault path and the core mm helpers. */
          int towa_watch_arm(pid_t pid, unsigned long addr, unsigned long mode);
          int towa_watch_off(unsigned long slot);
          int towa_watch_stat(unsigned long slot, struct towa_watch_info *out);
          void towa_watch_off_all(void);
          
          #endif /* _TOWA_H */
          TW_H
          cat > drivers/towa/towa_syscall.c <<'TW_S'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * The syscall front end.
           *
           * Its entire body is "call the registered handler". The table entry is emitted
           * by the compiler at build time, so nothing here ever writes to sys_call_table
           * - no set_memory_rw, no text poking, no rwxp page, and nothing for another
           * hook to collide with.
           *
           * If no handler is installed (towa_core.ko not loaded) this returns -ENOSYS,
           * which is what an unimplemented table slot returns anyway.
           */
          #include <linux/kernel.h>
          #include <linux/syscalls.h>
          #include <linux/mutex.h>
          #include <linux/export.h>
          
          #include "towa.h"
          
          static towa_handler_t towa_handler __read_mostly;
          static DEFINE_MUTEX(towa_mutex);
          
          void towa_set_handler(towa_handler_t fn)
          {
          	mutex_lock(&towa_mutex);
          	towa_handler = fn;
          	mutex_unlock(&towa_mutex);
          }
          EXPORT_SYMBOL_GPL(towa_set_handler);
          
          SYSCALL_DEFINE6(towa, unsigned long, cookie, unsigned long, op,
          		unsigned long, a1, unsigned long, a2,
          		unsigned long, a3, unsigned long, a4)
          {
          	towa_handler_t fn;
          	long ret;
          
          	if (cookie != TOWA_COOKIE)
          		return -ENOSYS;
          
          	/*
          	 * The mutex is held across the call on purpose: it serialises two
          	 * concurrent callers, and it also means rmmod cannot free the module
          	 * while a call is still inside it (module_exit takes the same lock to
          	 * clear the handler).
          	 */
          	mutex_lock(&towa_mutex);
          	fn = towa_handler;
          	ret = fn ? fn(op, a1, a2, a3, a4) : -ENOSYS;
          	mutex_unlock(&towa_mutex);
          
          	return ret;
          }
          TW_S
          cat > drivers/towa/towa_watch.c <<'TW_W'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * Page watches - the fault-path half of a PTE hook.
           *
           * This file is built into the kernel, not into the module, because it needs two
           * things a module cannot have: a call site inside do_page_fault() and the core
           * mm helpers that manipulate another process's page tables.
           *
           * How it works, and why it is the safe end of "PTE hook":
           *
           *   1. Arming takes access to one page away from one process.  For a write
           *      watch that means clearing the write bit in the PTE; for an access watch
           *      it means clearing the PTE so the next touch faults.  Either way only the
           *      page TABLE is touched.  The page's contents are untouched, so a scanner
           *      that reads the memory finds exactly the original bytes - there is no
           *      shadow page and no patched instruction anywhere.
           *
           *   2. The next time that process touches the page it faults, do_page_fault()
           *      calls us before the normal handling, and we record the pc it faulted
           *      from, which task it was, and whether it was a write.
           *
           *   3. We then put the PTE back the way it was and return "not handled", so the
           *      normal fault path resolves it and the access simply succeeds.  Nothing
           *      is emulated and no instruction is decoded - which is the whole trick.
           *      A watch is single shot: one arm, one event.  Arm it again for another.
           *
           * What this deliberately does NOT do yet: substitute a different value for the
           * game to read.  That needs either a shadow page (the page then belongs to the
           * file's page cache, which is a real hazard) or decoding the faulting
           * instruction.  Both are separate steps that want this watcher proven first.
           */
          #include <linux/kernel.h>
          #include <linux/module.h>
          #include <linux/mm.h>
          #include <linux/sched.h>
          #include <linux/sched/mm.h>
          #include <linux/pid.h>
          #include <linux/export.h>
          #include <linux/spinlock.h>
          #include <linux/jump_label.h>
          #include <linux/rmap.h>
          #include <linux/pagemap.h>
          #include <linux/mmap_lock.h>
          #include <asm/pgtable.h>
          #include <asm/tlbflush.h>
          #include <asm/ptrace.h>
          #include <asm/esr.h>
          
          #include <linux/towa_watch.h>	/* so our definition is checked against the
          				 * prototype fault.c calls us through */
          
          #include "towa.h"
          
          /*
           * Off unless something is armed.  A static branch compiles to a no-op that the
           * CPU predicts perfectly, so do_page_fault() pays nothing for the call below
           * while no watch exists.
           */
          DEFINE_STATIC_KEY_FALSE(towa_watch_key);
          
          struct towa_watch_slot {
          	struct mm_struct	*mm;		/* NULL = free */
          	unsigned long		addr;		/* page aligned */
          	unsigned long		mode;
          	unsigned long long	hits;
          	unsigned long		last_pc;
          	unsigned long		last_task;
          	unsigned long		last_addr;
          	unsigned long		flags;
          };
          
          static struct towa_watch_slot towa_watch[TOWA_WATCH_SLOTS];
          static int towa_watch_live;
          
          /* ------------------------------------------------------------- page table */
          
          struct towa_pte {
          	pmd_t		*pmd;
          	pte_t		*ptep;
          	spinlock_t	*ptl;
          };
          
          /*
           * Walk to the PTE for addr.  Caller must hold mmap_sem for read.  Returns
           * 0 with ptep locked, or an error with nothing held.
           */
          static int towa_pte_lock(struct mm_struct *mm, unsigned long addr,
          			 struct towa_pte *out)
          {
          	pgd_t *pgd;
          	pud_t *pud;
          	pmd_t *pmd;
          
          	pgd = pgd_offset(mm, addr);
          	if (pgd_none(*pgd) || pgd_bad(*pgd))
          		return -EFAULT;
          
          	pud = pud_offset(pgd, addr);
          	if (pud_none(*pud) || pud_bad(*pud))
          		return -EFAULT;
          
          	pmd = pmd_offset(pud, addr);
          	if (pmd_none(*pmd) || pmd_bad(*pmd))
          		return -EFAULT;
          
          	/* A huge mapping has no PTE to take access from.  (No pmd_devmap
          	 * here: this tree has not got it.) */
          	if (pmd_trans_huge(*pmd))
          		return -EOPNOTSUPP;
          
          	out->pmd  = pmd;
          	out->ptep = pte_offset_map_lock(mm, pmd, addr, &out->ptl);
          	if (!out->ptep) {
          		out->ptl = NULL;
          		return -EFAULT;
          	}
          	return 0;
          }
          
          static void towa_pte_unlock(struct towa_pte *p)
          {
          	if (p->ptep)
          		pte_unmap_unlock(p->ptep, p->ptl);
          }
          
          /* ---------------------------------------------------------------- arming */
          
          int towa_watch_arm(pid_t pid, unsigned long addr, unsigned long mode)
          {
          	struct towa_watch_slot *w = NULL;
          	struct task_struct *t;
          	struct mm_struct *mm;
          	struct vm_area_struct *vma;
          	struct towa_pte p = { NULL, NULL, NULL };
          	unsigned long pgaddr = addr & PAGE_MASK;
          	pte_t pte, new;
          	int slot, ret;
          
          	if (mode != TOWA_WATCH_WRITE && mode != TOWA_WATCH_ACCESS)
          		return -EINVAL;
          
          	for (slot = 0; slot < TOWA_WATCH_SLOTS; slot++)
          		if (!towa_watch[slot].mm) {
          			w = &towa_watch[slot];
          			break;
          		}
          	if (!w)
          		return -ENOSPC;
          
          	rcu_read_lock();
          	t = find_task_by_vpid(pid);
          	if (t)
          		get_task_struct(t);
          	rcu_read_unlock();
          	if (!t)
          		return -ESRCH;
          
          	/* get_task_mm returns with a reference held; we keep it until disarm. */
          	mm = get_task_mm(t);
          	put_task_struct(t);
          	if (!mm)
          		return -EINVAL;
          
          	mmap_read_lock(mm);
          
          	vma = find_vma(mm, addr);
          	if (!vma || vma->vm_start > addr) {
          		ret = -ENOENT;
          		goto out_unlock;
          	}
          
          	ret = towa_pte_lock(mm, addr, &p);
          	if (ret)
          		goto out_unlock;
          
          	pte = *p.ptep;
          	if (!pte_present(pte)) {
          		/* Not faulted in yet - there is no access to take away. */
          		ret = -EFAULT;
          		goto out_pte;
          	}
          
          	new = pte;
          	if (mode == TOWA_WATCH_WRITE) {
          		/*
          		 * Safe on anything: clearing the write bit is exactly what
          		 * copy-on-write does, and the page is not lost, only made
          		 * read-only until the next write faults.
          		 */
          		new = pte_wrprotect(pte);
          	} else {
          		/*
          		 * Clearing the PTE means the normal fault path has to rebuild it
          		 * from the VMA, so it must be a clean file page.  On a writable
          		 * pte that rebuild would throw away a private copy, and on an
          		 * anonymous page there is nothing to rebuild from at all.
          		 */
          		if (!vma->vm_file || pte_write(pte)) {
          			ret = -EOPNOTSUPP;
          			goto out_pte;
          		}
          	}
          
          	w->addr = pgaddr;
          	w->mode = mode;
          	w->hits = 0;
          	w->last_pc = 0;
          	w->last_task = 0;
          	w->last_addr = 0;
          	w->flags = TOWA_WF_ARMED;
          	if (mode == TOWA_WATCH_ACCESS)
          		w->flags |= TOWA_WF_ACCESS;
          
          	if (mode == TOWA_WATCH_WRITE)
          		set_pte_at(mm, addr, p.ptep, new);
          	else
          		ptep_get_and_clear(mm, addr, p.ptep);
          
          	towa_pte_unlock(&p);
          	mmap_read_unlock(mm);
          
          	/*
          	 * The PTE changed, so every CPU that might have it cached has to be
          	 * told.  Safe here - process context, no spinlock held.
          	 */
          	flush_tlb_mm(mm);
          
          	if (towa_watch_live++ == 0)
          		static_branch_enable(&towa_watch_key);
          
          	/* Published last: the fault path keys off w->mm. */
          	smp_wmb();
          	w->mm = mm;
          
          	return slot;
          
          out_pte:
          	towa_pte_unlock(&p);
          out_unlock:
          	mmap_read_unlock(mm);
          	mmput(mm);
          	return ret;
          }
          EXPORT_SYMBOL_GPL(towa_watch_arm);
          
          /* -------------------------------------------------------------- restoring */
          
          /*
           * The fault-path entry.  Never claims the fault: it records, puts the page back
           * the way it was, and returns so the normal handling goes ahead and the access
           * succeeds.  Nothing here can fail the target's access.
           */
          int towa_watch_fault(struct pt_regs *regs, unsigned long addr, unsigned int esr)
          {
          	struct mm_struct *mm;
          	struct towa_watch_slot *w;
          	unsigned long flags;
          	int i;
          
          	if (!static_branch_unlikely(&towa_watch_key))
          		return 0;
          
          	mm = current->mm;
          	if (!mm)
          		return 0;
          
          	for (i = 0; i < TOWA_WATCH_SLOTS; i++) {
          		w = &towa_watch[i];
          		if (w->mm != mm)
          			continue;
          
          		flags = READ_ONCE(w->flags);
          		if (!(flags & TOWA_WF_ARMED))
          			continue;
          		if ((addr & PAGE_MASK) != w->addr)
          			continue;
          
          		/*
          		 * Take the slot first: a second CPU faulting on the same page
          		 * must not record a second, phantom event.
          		 */
          		WRITE_ONCE(w->flags, flags | TOWA_WF_SPENT);
          
          		w->hits++;
          		w->last_pc = regs ? regs->pc : 0;
          		w->last_task = current->tgid;
          		w->last_addr = addr;
          		if (esr & ESR_ELx_WNR)
          			WRITE_ONCE(w->flags, READ_ONCE(w->flags) | TOWA_WF_WRITE);
          
          		/*
          		 * That is all.  No page table work, no TLB shootdown, no lock
          		 * beyond the ones the fault path already holds - which is the
          		 * whole point.  The page is still write-protected, so the
          		 * retried write faults once more, finds this slot spent, and
          		 * the normal fault path installs a proper PTE itself.
          		 */
          		return 0;
          	}
          
          	return 0;
          }
          EXPORT_SYMBOL_GPL(towa_watch_fault);
          
          /* ---------------------------------------------------------------- disarm */
          
          int towa_watch_off(unsigned long slot)
          {
          	struct towa_watch_slot *w;
          	struct mm_struct *mm;
          
          	if (slot >= TOWA_WATCH_SLOTS)
          		return -EINVAL;
          
          	w = &towa_watch[slot];
          	if (!w->mm)
          		return -EINVAL;
          
          	mm = w->mm;
          
          	/*
          	 * Nothing to put back.  Arming only took the write bit away, and the
          	 * target's own first write to that page faults straight into the normal
          	 * path, which installs a correct PTE by itself.  So this deliberately
          	 * writes no page table at all: an unload must not be able to alter a
          	 * live process, and an "unfreeze" must not be able to wait on anything.
          	 */
          
          	WRITE_ONCE(w->flags, 0);
          	smp_wmb();
          	w->mm = NULL;
          	mmput(mm);
          
          	if (towa_watch_live > 0 && --towa_watch_live == 0)
          		static_branch_disable(&towa_watch_key);
          
          	return 0;
          }
          EXPORT_SYMBOL_GPL(towa_watch_off);
          
          /*
           * Release every slot.  Called from module_exit: the watches live in this
           * built-in file, not in the module, so without this an rmmod would leave pages
           * write-protected and the fault hook still firing - the module would look like
           * the cause of a freeze it can no longer clear.
           */
          void towa_watch_off_all(void)
          {
          	int i;
          
          	for (i = 0; i < TOWA_WATCH_SLOTS; i++)
          		if (towa_watch[i].mm)
          			towa_watch_off(i);
          }
          EXPORT_SYMBOL_GPL(towa_watch_off_all);
          
          int towa_watch_stat(unsigned long slot, struct towa_watch_info *out)
          {
          	struct towa_watch_slot *w;
          
          	if (slot >= TOWA_WATCH_SLOTS)
          		return -EINVAL;
          
          	w = &towa_watch[slot];
          	if (!w->mm)
          		return -EINVAL;
          
          	out->hits      = w->hits;
          	out->last_pc   = w->last_pc;
          	out->last_task = w->last_task;
          	out->addr      = w->addr;
          	out->flags     = READ_ONCE(w->flags);
          
          	return 0;
          }
          EXPORT_SYMBOL_GPL(towa_watch_stat);
