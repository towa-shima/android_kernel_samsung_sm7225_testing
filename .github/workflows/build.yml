name: Build kdbg kernel

# One run gives you two files:
#   * a flashable AnyKernel3 zip whose kernel carries a NEW syscall, and
#   * kdbg.ko - the module that holds the actual read/write logic.
#
# Why split it that way:
#   RT and CShell get their syscall by writing sys_call_table[] at runtime. On
#   this kernel that table is read-only (.rodata + STRICT_KERNEL_RWX), which is
#   the most likely reason RT loads and then never hooks anything, and it is
#   certainly why it would collide with KernelSU's manual hook, which wants the
#   very same table. We don't write it at all - the compiler emits the entry,
#   once, at build time. Nothing at runtime touches sys_call_table.
#
#   The stub that lives in the flashed kernel is ~40 lines and does nothing but
#   tail-call a registered function pointer. All the real code sits in the
#   module, so after this one flash every future change is insmod / rmmod with
#   no reflash. With the module unloaded the syscall returns -ENOSYS, i.e. it
#   looks exactly like the hole in the table it sits in.
#
# The build log prints TOWA_NR=<n>. That is the syscall number - normally 294,
# but the run reads it out of the tree rather than assuming it.
#
# DEFAULTS ARE THE 325 BUILD (branch Boostkernel2-cip, clang-r563880). The
# source below is version-agnostic - none of it cares which 4.19 it lands in -
# so the 191 tree is the same run with branch=cheetkernel and
# clang_dir=clang-r487747c.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch'
        required: true
        default: 'Boostkernel2-cip'
      model:
        description: 'Device model'
        required: true
        default: 'm23xq'
      clang_dir:
        description: 'AOSP clang revision directory'
        required: true
        default: 'clang-r563880'
      builtin:
        description: 'y = build kdbg into the kernel (nothing in /proc/modules, nothing to insmod), n = loadable kdbg.ko'
        required: true
        default: 'y'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git kmod libelf-dev libssl-dev \
            lz4 python3 rsync unzip wget xz-utils zip

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 --branch "${{ inputs.branch }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/Aflaungos/android_kernel_samsung_sm7225_testing.git \
            "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          echo "--- commit we are building ---"
          git log -1 --format='%H %ad %s' --date=iso
          echo "--- version ---"
          head -5 Makefile
          ls -l build_kernel.sh build_lito_kernel.sh 2>/dev/null || true

      # r487747c is the clang 17.0.2 that built the CheetKernal 191 banner.
      - name: Toolchain - ${{ inputs.clang_dir }}
        run: |
          mkdir -p "$HOME/linux-x86-main"
          cd "$HOME/linux-x86-main"
          D="${{ inputs.clang_dir }}"

          # $1 = url, then the strip-depths to try, in order.
          #
          # The depth is NOT a property of the mirror, it is a property of how
          # the tarball was made, and there are two shapes in the wild:
          #
          #   a GitHub repo tarball  ->  one wrapper directory, so strip 1
          #       linux-x86-clang-21.0.0-r563880-main/bin/clang
          #   an AOSP-style tarball  ->  bin/, lib/, include/ right at the root,
          #       so strip 0  (googlesource's +archive, and release assets named
          #       linux-x86-<sha>-<revision>.tar.gz)
          #
          # Hardcoding one depth is what broke this: kiy017's asset is the
          # AOSP-named shape, so strip 1 deleted bin/ itself and the check for
          # bin/clang failed on a perfectly good download.  So try each depth and
          # PROVE it worked by looking for the binary - and say what the layout
          # actually was when none of them do.
          fetch() {
            url="$1"; shift
            echo "=== trying: $url"
            curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --no-progress-meter \
                 -o /tmp/clang.tar.gz "$url" || { echo "  download failed"; return 1; }
            echo "  downloaded: $(stat -c%s /tmp/clang.tar.gz) bytes"

            for n in "$@"; do
              rm -rf "$D" && mkdir -p "$D"
              if ! tar -xzf /tmp/clang.tar.gz -C "$D" --strip-components="$n"; then
                echo "  strip=$n: extract failed, trying the next depth"
                continue
              fi
              if [ -x "$D/bin/clang" ]; then
                echo "  OK with --strip-components=$n"
                "$D/bin/clang" --version || return 1
                rm -f /tmp/clang.tar.gz
                return 0
              fi
              echo "  strip=$n: no bin/clang; what came out was:"
              ls "$D" 2>/dev/null | head -6
            done

            echo "  none of the depths produced bin/clang"
            echo "  first entries of the tarball were:"
            tar -tzf /tmp/clang.tar.gz 2>/dev/null | head -6
            rm -f /tmp/clang.tar.gz
            return 1
          }

          # AOSP prunes old revisions out of prebuilts/clang/host/linux-x86, so
          # whether a given revision is still downloadable depends entirely on
          # who mirrored it, and that is NOT the same for the two trees this
          # workflow can build: r563880 (the 325 tree) lives in Aeron-Aeron's and
          # kiy017's imports, r487747c (the 191 tree) in halogenOS's and
          # project-raspberry's.  Try them all; the first that yields a working
          # clang wins.
          # kiy017 first: measured to have no wrapper directory (its root really
          # is AndroidVersion.txt, bin/, lib/), so strip 0 is right and there is
          # nothing to interpret.  Aeron-Aeron is a GitHub repo tarball and needs
          # strip 1 - checked, its root is linux-x86-clang-...-main/.
          fetch "https://github.com/kiy017/${D}c/releases/download/release/linux-x86-f8439f0628d799092dd07df440a6334cab28939c-${D}c.tar.gz" 0 1 2 \
          || fetch "https://codeload.github.com/Aeron-Aeron/linux-x86-clang-21.0.0-${D#clang-}/tar.gz/refs/heads/main" 1 0 2 \
          || fetch "https://codeload.github.com/halogenOS/android_prebuilts_clang_host_linux-x86_$D/tar.gz/refs/heads/XOS-13.0" 1 0 2 \
          || fetch "https://codeload.github.com/project-raspberry/prebuilts_clang_host_linux-x86_$D/tar.gz/refs/heads/fifteen" 1 0 2 \
          || fetch "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/$D.tar.gz" 0 1 \
          || { echo "ALL CLANG SOURCES FAILED - no mirror of $D yielded a clang"; df -h /; exit 1; }

          echo "--- which clang did we actually end up with? ---"
          ls -d "$HOME/linux-x86-main/$D" && "$HOME/linux-x86-main/$D/bin/clang" --version

      - name: Toolchain - aarch64-linux-android-4.9
        run: |
          set -e
          D="$HOME/aarch64-linux-android-4.9"

          # googlesource hands out 503s under load, and this step used to pipe
          # curl straight into tar: one bad response killed the build, and the
          # error surfaced as "gzip: unexpected end of file", which reads like
          # a bad archive instead of a bad download.
          #
          # Same shape as the clang step below: download to a file, prove it is
          # a real gzip, then try the mirrors and the strip depths - and prove
          # success by the compiler being executable, not by tar's exit status.
          fetch() {
            url="$1"; shift
            echo "=== trying: $url"
            curl -fSL --retry 6 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --no-progress-meter \
                 -o /tmp/gcc.tar.gz "$url" || { echo "  download failed"; return 1; }
            echo "  downloaded: $(stat -c%s /tmp/gcc.tar.gz) bytes"
            gzip -t /tmp/gcc.tar.gz 2>/dev/null || { echo "  not a gzip - discarding"; return 1; }

            for n in "$@"; do
              rm -rf "$D" && mkdir -p "$D"
              if ! tar -xzf /tmp/gcc.tar.gz -C "$D" --strip-components="$n"; then
                echo "  strip=$n: extract failed, trying the next depth"
                continue
              fi
              if [ -x "$D/bin/aarch64-linux-android-gcc" ]; then
                echo "  OK with --strip-components=$n"
                "$D/bin/aarch64-linux-android-gcc" --version | head -1 || return 1
                rm -f /tmp/gcc.tar.gz
                return 0
              fi
              echo "  strip=$n: no aarch64-linux-android-gcc; what came out was:"
              ls "$D" | head -6
            done
            return 1
          }

          fetch "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android11-release.tar.gz" 0 1 \
          || fetch "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz" 0 1 \
          || fetch "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-19.1.tar.gz" 1 0 \
          || fetch "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-18.1.tar.gz" 1 0 \
          || { echo "ALL GCC SOURCES FAILED - no mirror yielded aarch64-linux-android-gcc"; df -h /; exit 1; }

          ls "$D/bin" | head

      # ------------------------------------------------------- the kdbg source
      # The four files are written here so this workflow stays a single upload.
      - name: Write kdbg sources
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          mkdir -p drivers/kdbg include/linux
          cat > drivers/kdbg/kdbg.h <<'TW_H'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _KDBG_H
          #define _KDBG_H
          
          /*
           * Shared between the kernel side and the userspace client.
           *
           * KDBG_COOKIE is the first argument of every call. Without it the syscall
           * answers -ENOSYS, so a blind probe of the number sees the same thing it would
           * see from an unused table slot.
           */
          #define KDBG_COOKIE	0x9E3779B97F4A7C15ULL
          
          /* KDBG_OP_PING returns this. */
          #define KDBG_MAGIC	0x5032300AUL
          
          enum {
          	KDBG_OP_PING       = 0,	/* -> KDBG_MAGIC				*/
          	KDBG_OP_READ       = 1,	/* a1=pid a2=addr a3=buf a4=len -> bytes	*/
          	KDBG_OP_WRITE      = 2,	/* a1=pid a2=addr a3=buf a4=len -> bytes	*/
          	KDBG_OP_BASE       = 3,	/* a1=pid a2=name a3=&out -> 0		*/
          
          	/*
          	 * Hardware breakpoints.  A breakpoint costs no code change at all:
          	 * nothing is written to the target, so there is no byte to notice and
          	 * nothing that survives a restart of the game.  Four registers is what
          	 * the architecture gives us.
          	 */
          	KDBG_OP_HWBP_SET   = 4,	/* a1=pid a2=addr a3=type a4=len -> slot	*/
          	KDBG_OP_HWBP_DEL   = 5,	/* a1=slot -> 0				*/
          	KDBG_OP_HWBP_STAT  = 6,	/* a1=slot a2=&u64[3] -> 0		*/
          	KDBG_OP_HWBP_ARM   = 7,	/* a1=&struct kdbg_hbp_cfg -> slot		*/
          
          	/*
          	 * Page watches - the fault-path half of a PTE hook.  Arming takes the
          	 * access away from one page in one process; the next time that process
          	 * touches it the kernel records who, from where, and whether it was a
          	 * write, then lets the access through.  The page's own contents are
          	 * never modified, which is the point.
          	 */
          	KDBG_OP_WATCH_ARM  = 8,	/* a1=&struct kdbg_watch_cfg -> slot		*/
          	KDBG_OP_WATCH_STAT = 9,	/* a1=slot a2=&struct kdbg_watch_info -> 0	*/
          	KDBG_OP_WATCH_OFF  = 10,/* a1=slot -> 0				*/
          
          	/*
          	 * Turn the compatibility device nodes on or off at runtime.  They are the
          	 * most visible thing this driver does - a set of /dev entries and
          	 * /sys/class/misc entries that any process can see - so they are OFF
          	 * unless asked for.  Nothing else here is visible at rest.
          	 */
          	KDBG_OP_COMPAT     = 11,/* a1=0 off / 1 on -> nodes registered	*/
          
          	/*
          	 * Is anything actually using the nodes?  Answers the only question that
          	 * matters once a hack is running: it opened one, yes or no, and did it
          	 * then read, write and look up a module through us - or did it open,
          	 * shrug and fall back to process_vm_readv?  The counters start again at
          	 * every `compat on`; `opens` is live and never reset, so a handle nobody
          	 * closed stays visible.
          	 */
          	KDBG_OP_COMPAT_STAT = 12,/* a1=&struct kdbg_compat_stat -> 0		*/
          
          	/*
          	 * The process's memory layout: every mapping, with its permissions and
          	 * the module name when it has a file behind it.  One base address is
          	 * enough to start from a module; an ESP needs the segments, and a
          	 * pointer scan needs to know which regions are worth touching.
          	 */
          	KDBG_OP_MAPS       = 13,/* a1=pid a2=&struct kdbg_maps_req -> 0	*/
          
          	/*
          	 * A batch of transfers in one call.
          	 *
          	 * A client reading a hundred entities per frame otherwise costs a
          	 * hundred kernel entries per frame; this costs one.  Results go back in
          	 * the same array, per entry, so a single bad address does not lose the
          	 * rest of the batch.
          	 */
          	KDBG_OP_XFER       = 14,/* a1=&struct kdbg_xfer[] a2=count a3=write? -> 0 */
          
          	/*
          	 * The memory syscalls, forwarded at build time (see
          	 * include/linux/kdbg.h).  0 = off, 1 = count only, 2 = serve.
          	 */
          	KDBG_OP_HIJACK     = 15,/* a1 = mode -> 0				*/
          
          	/*
          	 * Who has been calling process_vm_readv / writev, and how much.
          	 * a1 = &struct kdbg_pvm_stat[n], a2 = n; returns the current mode.
          	 */
          	KDBG_OP_PVM_STAT   = 16,
          };
          
          #define KDBG_PVM_SLOTS	8
          
          struct kdbg_pvm_stat {
          	int			pid;
          	unsigned int		calls;
          	unsigned long long	bytes;
          	char			comm[16];
          };
          
          #define KDBG_MAP_R	0x1
          #define KDBG_MAP_W	0x2
          #define KDBG_MAP_X	0x4
          #define KDBG_MAP_P	0x8	/* shared, not private			*/
          
          #define KDBG_MAP_NAME	64	/* bytes kept of a mapping's file name	*/
          
          struct kdbg_map {
          	unsigned long long	start;
          	unsigned long long	end;
          	unsigned long long	offset;
          	unsigned int		perm;
          	unsigned int		name_off;	/* ~0u when unnamed	*/
          };
          
          struct kdbg_maps_req {
          	unsigned int		cap;		/* entries the array holds	*/
          	unsigned int		names_cap;	/* bytes in the names buffer	*/
          	/* filled in by the driver */
          	unsigned int		names_used;
          	unsigned int		total;		/* mappings the process has	*/
          	unsigned long long	entries;	/* &struct kdbg_map[cap]	*/
          	unsigned long long	names;		/* char[names_cap]		*/
          };
          
          struct kdbg_xfer {
          	int			pid;
          	unsigned int		len;
          	unsigned long long	addr;
          	unsigned long long	buf;
          	long long		result;		/* bytes, or -errno		*/
          };
          
          #define KDBG_XFER_MAX	128
          
          struct kdbg_compat_stat {
          	unsigned long long	opens;		/* nodes open right now		*/
          	unsigned long long	total_opens;	/* opens since `compat on`	*/
          	unsigned long long	keys;		/* initKey handshakes		*/
          	unsigned long long	reads;
          	unsigned long long	writes;
          	unsigned long long	bases;		/* module-base lookups		*/
          	unsigned long long	denied;		/* refused: no CAP_SYS_PTRACE	*/
          	unsigned long long	prctl_reads;	/* the same driver, reached    */
          	unsigned long long	prctl_writes;	/* through prctl instead       */
          	unsigned long long	prctl_probes;	/* op 5, the get-pid probe     */
          	unsigned long long	sys_reads;	/* plain read(2) on a node     */
          	unsigned long long	sys_writes;	/* plain write(2) on a node    */
          	unsigned long long	mmaps;		/* mmap(2) on a node           */
          	unsigned long long	last_len;	/* the size the last one asked */
          	unsigned long long	xfer_fails;	/* the client was told "no"	*/
          	unsigned long long	xfer_holes;	/* pages not mapped, skipped	*/
          	unsigned long long	max_xfer;	/* the largest single transfer	*/
          	int			holder_pid;	/* the process holding a node	*/
          	int			last_pid;	/* the last process to ioctl	*/
          	char			holder_comm[16];
          	char			last_comm[16];
          	char			last_node[16];	/* which node the last ioctl hit */
          	unsigned int		cmds[8];	/* ioctl request values seen	*/
          	unsigned long long	cmd_hits[8];	/* 0xffffffff = slot unused	*/
          	unsigned int		cmd_arg[8][8];	/* first 32 bytes of the arg	*/
          	unsigned int		pcmds[8];	/* prctl options >= 1024 seen	*/
          	unsigned long long	pcmd_hits[8];
          };
          
          /* a3 of KDBG_OP_HWBP_SET.  X = execute, i.e. call me at this address.
           *
           * KDBG_BP_W (a data watchpoint) is REFUSED by the kernel: the debug exception
           * is taken before the access completes, this kernel does not single-step it,
           * and the access therefore re-executes and traps forever - a storm that freezes
           * the target, whose only escape is skipping the access, which corrupts it.
           * Use a page watch (KDBG_OP_WATCH_*) to find out who touches memory. */
          #define KDBG_BP_X	0
          #define KDBG_BP_W	1
          
          #define KDBG_HBP_SLOTS	4
          
          /*
           * Safety net.  An execute breakpoint traps *before* the instruction runs, so
           * unless the kernel single-steps over it the CPU retries the same instruction
           * and traps again - a livelock that pins a core.  In counting mode, after this
           * many hits the handler skips the instruction once and stops being a loop.
           */
          #define KDBG_HBP_TRIP	64
          
          /*
           * What the breakpoint handler does when it fires.
           *
           * The four that act all leave the pc somewhere else on purpose: an action that
           * left pc alone would trip again on the same instruction and never get out.
           * Nothing here needs a trampoline, so nothing here copies the game's code.
           */
          /*
           * KDBG_ACT_NONE is also REFUSED: counting needs the instruction to execute
           * again after the trap, which is the same storm.  There is no safe way to count
           * hits without single-stepping, so an action is mandatory.
           */
          #define KDBG_ACT_NONE	0	/* refused - see above */
          #define KDBG_ACT_SKIP	1	/* pc += 4 - the instruction does not run  */
          #define KDBG_ACT_RET	2	/* return from the function: pc = x30,
          				   x0 = value.  A function that answers
          				   "yes" forever costs not one byte.        */
          #define KDBG_ACT_PC	3	/* pc = value                              */
          #define KDBG_ACT_X0	4	/* x0 = value, then skip that instruction  */
          #define KDBG_ACT_REG	5	/* regs[reg] = value, then skip it         */
          
          /*
           * A whole set of registers at once, and the same for the floating point ones.
           *
           * The register-write actions are how an aim is built: breakpoint an instruction
           * that computes a direction, replace the values it would have used, and let the
           * rest of the function carry on with them.  GP takes general registers, FP
           * takes SIMD ones by index (3,4,5 are s3/s4/s5).
           *
           * FP writes the low 32 bits of the 128-bit vector, which is what a scalar
           * "s" register is, and sets TIF_FOREIGN_FPSTATE so the kernel reloads the
           * registers from memory on the way back to userspace.  The instruction is
           * skipped in both cases: leaving pc alone would trap on the same instruction
           * forever.
           */
          #define KDBG_ACT_GP	6	/* for i<nregs: regs[regs[i]] = vals[i]    */
          #define KDBG_ACT_FP	7	/* for i<nregs: vregs[regs[i]] = vals[i]   */
          
          /* KDBG_OP_WATCH_ARM modes. */
          #define KDBG_WATCH_WRITE	0	/* next write to the page			*/
          #define KDBG_WATCH_ACCESS	1	/* next read, write or execute		*/
          
          #define KDBG_WATCH_SLOTS	4
          #define KDBG_WATCH_MAX_PAGES	64	/* per slot, one arm		*/
          
          /*
           * The largest single transfer, in bytes.
           *
           * It used to be 1 MB, which is fine for a client that reads a field at a time
           * and wrong for one that pulls a whole table in one call: that got -EINVAL and
           * the client had no way to tell a refused size from a bad address.  The copy
           * loops internally, so raising it costs nothing but the caller's own buffer.
           */
          #define KDBG_MAX_XFER		(32 * 1024 * 1024)
          
          /* kdbg_watch_info.flags */
          #define KDBG_WF_ARMED	0x0001
          #define KDBG_WF_SPENT	0x0002
          #define KDBG_WF_WRITE	0x0004	/* the access that fired was a write	*/
          #define KDBG_WF_ACCESS	0x0008	/* armed in ACCESS mode			*/
          
          #define KDBG_HBP_REGS	8
          
          /* arm for every task on every CPU, not just the target's threads */
          #define KDBG_HBPF_WIDE	0x1
          
          struct kdbg_hbp_cfg {
          	int		pid;
          	unsigned long	type;
          	unsigned long	addr;
          	unsigned long	len;
          	unsigned long	action;
          	unsigned long	value;
          	unsigned long	reg;
          	unsigned long	flags;
          	unsigned long	nregs;
          	unsigned long	regs[KDBG_HBP_REGS];
          	unsigned long	vals[KDBG_HBP_REGS];
          };
          
          struct kdbg_watch_cfg {
          	int		pid;
          	unsigned long	addr;
          	unsigned long	mode;
          	unsigned long	len;	/* bytes; 0 = one page			*/
          };
          
          struct kdbg_watch_info {
          	unsigned long long	hits;
          	unsigned long long	last_pc;
          	unsigned long long	last_task;
          	unsigned long		addr;
          	unsigned long		flags;
          	unsigned long long	regs[8];	/* x0..x7 at the fault	*/
          	unsigned long long	sp;
          };
          
          /* The prctl pass-through, registered in kdbg.c. */
          typedef long (*kdbg_prctl_t)(unsigned long cmd, void __user *arg);
          void kdbg_set_prctl(kdbg_prctl_t fn);
          
          /* The prctl watcher, see include/linux/kdbg.h.  Spelled out rather than named
           * through a typedef, because kdbg_syscall.c sees this header and that one, and
           * a typedef defined in both is a redefinition error under gnu89. */
          void kdbg_set_prctl_note(void (*fn)(int option));
          
          /* What kdbg_syscall.c holds and calls. */
          typedef long (*kdbg_handler_t)(unsigned long op, unsigned long a1,
          			       unsigned long a2, unsigned long a3,
          			       unsigned long a4);
          
          /* Implemented in kdbg_syscall.c.  kdbg_core.c has to register itself through
           * this, so it needs the prototype - which it did not have, and this tree builds
           * with -Werror=implicit-function-declaration. */
          void kdbg_set_handler(kdbg_handler_t fn);
          
          /* Implemented in kdbg_watch.c, which is built into the kernel, not the module:
           * it needs the page-fault path and the core mm helpers. */
          int kdbg_watch_arm(pid_t pid, unsigned long addr, unsigned long mode,
          		   unsigned long len);
          int kdbg_watch_off(unsigned long slot);
          int kdbg_watch_stat(unsigned long slot, struct kdbg_watch_info *out);
          void kdbg_watch_off_all(void);
          
          #endif /* _KDBG_H */
          TW_H
          cat > drivers/kdbg/kdbg_syscall.c <<'TW_S'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * The syscall front end.
           *
           * Its entire body is "call the registered handler". The table entry is emitted
           * by the compiler at build time, so nothing here ever writes to sys_call_table
           * - no set_memory_rw, no text poking, no rwxp page, and nothing for another
           * hook to collide with.
           *
           * If no handler is installed (kdbg_core.ko not loaded) this returns -ENOSYS,
           * which is what an unimplemented table slot returns anyway.
           */
          #include <linux/kernel.h>
          #include <linux/syscalls.h>
          #include <linux/mutex.h>
          #include <linux/export.h>
          #include <linux/uio.h>
          
          #include <linux/kdbg.h>
          
          #include "kdbg.h"
          
          static kdbg_handler_t kdbg_handler __read_mostly;
          static DEFINE_MUTEX(kdbg_mutex);
          
          void kdbg_set_handler(kdbg_handler_t fn)
          {
          	mutex_lock(&kdbg_mutex);
          	kdbg_handler = fn;
          	mutex_unlock(&kdbg_mutex);
          }
          EXPORT_SYMBOL_GPL(kdbg_set_handler);
          
          SYSCALL_DEFINE6(kdbg, unsigned long, cookie, unsigned long, op,
          		unsigned long, a1, unsigned long, a2,
          		unsigned long, a3, unsigned long, a4)
          {
          	kdbg_handler_t fn;
          	long ret;
          
          	if (cookie != KDBG_COOKIE)
          		return -ENOSYS;
          
          	/*
          	 * The mutex is held across the call on purpose: it serialises two
          	 * concurrent callers, and it also means rmmod cannot free the module
          	 * while a call is still inside it (module_exit takes the same lock to
          	 * clear the handler).
          	 */
          	mutex_lock(&kdbg_mutex);
          	fn = kdbg_handler;
          	ret = fn ? fn(op, a1, a2, a3, a4) : -ENOSYS;
          	mutex_unlock(&kdbg_mutex);
          
          	return ret;
          }
          
          /* ---------------------------------------------------------------- prctl ---- */
          
          static kdbg_prctl_t kdbg_prctl_fn __read_mostly;
          static void (*kdbg_prctl_note_fn)(int option) __read_mostly;
          
          void kdbg_set_prctl(kdbg_prctl_t fn)
          {
          	mutex_lock(&kdbg_mutex);
          	kdbg_prctl_fn = fn;
          	mutex_unlock(&kdbg_mutex);
          }
          EXPORT_SYMBOL_GPL(kdbg_set_prctl);
          
          /*
           * Called from SYSCALL_DEFINE5(prctl, ...) for the one magic option.  Same shape
           * as the syscall front end: nothing but "call the registered handler", so the
           * prctl path costs a single predictable branch for every other caller.
           */
          void kdbg_set_prctl_note(void (*fn)(int option))
          {
          	mutex_lock(&kdbg_mutex);
          	kdbg_prctl_note_fn = fn;
          	mutex_unlock(&kdbg_mutex);
          }
          EXPORT_SYMBOL_GPL(kdbg_set_prctl_note);
          
          /* ------------------------------------------------------- memory syscalls ---- */
          
          static kdbg_pvm_t kdbg_pvm_fn __read_mostly;
          
          void kdbg_set_pvm(kdbg_pvm_t fn)
          {
          	mutex_lock(&kdbg_mutex);
          	kdbg_pvm_fn = fn;
          	mutex_unlock(&kdbg_mutex);
          }
          EXPORT_SYMBOL_GPL(kdbg_set_pvm);
          
          /*
           * Called from mm/process_vm_access.c for every process_vm_readv() and
           * process_vm_writev() in the system.
           *
           * No lock: this is on the path of a syscall other software uses, and the
           * pointer is either NULL or a function that lives as long as the module does -
           * module_exit clears it under the mutex before anything is freed.  A call that
           * races an unload is harmless either way, because whoever wins gets either
           * KDBG_NOT_HANDLED or a working answer.
           */
          ssize_t kdbg_pvm_try(pid_t pid, const struct iovec __user *lvec,
          		     unsigned long liovcnt, const struct iovec __user *rvec,
          		     unsigned long riovcnt, int vm_write)
          {
          	kdbg_pvm_t fn = READ_ONCE(kdbg_pvm_fn);
          
          	if (!fn)
          		return KDBG_NOT_HANDLED;
          
          	return fn(pid, lvec, liovcnt, rvec, riovcnt, vm_write);
          }
          EXPORT_SYMBOL_GPL(kdbg_pvm_try);
          
          long kdbg_prctl_entry(int option, unsigned long a2, unsigned long a3)
          {
          	kdbg_prctl_t fn;
          	long ret;
          
          	/* watched first: a magic we do not own is still worth knowing about */
          	if (kdbg_prctl_note_fn)
          		kdbg_prctl_note_fn(option);
          
          	if (option != KDBG_PRCTL_MAGIC)
          		return -EINVAL;
          
          	mutex_lock(&kdbg_mutex);
          	fn = kdbg_prctl_fn;
          	ret = fn ? fn(a2, (void __user *)a3) : -EINVAL;
          	mutex_unlock(&kdbg_mutex);
          
          	return ret;
          }
