          	/* miscdevice.name has to outlive this call, hence the static copies */
          	strlcpy(list, TOWA_COMPAT_DEVS, sizeof(list));
          
          	while (p && *p && towa_misc_n < TOWA_COMPAT_MAX) {
          		tok = strsep(&p, ",");
          		if (!tok || !*tok)
          			continue;
          
          		for (i = 0; i < towa_misc_n; i++)
          			if (!strcmp(towa_misc_name[i], tok))
          				break;
          		if (i < towa_misc_n)
          			continue;
          
          		strlcpy(towa_misc_name[towa_misc_n], tok, 32);
          		towa_misc[towa_misc_n].name  = towa_misc_name[towa_misc_n];
          		towa_misc[towa_misc_n].minor = MISC_DYNAMIC_MINOR;
          		towa_misc[towa_misc_n].fops  = &towa_compat_fops;
          		towa_misc[towa_misc_n].mode  = 0666;
          
          		if (misc_register(&towa_misc[towa_misc_n]))
          			continue;
          
          		towa_misc_n++;
          	}
          
          	towa_proc = proc_create(TOWA_COMPAT_PROC, 0666, NULL, &towa_compat_fops);
          
          	return 0;
          }
          
          static void towa_compat_cleanup(void)
          {
          	int i;
          
          	if (towa_proc) {
          		remove_proc_entry(TOWA_COMPAT_PROC, NULL);
          		towa_proc = NULL;
          	}
          
          	for (i = 0; i < towa_misc_n; i++)
          		misc_deregister(&towa_misc[i]);
          	towa_misc_n = 0;
          }
          
          /* ------------------------------------------------------------------ dispatch */
          
          static long towa_dispatch(unsigned long op, unsigned long a1, unsigned long a2,
          			  unsigned long a3, unsigned long a4)
          {
          	switch (op) {
          	case TOWA_OP_PING:
          		return TOWA_MAGIC;
          
          	case TOWA_OP_READ:
          		return towa_rw((pid_t)a1, a2, (void __user *)a3, a4, false);
          	case TOWA_OP_WRITE:
          		return towa_rw((pid_t)a1, a2, (void __user *)a3, a4, true);
          
          	case TOWA_OP_BASE: {
          		unsigned long b = 0;
          		long r = towa_find_base((pid_t)a1, (const char __user *)a2, &b);
          
          		if (r)
          			return r;
          		return put_user(b, (unsigned long __user *)a3) ? -EFAULT : 0;
          	}
          
          	case TOWA_OP_HWBP_SET:
          	case TOWA_OP_HWBP_DEL:
          	case TOWA_OP_HWBP_STAT:
          	case TOWA_OP_HWBP_ARM:
          #ifdef CONFIG_HAVE_HW_BREAKPOINT
          		if (op == TOWA_OP_HWBP_SET)
          			return towa_hbp_set((pid_t)a1, a2, a3, a4,
          					    TOWA_ACT_NONE, 0, 0);
          		if (op == TOWA_OP_HWBP_ARM) {
          			struct towa_hbp_cfg cfg;
          
          			if (copy_from_user(&cfg, (void __user *)a1, sizeof(cfg)))
          				return -EFAULT;
          			return towa_hbp_set(cfg.pid, cfg.addr, cfg.type, cfg.len,
          					    cfg.action, cfg.value, cfg.reg);
          		}
          		if (op == TOWA_OP_HWBP_DEL)
          			return towa_hbp_del(a1);
          		return towa_hbp_stat(a1, (unsigned long __user *)a2);
          #else
          		return -EOPNOTSUPP;
          #endif
          
          	case TOWA_OP_WATCH_ARM:
          		return towa_watch_arm((pid_t)a1, a2, a3);
          
          	case TOWA_OP_WATCH_STAT: {
          		struct towa_watch_info info;
          		long r = towa_watch_stat(a1, &info);
          
          		if (r)
          			return r;
          		return copy_to_user((void __user *)a2, &info, sizeof(info))
          			? -EFAULT : 0;
          	}
          
          	case TOWA_OP_WATCH_OFF:
          		return towa_watch_off(a1);
          
          	default:
          		return -EINVAL;
          	}
          }
          
          static int __init towa_core_init(void)
          {
          	towa_set_handler(towa_dispatch);
          	towa_compat_init();
          	return 0;
          }
          
          #ifdef MODULE
          static void __exit towa_core_exit(void)
          {
          	towa_compat_cleanup();
          	towa_hbp_cleanup();
          	towa_watch_off_all();	/* pages go back to normal before we leave */
          	towa_set_handler(NULL);
          }
          
          module_init(towa_core_init);
          module_exit(towa_core_exit);
          MODULE_LICENSE("GPL");
          MODULE_DESCRIPTION("towa core");
          #else
          late_initcall(towa_core_init);
          #endif
          TW_C
          cat > drivers/towa/Makefile <<'TW_M'
          # The syscall stub and the page-watch code are built into the kernel: the first
          # because a syscall table entry can only be emitted at build time, the second
          # because it needs a call site inside do_page_fault() and the core mm helpers.
          obj-y				+= towa_syscall.o
          obj-y				+= towa_watch.o
          
          # Everything that actually touches memory, and therefore everything that gets
          # iterated: =m gives towa_core.ko.
          obj-$(CONFIG_TOWA_CORE)		+= towa_core.o
          TW_M
          cat > drivers/towa/Kconfig <<'TW_K'
          config TOWA_CORE
          	tristate "towa kernel-assisted memory access"
          	default n
          	help
          	  The worker half of the towa syscall: memory read/write, module base,
          	  hardware breakpoints and page watches.  As a module (=m) it can be
          	  loaded and unloaded at will and the syscall is inert while it is out;
          	  built in (=y) it arms itself at boot and nothing shows up in
          	  /proc/modules at all.
          
          	  The syscall itself and the page-fault hook are always built in,
          	  because neither can live in a module.
          TW_K
          cat > include/linux/towa_watch.h <<'TW_I'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _LINUX_TOWA_WATCH_H
          #define _LINUX_TOWA_WATCH_H
          
          struct pt_regs;
          
          /*
           * Call site is inside do_page_fault(), with mm->mmap_sem held for read and the
           * faulting task being current.  Observes only: it never claims the fault, so
           * the normal handling always goes ahead and the access always succeeds.
           * Costs one perfectly-predicted branch while no watch is armed.
           */
          int towa_watch_fault(struct pt_regs *regs, unsigned long addr, unsigned int esr);
          
          #endif /* _LINUX_TOWA_WATCH_H */
          TW_I
          echo "--- written ---"
          ls -l drivers/towa/ include/linux/towa_watch.h
          wc -l drivers/towa/*.c drivers/towa/*.h
      - name: Hook the page-fault path
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          F=arch/arm64/mm/fault.c
          test -f "$F" || { echo "no $F"; exit 1; }
          
          python3 - "$F" <<'PYFAULT'
          import re, sys
          
          path = sys.argv[1]
          src = open(path).read()
          
          # ---- 1. the prototype -------------------------------------------------------
          if 'towa_watch.h' not in src:
              anchor = '#include <asm/tlbflush.h>'
              if anchor in src:
                  src = src.replace(anchor, anchor + '\n#include <linux/towa_watch.h>', 1)
              else:
                  lines = src.split('\n')
                  last = max(i for i, l in enumerate(lines) if l.startswith('#include'))
                  lines.insert(last + 1, '#include <linux/towa_watch.h>')
                  src = '\n'.join(lines)
              print('added the include')
          
          # ---- 2. the call site, inside do_page_fault, with mmap_sem held -------------
          CALL = 'towa_watch_fault(regs, addr, esr);'
          if CALL not in src:
              # The call has to go where mmap_sem is already held and addr, esr, regs and
              # mm are all live: the line that hands the fault on.  Do NOT anchor on
              # down_read(&mm->mmap_sem) - this tree has no such call.  It backported the
              # 5.x mmap locking API, so the lock is taken with mmap_read_lock(), and it
              # sits inside an if/else that is only half the paths.
              lines = src.split('\n')
          
              hit = None
              for i, l in enumerate(lines):
                  if l.strip().startswith('fault = __do_page_fault('):
                      hit = i
                      break
              if hit is None:
                  sys.exit('no "fault = __do_page_fault(" call in %s - the tree changed' % path)
          
              indent = lines[hit][:len(lines[hit]) - len(lines[hit].lstrip())]
              lines[hit:hit] = [
                  indent + '/*',
                  indent + ' * towa page watches.  mmap_sem is held by this point, and',
                  indent + ' * addr, esr and regs are all live.  Observes only - it never',
                  indent + ' * claims the fault, so the access always succeeds.',
                  indent + ' */',
                  indent + 'towa_watch_fault(regs, addr, esr);',
                  '',
              ]
              src = '\n'.join(lines)
              print('added the call site before the __do_page_fault() call')
          
          assert CALL in src, 'the call site did not land'
          open(path, 'w').write(src)
          PYFAULT
          
          echo "--- what the fault path now looks like ---"
          grep -n 'towa_watch' "$F"
          echo "--- context ---"
          awk '/towa_watch_fault\(regs, addr, esr\);/{for(i=NR-12;i<=NR+2;i++) want[i]=1} {l[NR]=$0} END{for(i=1;i<=NR;i++) if(want[i]) print i": "l[i]}' "$F"
      - name: Add the towa syscall number
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          U=include/uapi/asm-generic/unistd.h
          NR=$(grep -m1 '^#define __NR_syscalls' "$U" | awk '{print $3}')
          echo "highest existing syscall number = $NR  -> towa will be $NR"

          python3 - "$U" "$NR" <<'PYEOF'
          import sys
          path, nr = sys.argv[1], int(sys.argv[2])
          lines = open(path).read().split('\n')

          # Insert immediately before the LAST "#undef __NR_syscalls", i.e. at the
          # end of the syscall list, and bump the table size to match.
          last = max(i for i, l in enumerate(lines) if l.startswith('#undef __NR_syscalls'))
          lines[last:last] = [
              '#define __NR_towa %d' % nr,
              '#ifndef __SYSCALL_COMPAT',
              '__SYSCALL(__NR_towa, sys_towa)',
              '#endif',
          ]
          for i in range(len(lines) - 1, -1, -1):
              if lines[i].startswith('#define __NR_syscalls'):
                  lines[i] = '#define __NR_syscalls %d' % (nr + 1)
                  break
          open(path, 'w').write('\n'.join(lines))
          PYEOF

          echo "--- tail of $U ---"
          tail -14 "$U"
          echo "--- who else builds a table from this header ---"
          grep -rn '__SYSCALL_COMPAT' arch/arm64/kernel/ arch/arm64/include/asm/unistd.h 2>/dev/null || echo "  none in arch/arm64"

          # drivers/Makefile + drivers/Kconfig
          grep -q 'towa/' drivers/Makefile || printf 'obj-y\t\t\t\t+= towa/\n' >> drivers/Makefile
          grep -q 'drivers/towa/Kconfig' drivers/Kconfig || printf 'source "drivers/towa/Kconfig"\n' >> drivers/Kconfig
          grep -n 'towa' drivers/Makefile drivers/Kconfig

      # ------------------------------------------------------------ config tweaks
      - name: Kernel config
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          DEF="arch/arm64/configs/vendor/m23xq_eur_open_defconfig"
          [ -f "$DEF" ] || DEF="arch/arm64/configs/vendor/lito-perf_defconfig"
          [ -f "$DEF" ] || { echo "no defconfig"; ls arch/arm64/configs/vendor/ | head -30; exit 1; }
          echo "defconfig: $DEF"

          # n -> =m: a loadable towa_core.ko, which is what gets iterated.
          # y -> =y: armed at boot, and /proc/modules stays empty.
          if [ "${{ inputs.builtin }}" = "y" ]; then
            TOWAMODE=y
          else
            TOWAMODE=m
          fi
          sed -i -e '/^CONFIG_TOWA_CORE=/d' -e '/^# CONFIG_TOWA_CORE is not set$/d' "$DEF"
          printf 'CONFIG_TOWA_CORE=%s\n' "$TOWAMODE" >> "$DEF"
          echo "towa_core will be built as: $TOWAMODE"

          # The running 191 kernel already has these; the tree may not.
          sed -i -e '/^CONFIG_MODULE_FORCE_LOAD=/d' -e '/^# CONFIG_MODULE_FORCE_LOAD is not set$/d' "$DEF"
          printf 'CONFIG_MODULE_FORCE_LOAD=y\n' >> "$DEF"

          if grep -q 'CONFIG_MODULE_SIG=y' "$DEF"; then
            sed -i -e '/^CONFIG_MODULE_SIG=/d' -e '/^# CONFIG_MODULE_SIG is not set$/d' \
                   -e '/^CONFIG_MODULE_SIG_FORCE=/d' -e '/^# CONFIG_MODULE_SIG_FORCE is not set$/d' "$DEF"
            printf '# CONFIG_MODULE_SIG is not set\n' >> "$DEF"
          fi

          # Belt and braces for the tree that force-enables it (the 325 one does).
          F=kernel/module.c
          if grep -q '^static bool sig_enforce = IS_ENABLED(CONFIG_MODULE_SIG_FORCE);$' "$F"; then
            sed -i 's/^static bool sig_enforce = IS_ENABLED(CONFIG_MODULE_SIG_FORCE);$/static bool sig_enforce = false;/' "$F"
            echo "sig_enforce forced off in kernel/module.c"
          else
            echo "sig_enforce line not present - leaving module.c alone"
          fi

          grep -n 'TOWA_CORE\|MODULE_FORCE_LOAD\|MODULE_SIG' "$DEF"

      # Our files, first, alone - about a minute and a half.
      #
      # A kernel build runs four jobs in parallel, so a compile error in
      # drivers/towa scrolls past among thousands of QCACLD lines and the log
      # ends eleven minutes later with a bare "Makefile:1234: drivers Error 2".
      # That is exactly what happened and it cost two round trips. Configuring
      # the tree the way build_lito_kernel.sh does and compiling only our three
      # objects makes any error the only thing in this step's output.
      - name: Compile towa sources only
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set +e
          export PATH="$HOME/linux-x86-main/${{ inputs.clang_dir }}/bin:$HOME/aarch64-linux-android-4.9/bin:$PATH"
          P="CC=clang LLVM_IAS=1 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- DTC_OVERLAY_TEST_EXT=$PWD/tools/ufdt_apply_overlay"

          DEF=vendor/lito-perf_defconfig
          [ -f "arch/arm64/configs/$DEF" ] || DEF=$(ls arch/arm64/configs/vendor/*perf_defconfig 2>/dev/null | head -1 | sed 's|arch/arm64/configs/||')
          echo "defconfig: $DEF"

          make O=out $P ARCH=arm64 "$DEF" > /tmp/cfg.log 2>&1
          cfgrc=$?
          echo "### defconfig exit: $cfgrc"
          if [ "$cfgrc" -ne 0 ]; then tail -30 /tmp/cfg.log; exit $cfgrc; fi

          make O=out $P ARCH=arm64 olddefconfig >> /tmp/cfg.log 2>&1
          make O=out $P ARCH=arm64 prepare      >> /tmp/cfg.log 2>&1
          echo "--- the three switches that decide what our code compiles as ---"
          grep -E '^CONFIG_(TOWA_CORE|MODULES|HAVE_HW_BREAKPOINT|PERF_EVENTS)' out/.config || true

          rc=0
          : > /tmp/towa.log
          # Our three files, plus the two tree files we patched.  The patched
          # ones are the only integration points, and compiling them here costs
          # seconds instead of being discovered ten minutes into the real build.
          for o in drivers/towa/towa_syscall.o drivers/towa/towa_watch.o \
                   drivers/towa/towa_core.o \
                   arch/arm64/kernel/sys.o arch/arm64/mm/fault.o; do
            echo "=== $o" >> /tmp/towa.log
            make O=out $P ARCH=arm64 "$o" >> /tmp/towa.log 2>&1 || rc=1
          done

          echo "### compile exit: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "=========== OUR ERRORS (with context) ==========="
            grep -n -B 2 -A 6 -E 'error:|错误' /tmp/towa.log || tail -40 /tmp/towa.log
            # also as an annotation, so it shows on the run summary page
            grep -m 8 -E 'error:' /tmp/towa.log | while IFS= read -r l; do
              echo "::error::$(printf '%s' "$l" | sed 's/%/%25/g; s/\r//g')"
            done
          else
            echo "all five objects compiled cleanly:"
            ls -l out/drivers/towa/ 2>/dev/null

            # A compile proves nothing about the link, and the link is where a
            # 10-minute run actually died.  So compare the two symbols the
            # patched tree files need against our objects' definitions, here,
            # in seconds.
            echo "--- what the patched files ask for, and what we provide ---"
            for pair in "arch/arm64/kernel/sys.o:__arm64_sys_towa" \
                        "arch/arm64/mm/fault.o:towa_watch_fault"; do
              obj="out/${pair%%:*}"; sym="${pair##*:}"
              echo "  $sym"
              nm "$obj" 2>/dev/null | grep -E "[UT] $sym\$" | sed 's/^/    needed: /' \
                || echo "    needed: (not referenced - the patch did not land?)"
              nm "out/drivers/towa/$( [ "$sym" = towa_watch_fault ] && echo towa_watch.o || echo towa_syscall.o )" \
                2>/dev/null | grep -E "T $sym\$" | sed 's/^/    given : /' \
                || echo "    given : MISSING - this is the unresolved symbol"
            done
          fi
          exit $rc

      - name: Build kernel
        working-directory: ${{ github.workspace }}/kernel
        run: |
          chmod +x tools/* 2>/dev/null || true
          export MAKEFLAGS="-j$(nproc)"

          # Everything goes to a log, and on failure the interesting lines are
          # printed LAST - so the end of this step is always the answer, and
          # nobody has to scroll a 40-minute log to find one line of error.
          set +e
          # lito first: that is the script on Boostkernel2-cip (the 325 tree), and
          # the one the device's own kernels were built with. cheetkernel has
          # build_kernel.sh instead.
          if [ -f build_lito_kernel.sh ]; then
            echo "using build_lito_kernel.sh"
            chmod +x build_lito_kernel.sh
            sed -i 's/^BUILD_JOB_NUMBER=8$/BUILD_JOB_NUMBER=4/' build_lito_kernel.sh
            echo "${{ inputs.model }}" | ./build_lito_kernel.sh > /tmp/build.log 2>&1
            rc=$?
          elif [ -f build_kernel.sh ]; then
            echo "using build_kernel.sh"
            chmod +x build_kernel.sh
            ./build_kernel.sh > /tmp/build.log 2>&1
            rc=$?
          else
            echo "no build script"; ls -l *.sh; exit 1
          fi

          echo "### build exit code: $rc"
          echo "### last 25 lines"
          tail -25 /tmp/build.log

          if [ "$rc" -ne 0 ]; then
            echo "=========== ERROR LINES ==========="
            grep -n -m 25 -E 'error:|ERROR:|Error [1-9]|错误|No rule to make|undefined!|undefined reference|multiple definition' /tmp/build.log \
              || echo "  (no line matched 'error:' - see the tail above)"
            echo "=========== CONTEXT AROUND THE FIRST 'error:' ==========="
            first=$(grep -n -m1 'error:' /tmp/build.log | cut -d: -f1)
            if [ -n "$first" ]; then
              sed -n "$(( first > 12 ? first - 12 : 1 )),$(( first + 8 ))p" /tmp/build.log
            fi

            # Annotations appear on the RUN SUMMARY page itself, so the cause is
            # readable without opening (or scrolling) a 40-minute log.  A link
            # error has no "error:" line, so fall back to the undefined-symbol
            # and last-resort lines.
            ann() { grep -m 8 -E "$1" /tmp/build.log | while IFS= read -r l; do
                      echo "::error::$(printf '%s' "$l" | sed 's/%/%25/g; s/\r//g')"; done; }
            ann 'error:|ERROR:'
            ann 'undefined!|undefined reference|undefined symbol|multiple definition'
            if ! grep -qE 'error:|ERROR:|undefined!|undefined reference|undefined symbol' /tmp/build.log; then
              tail -3 /tmp/build.log | while IFS= read -r l; do
                echo "::error::$(printf '%s' "$l" | sed 's/%/%25/g; s/\r//g')"; done
            fi
            echo "=========== OUR OWN FILES IN THE LOG ==========="
            grep -n 'drivers/towa' /tmp/build.log | tail -20
          fi
          exit $rc

      # A plain `make` builds vmlinux; modules are a separate target. This step
      # is also what produces towa_core.ko.
      - name: Build towa_core.ko
        if: ${{ inputs.builtin != 'y' }}
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set +e
          export PATH="$HOME/linux-x86-main/${{ inputs.clang_dir }}/bin:$HOME/aarch64-linux-android-4.9/bin:$PATH"
          if [ -f out/Module.symvers ]; then OOPT="O=out"; else OOPT=""; fi
          echo "O option: '$OOPT'"
          make $OOPT ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- M=drivers/towa modules \
               > /tmp/ko.log 2>&1
          rc=$?
          echo "### module build exit: $rc"
          tail -40 /tmp/ko.log
          if [ "$rc" -ne 0 ]; then
            echo "=========== ERROR LINES ==========="
            grep -n -m 25 -E 'error:|Error [1-9]|undefined!' /tmp/ko.log || true
          fi
          [ "$rc" -eq 0 ] || exit $rc
          set -e
          KO=$(find . -name 'towa_core.ko' | head -1)
          [ -n "$KO" ] || { echo "towa_core.ko NOT BUILT"; exit 1; }
          echo "--- $KO ---"
          ls -l "$KO"
          echo "--- vermagic (must match the Image built in this same run) ---"
          modinfo -F vermagic "$KO"
          echo "--- did the breakpoint symbols resolve? (modpost would already have failed otherwise) ---"
          nm -u "$KO" 2>/dev/null | grep -i 'hw_breakpoint\|perf' || echo "  no unresolved breakpoint symbols"
          nm "$KO" 2>/dev/null | grep -i 'towa_hbp\|towa_read\|towa_dispatch' || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$KO" "$GITHUB_WORKSPACE/out/towa_core.ko"

      - name: Collect and verify output
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          IMG=out/arch/arm64/boot/Image
          test -s "$IMG" || { echo "MISSING $IMG"; find out -name 'Image*' | head; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$IMG" "$GITHUB_WORKSPACE/out/Image"
          echo "--- banner ---"
          strings -a "$IMG" | grep -m1 '^Linux version'
          DTB=$(ls out/arch/arm64/boot/dts/vendor/qcom/lagoon.dtb 2>/dev/null || find out/arch/arm64/boot -name 'lagoon.dtb' | head -1)
          [ -n "$DTB" ] && cp "$DTB" "$GITHUB_WORKSPACE/out/dtb" || echo "WARN: no lagoon.dtb"
          [ -s out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img "$GITHUB_WORKSPACE/out/dtbo" || echo "WARN: no dtbo.img"

          python3 - "$IMG" <<'PYEOF'
          import sys, gzip, re
          d = open(sys.argv[1], 'rb').read()
          s, e = d.find(b'IKCFG_ST'), d.find(b'IKCFG_ED')
          if s < 0 or e < s:
              print('no embedded config found'); sys.exit(0)
          cfg = gzip.decompress(d[s+8:e]).decode('utf-8', 'replace')
          for opt in ('CONFIG_TOWA_CORE', 'CONFIG_MODULES', 'CONFIG_MODULE_SIG',
                      'CONFIG_MODULE_SIG_FORCE', 'CONFIG_MODULE_FORCE_LOAD',
                      'CONFIG_STRICT_KERNEL_RWX', 'CONFIG_MODVERSIONS',
                      'CONFIG_HAVE_HW_BREAKPOINT', 'CONFIG_PERF_EVENTS'):
              m = [l for l in cfg.splitlines() if re.match(r'^(# )?' + opt + r'[ =]', l)]
              print('  %-30s %s' % (opt, m[0] if m else 'ABSENT'))
          PYEOF

          # The stub has to be in the linked kernel, or the whole point is lost.
          VML=$(ls out/vmlinux 2>/dev/null || echo "")
          if [ -n "$VML" ]; then
            echo "--- is the syscall in vmlinux? ---"
            nm "$VML" 2>/dev/null | grep -i 'sys_towa\|towa_set_handler' || echo "  NOT FOUND (built-in table entry missing)"
            echo "--- and is the kernel able to give us breakpoints? ---"
            nm "$VML" 2>/dev/null | grep -i 'register_user_hw_breakpoint\|hw_breakpoint_init' || echo "  not present"
          fi
          ls -l "$GITHUB_WORKSPACE/out/"

      - name: Build the client (towacli)
        run: |
          set -e
          # The kernel build is finished and its outputs are in $GITHUB_WORKSPACE/out, so
          # the object files can go - the NDK needs the room.
          rm -rf "$GITHUB_WORKSPACE/kernel/out"
          df -h / | tail -1
          
          mkdir -p "$GITHUB_WORKSPACE/tools"
          cat > "$GITHUB_WORKSPACE/tools/towacli.cpp" <<'TW_CLI'
          // towacli.cpp - talk to the towa kernel syscall.
          //
          // Build this in AIDE Pro as a plain C++ native executable. It needs no root,
          // no su, no zygisk and no injection: the kernel does the cross-process memory
          // access, and the syscall itself has no permission check, so SELinux, ptrace
          // scope, /proc/<pid>/mem's EACCES and the target's own VMA permissions are all
          // irrelevant.
          //
          // If the build log printed a syscall number other than 294, either change
          // NR_TOWA below or pass -n <number> as the first argument.
          
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <cstdint>
          #include <cerrno>
          #include <string>
          #include <vector>
          #include <dirent.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          
          #define TOWA_COOKIE 0x9E3779B97F4A7C15ULL
          #define TOWA_MAGIC  0x5032300AUL
          
          static const unsigned long kElfMagic = 0x464C457FUL;   // "\x7fELF" little-endian
          
          enum {
              TOWA_OP_PING       = 0,
              TOWA_OP_READ       = 1,
              TOWA_OP_WRITE      = 2,
              TOWA_OP_BASE       = 3,
              TOWA_OP_HWBP_SET   = 4,
              TOWA_OP_HWBP_DEL   = 5,
              TOWA_OP_HWBP_STAT  = 6,
              TOWA_OP_HWBP_ARM   = 7,
              TOWA_OP_WATCH_ARM  = 8,
              TOWA_OP_WATCH_STAT = 9,
              TOWA_OP_WATCH_OFF  = 10,
          };
          
          #define TOWA_BP_X 0
          #define TOWA_BP_W 1
          
          #define TOWA_ACT_NONE 0
          #define TOWA_ACT_SKIP 1
          #define TOWA_ACT_RET  2
          #define TOWA_ACT_PC   3
          #define TOWA_ACT_X0   4
          #define TOWA_ACT_REG  5
          
          #define TOWA_WATCH_WRITE  0
          #define TOWA_WATCH_ACCESS 1
          
          #define TOWA_WF_ARMED  0x1
          #define TOWA_WF_SPENT  0x2
          #define TOWA_WF_WRITE  0x4
          #define TOWA_WF_ACCESS 0x8
          
          // Layouts must match struct towa_hbp_cfg / towa_watch_info in towa.h exactly.
          struct towa_hbp_cfg {
              int pid;
              unsigned long type;
              unsigned long addr;
              unsigned long len;
              unsigned long action;
              unsigned long value;
              unsigned long reg;
          };
          
          struct towa_watch_info {
              unsigned long long hits;
              unsigned long long last_pc;
              unsigned long long last_task;
              unsigned long addr;
              unsigned long flags;
          };
          
          // The syscall number is NOT fixed: it is whatever was free in the tree the
          // kernel was built from (this one's table already runs to 442).  The CI compiles
          // this file with -DNR_TOWA=<the number it just installed>.  Built without it,
          // there is no safe guess - calling a random number with six arguments would hit
          // somebody else's syscall - so the default is 0 and main() refuses to run.
          #ifndef NR_TOWA
          #define NR_TOWA 0
          #endif
          
          // Filled in by the build with the date and time, so there is never any doubt
          // about which binary is being run.
          #ifndef TOWACLI_BUILD
          #define TOWACLI_BUILD "unstamped"
          #endif
          
          static unsigned long g_nr = NR_TOWA;
          
          static long towa(unsigned long op, unsigned long a1 = 0, unsigned long a2 = 0,
                           unsigned long a3 = 0, unsigned long a4 = 0)
          {
              return syscall((long)g_nr, (unsigned long)TOWA_COOKIE, op, a1, a2, a3, a4);
          }
          
          static void perr(const char *what, long r)
          {
              /*
               * syscall() does NOT hand back the negated errno: it returns -1 and puts
               * the real code in errno, exactly like every other libc call.  Reading -r
               * here printed strerror(1) - "Operation not permitted" - for every possible
               * failure, which is worse than printing nothing.  Read errno first, before
               * strerror() or fprintf() get a chance to touch it.
               */
              int e = (r == -1) ? errno : (int)-r;
          
              fprintf(stderr, "%-10s failed: %s (%d)\n", what, strerror(e), e);
          }
          
          // ---------------------------------------------------------------- process lookup
          
          static bool first_token_is(const char *path, const char *want)
          {
              int fd = open(path, O_RDONLY);
              if (fd < 0) return false;
          
              char buf[256];
              ssize_t n = read(fd, buf, sizeof(buf) - 1);
              close(fd);
              if (n <= 0) return false;
              buf[n] = '\0';
          
              return strcmp(buf, want) == 0;
          }
          
          static bool any_token_is(const char *path, const char *want)
          {
              int fd = open(path, O_RDONLY);
              if (fd < 0) return false;
          
              char buf[512];
              ssize_t n = read(fd, buf, sizeof(buf) - 1);
              close(fd);
              if (n <= 0) return false;
              buf[n] = '\0';
          
              for (ssize_t i = 0; i < n; i++)
                  if (buf[i] == '\0') buf[i] = ' ';
          
              return strstr(buf, want) != NULL;
          }
          
          // Prefer the main process: its cmdline is exactly the package name. The
          // helpers (":prime", ":unity") are matched only if nothing else is.
          static int find_pid(const char *name)
          {
              DIR *d = opendir("/proc");
              if (!d) return -1;
          
              int exact = -1, loose = -1;
              struct dirent *e;
          
              while ((e = readdir(d)) != NULL) {
                  if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
          
                  char path[64];
                  snprintf(path, sizeof(path), "/proc/%s/cmdline", e->d_name);
          
                  if (exact < 0 && first_token_is(path, name))
                      exact = atoi(e->d_name);
                  else if (loose < 0 && any_token_is(path, name))
                      loose = atoi(e->d_name);
              }
              closedir(d);
          
              return exact >= 0 ? exact : loose;
          }
          
          // A pid, or a process name - "13696" or "com.dts.freefireth" both work, so
          // nothing has to be looked up and pasted by hand.
          static int resolve_pid(const char *s)
          {
              if (!s || !*s) return -1;
              for (const char *c = s; *c; c++)
                  if (*c < '0' || *c > '9') return find_pid(s);
              return atoi(s);
          }
          
          /*
           * The stack pointer of a pid, straight out of /proc/<pid>/syscall.
           *
           * That file is "<nr> <arg0..arg5> <sp> <pc>" while the task is in a syscall,
           * and a single word like "running" when it is not - so this retries briefly
           * rather than reporting failure for a thread that is simply on-CPU right now.
           */
          /*
           * A thread's name, out of /proc/<tid>/comm.  The kernel truncates it to 15
           * characters, which is why the thread list shows things like "IL2CPP Threadpo".
           */
          static void read_comm(int tid, char *buf, size_t n)
          {
              char p[64];
              snprintf(p, sizeof(p), "/proc/%d/comm", tid);
          
              buf[0] = '\0';
              int fd = open(p, O_RDONLY);
              if (fd < 0) return;
          
              ssize_t got = read(fd, buf, n - 1);
              close(fd);
              if (got <= 0) { buf[0] = '\0'; return; }
              buf[got] = '\0';
          
              char *nl = strchr(buf, '\n');
              if (nl) *nl = '\0';
          }
          
          // The first live thread of `pid` whose name matches - exactly, or with either
          // side being the other's prefix, since comm is truncated at 15 characters.
          // Threads come and go, so this is resolved at the moment it is used.
          static int find_thread(int pid, const char *want)
          {
              char dir[64];
              snprintf(dir, sizeof(dir), "/proc/%d/task", pid);
          
              DIR *d = opendir(dir);
              if (!d) return -1;
          
              int found = -1;
              struct dirent *e;
          
              while ((e = readdir(d)) != NULL) {
                  if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
          
                  int tid = atoi(e->d_name);
                  char comm[64];
                  read_comm(tid, comm, sizeof(comm));
                  if (!comm[0]) continue;
          
                  size_t a = strlen(comm), b = strlen(want);
                  size_t k = a < b ? a : b;
                  if (k >= 4 && !strncmp(comm, want, k)) { found = tid; break; }
              }
              closedir(d);
              return found;
          }
          
          static unsigned long proc_sp(int pid)
          {
              char path[64];
              char buf[512];
              unsigned long v[9];
              int got;
          
              snprintf(path, sizeof(path), "/proc/%d/syscall", pid);
              int fd = open(path, O_RDONLY);
              if (fd < 0) return 0;
          
              ssize_t n = read(fd, buf, sizeof(buf) - 1);
              close(fd);
              if (n <= 0) return 0;
              buf[n] = '\0';
          
              got = sscanf(buf, "%lu %lx %lx %lx %lx %lx %lx %lx %lx",
                           &v[0], &v[1], &v[2], &v[3], &v[4], &v[5], &v[6], &v[7], &v[8]);
              if (got < 9) return 0;          /* "running", or not a traced-able task */
          
              return v[7];                    /* sp */
          }
          
          // ---------------------------------------------------------------- towa wrappers
          
          static int towa_read(int pid, unsigned long addr, void *buf, unsigned long len)
          {
              long r = towa(TOWA_OP_READ, (unsigned long)pid, addr,
                            (unsigned long)buf, len);
              if (r < 0) { perr("read", r); return -1; }
              return (int)r;
          }
          
          static int towa_write(int pid, unsigned long addr, const void *buf, unsigned long len)
          {
              long r = towa(TOWA_OP_WRITE, (unsigned long)pid, addr,
                            (unsigned long)buf, len);
              if (r < 0) { perr("write", r); return -1; }
              return (int)r;
          }
          
          static unsigned long towa_base(int pid, const char *soname)
          {
              char name[64];
              unsigned long out = 0;
          
              snprintf(name, sizeof(name), "%s", soname);
          
              long r = towa(TOWA_OP_BASE, (unsigned long)pid, (unsigned long)name,
                            (unsigned long)&out, 0);
              if (r < 0) { perr("base", r); return 0; }
              return out;
          }
          
          // ---------------------------------------------------------------- breakpoints
          
          static long towa_hbp_arm(int pid, unsigned long addr, unsigned long type,
                                   unsigned long action, unsigned long value,
                                   unsigned long reg)
          {
              towa_hbp_cfg cfg;
              memset(&cfg, 0, sizeof(cfg));
              cfg.pid    = pid;
              cfg.type   = type;
              cfg.addr   = addr;
              cfg.action = action;
              cfg.value  = value;
              cfg.reg    = reg;
          
              long r = towa(TOWA_OP_HWBP_ARM, (unsigned long)&cfg);
              if (r < 0) perr("hbp arm", r);
              return r;
          }
          
          static long towa_hbp_del(unsigned long slot)
          {
              long r = towa(TOWA_OP_HWBP_DEL, slot);
              if (r < 0) perr("hbp del", r);
              return r;
          }
          
          static void towa_hbp_stat(unsigned long slot)
          {
              unsigned long long v[4] = { 0, 0, 0, 0 };
          
              long r = towa(TOWA_OP_HWBP_STAT, slot, (unsigned long)v);
              if (r < 0) { perr("hbp stat", r); return; }
          
              printf("slot %lu  hits %llu  at 0x%llx  last pc 0x%llx%s\n",
                     slot, v[0], v[3], v[1],
                     v[2] ? "  <-- tripped the guard: it was looping, so one instruction was skipped"
                          : "");
          }
          
          // --------------------------------------------------------- page watches
          //
          // Arm one page in one process. The next time that process touches it the kernel
          // records who, from where, and whether it was a write, then puts the page back
          // and lets the access through. Nothing in the game's memory is modified.
          
          static long towa_watch_arm(int pid, unsigned long addr, unsigned long mode)
          {
              long r = towa(TOWA_OP_WATCH_ARM, (unsigned long)pid, addr, mode);
              if (r < 0) perr("watch arm", r);
              return r;
          }
          
          static long towa_watch_off(unsigned long slot)
          {
              long r = towa(TOWA_OP_WATCH_OFF, slot);
              if (r < 0) perr("watch off", r);
              return r;
          }
          
          static bool towa_watch_stat(unsigned long slot)
          {
              towa_watch_info w;
              memset(&w, 0, sizeof(w));
          
              long r = towa(TOWA_OP_WATCH_STAT, slot, (unsigned long)&w);
              if (r < 0) { perr("watch stat", r); return false; }
          
              printf("slot %lu  page 0x%lx  hits %llu  %-6s  %s",
                     slot, w.addr, w.hits,
                     (w.flags & TOWA_WF_ACCESS) ? "access" : "write",
                     (w.flags & TOWA_WF_SPENT) ? "" : "(still armed) ");
          
              if (w.hits) {
                  printf("pid %llu pc 0x%llx  %s",
                         w.last_task, w.last_pc,
                         (w.flags & TOWA_WF_WRITE) ? "WROTE it" : "read/executed it");
              }
              printf("\n");
          
              return w.hits != 0;
          }
          
          // ------------------------------------------------- the wanbai.h-style path
          //
          // This is what a scene hack does: find a device node, open it, send the key,
          // then ioctl 0x801/0x802/0x803 with their structs. Nothing here uses the
          // syscall - it is the compatibility path being tested, from the outside.
          
          #define TOWA_IOCTL_INIT_KEY    0x800
          #define TOWA_IOCTL_READ_MEM    0x801
          #define TOWA_IOCTL_MODULE_BASE 0x803
          
          struct towa_copy_memory {
              int pid;
              unsigned long addr;
              void *buffer;
              unsigned long size;
          };
          
          struct towa_module_base {
              int pid;
              char *name;
              unsigned long base;
          };
          
          static bool try_node(const char *path, int pid, unsigned int elfmagic)
          {
              printf("%-22s ", path);
          
              int fd = open(path, O_RDWR);
              if (fd < 0) {
                  printf("cannot open (%s)\n", strerror(errno));
                  return false;
              }
          
              // Their clients always send a key. Any string is accepted on our side.
              if (ioctl(fd, TOWA_IOCTL_INIT_KEY, (void *)"towacli") != 0) {
                  printf("initKey refused\n");
                  close(fd);
                  return false;
              }
              printf("key ok  ");
          
              struct towa_module_base mb;
              mb.pid  = pid;
              mb.name = (char *)"libil2cpp.so";
              mb.base = 0;
          
              if (ioctl(fd, TOWA_IOCTL_MODULE_BASE, &mb) != 0 || !mb.base) {
                  printf("module base failed\n");
                  close(fd);
                  return false;
              }
          
              unsigned int magic = 0;
              struct towa_copy_memory cm;
              cm.pid    = pid;
              cm.addr   = mb.base;
              cm.buffer = &magic;
              cm.size   = 4;
          
              if (ioctl(fd, TOWA_IOCTL_READ_MEM, &cm) != 0) {
                  printf("read failed\n");
                  close(fd);
                  return false;
              }
          
              printf("base 0x%lx  first word 0x%08x  %s\n", mb.base, magic,
                     magic == elfmagic ? "ELF - a hack would be in business" : "NOT elf");
              close(fd);
              return true;
          }
          
          static int cmd_compat(void)
          {
              static const char *names[] = {
                  "wanbai", "CheckMe", "Ckanri", "lanran", "video188",
              };
          
              int pid = find_pid("com.dts.freefireth");
              printf("pid        : %d\n", pid);
              printf("--- looking for the nodes our module registers ---\n");
          
              bool any = false;
              for (unsigned i = 0; i < sizeof(names) / sizeof(names[0]); i++) {
                  char path[64];
                  snprintf(path, sizeof(path), "/dev/%s", names[i]);
                  if (access(path, F_OK) != 0 && access(path, R_OK) != 0)
                      continue;
                  any = true;
                  try_node(path, pid, kElfMagic);
              }
              if (!any) {
                  printf("none of them exist - is towa_core.ko loaded, and is the compat\n"
                         "block enabled (TOWA_COMPAT 1 in towa_core.c)?\n");
                  return 1;
              }
          
              printf("--- the rt-proc shape ---\n");
              printf("/proc/kvmstats          %s\n",
                     access("/proc/kvmstats", F_OK) == 0 ? "exists" : "missing");
          
              return 0;
          }
          
          // ------------------------------------------------- address -> who owns it
          //
          // A pc is only useful if you can say which library it is in and how far into
          // it, because that pair is what you would arm a hook on.
          
          struct mapping {
              unsigned long start, end, off;
              char perms[8];
              char path[256];
          };
          
          static int read_maps(int pid, std::vector<mapping> &out)
          {
              char p[64];
              snprintf(p, sizeof(p), "/proc/%d/maps", pid);
          
              FILE *f = fopen(p, "r");
              if (!f) return -1;
          
              char line[512];
              while (fgets(line, sizeof(line), f)) {
                  mapping m;
                  char perms[8] = { 0 };
                  char dev[16] = { 0 };
                  unsigned long ino = 0;
                  (void)dev; (void)ino;   /* parsed, not used */
          
                  memset(&m, 0, sizeof(m));
                  int n = sscanf(line, "%lx-%lx %7s %lx %15s %lu %255[^\n]",
                                 &m.start, &m.end, perms, &m.off, dev, &ino, m.path);
                  if (n < 5) continue;                 /* anonymous lines end after ino */
          
                  snprintf(m.perms, sizeof(m.perms), "%s", perms);
                  char *q = m.path;
                  while (*q == ' ') q++;
                  memmove(m.path, q, strlen(q) + 1);
                  out.push_back(m);
              }
              fclose(f);
              return 0;
          }
          
          // module + offset for an address; false if it is not mapped in that process
          static bool module_of(int pid, unsigned long addr, char *name, size_t n,
                                unsigned long *base, unsigned long *off)
          {
              std::vector<mapping> ms;
              if (read_maps(pid, ms) < 0) return false;
          
              int hit = -1;
              for (size_t i = 0; i < ms.size(); i++)
                  if (addr >= ms[i].start && addr < ms[i].end) { hit = (int)i; break; }
              if (hit < 0) return false;
          
              const mapping &m = ms[hit];
              snprintf(name, n, "%s", m.path[0] ? m.path : "(anonymous)");
          
              unsigned long b = m.start;
              if (m.path[0])
                  for (size_t i = 0; i < ms.size(); i++)
                      if (!strcmp(ms[i].path, m.path) && ms[i].start < b)
                          b = ms[i].start;
          
              if (base) *base = b;
              if (off)  *off  = addr - b;
              return true;
          }
          
          /*
           * hunt: arm a write watch on the stack page of every thread that looks like it
           * runs game code, then get out of the way.
           *
           * It returns immediately rather than waiting, because the game only runs when
           * it is in the foreground - so the watching has to happen while the terminal is
           * not on screen.  Arm now, play, then `towacli report`.
           */
          static int cmd_hunt(void)
          {
              int pid = find_pid("com.dts.freefireth");
              if (pid <= 0) { printf("the game is not running\n"); return 1; }
          
              /*
               * Slots stay held once used, so clear them first - but quietly: on a
               * fresh boot none of them are armed and every one of those calls
               * answers -EINVAL, which is not a failure.
               */
              for (int i = 0; i < 4; i++)
                  towa(TOWA_OP_WATCH_OFF, (unsigned long)i);
          
              char dir[64];
              snprintf(dir, sizeof(dir), "/proc/%d/task", pid);
          
              DIR *d = opendir(dir);
              if (!d) { perror("task"); return 1; }
          
              struct thread_cand { int tid; char comm[64]; unsigned long sp; };
              thread_cand cand[512];
              int nc = 0;
              struct dirent *e;
          
              while ((e = readdir(d)) != NULL && nc < 512) {
                  if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
          
                  int tid = atoi(e->d_name);
                  char comm[64];
                  read_comm(tid, comm, sizeof(comm));
                  if (!comm[0]) continue;
          
                  /* threads that plausibly execute the game, not the framework */
                  if (!strstr(comm, "Unity") && !strstr(comm, "IL2CPP") &&
                      !strstr(comm, "Gfx")   && !strstr(comm, "Render"))
                      continue;
          
                  cand[nc].tid = tid;
                  snprintf(cand[nc].comm, sizeof(cand[nc].comm), "%s", comm);
                  cand[nc].sp = proc_sp(tid);
                  nc++;
              }
              closedir(d);
          
              if (!nc) { printf("no Unity/IL2CPP-looking threads found in pid %d\n", pid); return 1; }
          
              printf("pid %d, %d candidate threads\n", pid, nc);
          
              /* hottest first: a thread that is actually in a syscall right now has a
               * live stack pointer and is far more likely to write to it soon */
              for (int i = 0; i < nc; i++)
                  for (int j = i + 1; j < nc; j++)
                      if (cand[j].sp && !cand[i].sp) {
                          thread_cand t = cand[i]; cand[i] = cand[j]; cand[j] = t;
                      }
          
              int armed = 0;
              for (int i = 0; i < nc && armed < 4; i++) {
                  unsigned long sp = cand[i].sp;
          
                  for (int k = 0; k < 5 && !sp; k++) {
                      sp = proc_sp(cand[i].tid);
                      if (!sp) usleep(10000);
                  }
                  if (!sp) continue;
          
                  unsigned long page = sp & ~0xfffUL;
                  long slot = towa_watch_arm(cand[i].tid, page, TOWA_WATCH_WRITE);
                  if (slot < 0) continue;
          
                  printf("  slot %ld  tid %-6d %-16s page 0x%lx\n",
                         slot, cand[i].tid, cand[i].comm, page);
                  armed++;
              }
          
              if (!armed) { printf("could not arm anything - are all four slots busy?\n"); return 1; }
          
              printf("\nnow put the game in front and play, then run:\n"
                     "    towacli report\n");
              return 0;
          }
          
          /*
           * report: read back every slot, name the pc, and release the slots.
           */
          static int cmd_report(void)
          {
              int pid = find_pid("com.dts.freefireth");
              int any = 0;
          
              for (int slot = 0; slot < 4; slot++) {
                  towa_watch_info w;
                  memset(&w, 0, sizeof(w));
          
                  if (towa(TOWA_OP_WATCH_STAT, slot, (unsigned long)&w) < 0)
                      continue;
          
                  any = 1;
                  printf("slot %d  page 0x%lx  hits %llu  %-6s",
                         slot, w.addr, w.hits,
                         (w.flags & TOWA_WF_ACCESS) ? "access" : "write");
          
                  if (!w.hits) {
                      printf("  (never touched)\n");
                      towa_watch_off(slot);
                      continue;
                  }
          
                  unsigned long pc = (unsigned long)w.last_pc;
          
                  if ((pc >> 48) == 0xffff) {
                      printf("  pc 0x%lx  <kernel>\n", pc);
                  } else {
                      char nm[256];
                      unsigned long base = 0, off = 0;
                      if (pid > 0 && module_of(pid, pc, nm, sizeof(nm), &base, &off)) {
                          const char *base_name = strrchr(nm, '/');
                          printf("  pc 0x%lx  %s + 0x%lx\n",
                                 pc, base_name ? base_name + 1 : nm, off);
                      } else {
                          printf("  pc 0x%lx  (unmapped)\n", pc);
                      }
                  }
          
                  printf("        %s\n", (w.flags & TOWA_WF_WRITE) ? "WROTE it" : "read");
                  towa_watch_off(slot);
              }
          
              if (!any) printf("nothing armed - run 'towacli hunt' first\n");
              return 0;
          }
          
          static int cmd_where(int pid, unsigned long addr)
          {
              std::vector<mapping> ms;
              if (read_maps(pid, ms) < 0) { perror("maps"); return 1; }
          
              int hit = -1;
              for (size_t i = 0; i < ms.size(); i++)
                  if (addr >= ms[i].start && addr < ms[i].end) { hit = (int)i; break; }
          
              if (hit < 0) { printf("0x%lx is not mapped in pid %d\n", addr, pid); return 1; }
          
              const mapping &m = ms[hit];
              printf("mapping : %lx-%lx %s off %lx\n", m.start, m.end, m.perms, m.off);
              printf("file    : %s\n", m.path[0] ? m.path : "(anonymous)");
          
              /* the lowest mapping of the same file is its load base */
              unsigned long base = m.start;
              if (m.path[0]) {
                  for (size_t i = 0; i < ms.size(); i++)
                      if (!strcmp(ms[i].path, m.path) && ms[i].start < base)
                          base = ms[i].start;
              }
          
              printf("base    : 0x%lx\n", base);
              printf("offset  : 0x%lx        <- %lx + 0x%lx\n", addr - base, base, addr - base);
              return 0;
          }
          
          // ---------------------------------------------------------------- utilities
          
          static bool hex_to_bytes(const char *s, std::vector<unsigned char> &out)
          {
              size_t n = strlen(s);
              if (n == 0 || n % 2) return false;
          
              for (size_t i = 0; i < n; i += 2) {
                  unsigned v;
                  if (sscanf(s + i, "%2x", &v) != 1) return false;
                  out.push_back((unsigned char)v);
              }
              return true;
          }
          
          static void hexdump(unsigned long addr, const unsigned char *p, int n)
          {
              for (int i = 0; i < n; i += 16) {
                  printf("%016lx  ", addr + i);
                  for (int j = 0; j < 16; j++) {
                      if (i + j < n) printf("%02x ", p[i + j]);
                      else           printf("   ");
                      if (j == 7) printf(" ");
                  }
                  printf(" |");
                  for (int j = 0; j < 16 && i + j < n; j++) {
                      unsigned char c = p[i + j];
                      printf("%c", (c >= 32 && c < 127) ? c : '.');
                  }
                  printf("|\n");
              }
          }
          
          // ---------------------------------------------------------------- the one test
          
          static int cmd_test(int pid)
          {
              printf("syscall    : %lu\n", g_nr);
          
              long r = towa(TOWA_OP_PING);
              if (r < 0) {
                  perr("ping", r);
                  if (-r == ENOSYS)
                      printf("           ENOSYS means either the number is wrong or "
                             "towa_core.ko is not loaded\n");
                  return 1;
              }
              if ((unsigned long)r != TOWA_MAGIC) {
                  printf("ping       : unexpected reply 0x%lx\n", (unsigned long)r);
                  return 1;
              }
              printf("ping       : ok (0x%lx)\n", (unsigned long)r);
          
              if (pid <= 0) {
                  printf("no pid given and no process matched\n");
                  return 1;
              }
              printf("pid        : %d\n", pid);
          
              unsigned long base = towa_base(pid, "libil2cpp.so");
              if (!base) return 1;
              printf("libil2cpp  : 0x%lx\n", base);
          
              unsigned int magic = 0;
              if (towa_read(pid, base, &magic, 4) < 0) return 1;
              printf("first word : 0x%08x  (%s)\n", magic,
                     magic == kElfMagic ? "ELF - the kernel really read it" : "NOT elf, something is off");
          
              return magic == kElfMagic ? 0 : 1;
          }
          
          // ---------------------------------------------------------------- main
          
          static void usage(const char *me)
          {
              printf("towacli %s\n\n", TOWACLI_BUILD);
              printf(
                  "towacli [-n <syscall nr>] <command>\n"
                  "\n"
                  "  ping                          is the syscall there?\n"
                  "  test [pid]                    ping + libil2cpp base + ELF check\n"
                  "  compat                        the same thing a scene hack does, through\n"
                  "                                /dev/wanbai and ioctl 0x800..0x803\n"
                  "  pid <name>                    find a pid by process name\n"
                  "  selftest                      arm a watch on our own page, write to it,\n"
                  "                                report - proves the watcher with\n"
                  "                                nothing at stake.  Run this first\n"
                  "  hunt                          watch the stack page of every Unity/IL2CPP\n"
                  "                                thread at once (4 slots), then return -\n"
                  "                                play, then run report\n"
                  "  report                        read every slot back, name each pc, and\n"
                  "                                release the slots\n"
                  "  watchstack [pid|tid|name]     watch the page a thread's stack pointer\n"
                  "                                is on right now.  A name is resolved\n"
                  "                                at that moment, because threads\n"
                  "                                come and go: watchstack UnityMain\n"
                  "  base <pid> <soname>           load address of a shared object\n"
                  "  where <pid> <hexaddr>         which module an address is in,\n"
                  "                                and its offset into it - turn a\n"
                  "                                pc from a watch into something\n"
                  "                                you could hook\n"
                  "  read <pid> <hexaddr> <len>    hexdump from the target\n"
                  "  write <pid> <hexaddr> <hex>   write bytes into the target\n"
                  "\n"
                  "hardware breakpoints (no byte of the target is touched):\n"
                  "  hbp arm   x <pid> <addr> <act> [v] [reg]   an action is mandatory\n"
                  "      act: none  skip        pc += 4, the instruction does not run\n"
                  "           ret   <v>        return from the function now, x0 = v\n"
                  "           pc    <addr>     jump\n"
                  "           x0    <v>        x0 = v, then skip that instruction\n"
                  "           reg   <v> <rn>   regs[rn] = v, then skip it\n"
                  "  hbp sweep x <pid> <addr> <act> [v]      arm, watch for 10 s, disarm\n"
                  "  hbp stat  <slot>                        hits, last pc, address\n"
                  "  hbp off   <slot>                        disarm\n"
                  "\n"
                  "page watches (the page table is touched, not the page):\n"
                  "  watch   <pid> <addr> [w|a]    next write (w) or next access (a)\n"
                  "                                this is the safe way to see who writes\n"
                  "                                what: the page table is touched, the\n"
                  "                                page's contents never are\n"
                  "  watch sweep <pid> <addr> [w|a]  arm, wait up to 20 s, report, disarm\n"
                  "  watch stat <slot>             who touched it, from which pc\n"
                  "  watch off  <slot>             disarm\n"
                  "\n"
                  "example:  towacli test\n"
                  "          towacli read 12345 0x71c2a5b000 64\n"
                  "          towacli hbp sweep x 12345 0x71c2a5b000 ret 1\n"
                  "          towacli hbp arm x 12345 0x71c2a5b000 ret 1\n"
                  "          towacli watch sweep 12345 0x71c2a5b400 w\n",
                  me);
          }
          
          int main(int argc, char **argv)
          {
              std::vector<std::string> a;
              for (int i = 1; i < argc; i++) {
                  if (!strcmp(argv[i], "-n") && i + 1 < argc) {
                      g_nr = strtoul(argv[++i], NULL, 0);
                      continue;
                  }
                  a.push_back(argv[i]);
              }
          
              if (a.empty()) { usage(argv[0]); return 2; }
          
              if (!g_nr) {
                  fprintf(stderr,
                          "towacli was built without -DNR_TOWA=<number>, so it does not\n"
                          "know the syscall.  Either use the binary the build produces, or\n"
                          "pass -n <number>.  Do not guess: the wrong number is another\n"
                          "syscall, with six arguments you did not mean.\n");
                  return 2;
              }
          
              const std::string &cmd = a[0];
          
              if (cmd == "ping") {
                  long r = towa(TOWA_OP_PING);
                  if (r < 0) { perr("ping", r); return 1; }
                  printf("towa alive, magic 0x%lx, syscall %lu, %s\n",
                         (unsigned long)r, g_nr, TOWACLI_BUILD);
                  return 0;
              }
          
              if (cmd == "test") {
                  int pid = a.size() > 1 ? atoi(a[1].c_str()) : find_pid("com.dts.freefireth");
                  return cmd_test(pid);
              }
          
              if (cmd == "compat") {
                  return cmd_compat();
              }
          
              // Prove the whole mechanism on a page of our own, with nothing at stake.
              // Arm -> write -> fault -> restore -> report, in one second, on a throwaway
              // anonymous page.  Run this before pointing anything at the game.
              if (cmd == "selftest") {
                  void *p = mmap(NULL, 4096, PROT_READ | PROT_WRITE,
                                 MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (p == MAP_FAILED) { perror("mmap"); return 1; }
          
                  memset(p, 0, 4096);                 /* faulted in, so the PTE exists */
          
                  int me = getpid();
                  printf("selftest: pid %d, page %p\n", me, p);
          
                  long slot = towa_watch_arm(me, (unsigned long)p, TOWA_WATCH_WRITE);
                  if (slot < 0) {
                      printf("selftest: arm failed - that alone is the bug\n");
                      munmap(p, 4096);
                      return 1;
                  }
                  printf("selftest: armed slot %ld\n", slot);
          
                  /* the write that must trip it */
                  *(volatile int *)((char *)p + 64) = 0x5eed;
          
                  towa_watch_stat(slot);
                  towa_watch_off(slot);
                  munmap(p, 4096);
          
                  printf("selftest: done - if that said hits 1 WROTE it, the watcher works\n");
                  return 0;
              }
          
              if (cmd == "hunt")   return cmd_hunt();
              if (cmd == "report") return cmd_report();
          
              if (cmd == "where") {
                  if (a.size() < 3) { usage(argv[0]); return 2; }
                  int pid = resolve_pid(a[1].c_str());
                  if (pid <= 0) { printf("no such process\n"); return 1; }
                  return cmd_where(pid, strtoul(a[2].c_str(), NULL, 16));
              }
          
              if (cmd == "pid") {
                  if (a.size() < 2) { usage(argv[0]); return 2; }
                  int pid = find_pid(a[1].c_str());
                  if (pid < 0) { printf("no process matching '%s'\n", a[1].c_str()); return 1; }
                  printf("%d\n", pid);
                  return 0;
              }
          
              if (cmd == "base") {
                  if (a.size() < 3) { usage(argv[0]); return 2; }
                  unsigned long b = towa_base(atoi(a[1].c_str()), a[2].c_str());
                  if (!b) return 1;
                  printf("0x%lx\n", b);
                  return 0;
              }
          
              // Hardware breakpoints. Nothing is written to the target: the address just
              // goes into a debug register, so unlike a hook there is no patched byte for
              // anything to find.
              if (cmd == "hbp") {
                  if (a.size() < 2) { usage(argv[0]); return 2; }
          
                  if (a[1] == "stat") {
                      if (a.size() < 3) { usage(argv[0]); return 2; }
                      towa_hbp_stat(strtoul(a[2].c_str(), NULL, 0));
                      return 0;
                  }
          
                  if (a[1] == "off") {
                      if (a.size() < 3) { usage(argv[0]); return 2; }
                      long r = towa_hbp_del(strtoul(a[2].c_str(), NULL, 0));
                      if (r < 0) return 1;
                      printf("slot %s cleared\n", a[2].c_str());
                      return 0;
                  }
          
                  // add | arm | sweep  <x|w>  <pid>  <hexaddr>  [action] [value] [reg]
                  bool sweep = a[1] == "sweep";
                  if ((a[1] != "add" && a[1] != "arm" && !sweep) || a.size() < 5) {
                      usage(argv[0]);
                      return 2;
                  }
          
                  unsigned long type = (a[2] == "w") ? TOWA_BP_W : TOWA_BP_X;
                  int pid = resolve_pid(a[3].c_str());
                  unsigned long addr = strtoul(a[4].c_str(), NULL, 16);
          
                  unsigned long action = TOWA_ACT_NONE, value = 0, reg = 0;
                  if (a.size() > 5) {
                      const std::string &act = a[5];
                      if      (act == "skip") action = TOWA_ACT_SKIP;
                      else if (act == "ret")  action = TOWA_ACT_RET;
                      else if (act == "pc")   action = TOWA_ACT_PC;
                      else if (act == "x0")   action = TOWA_ACT_X0;
                      else if (act == "reg")  action = TOWA_ACT_REG;
                      else if (act != "none") { printf("unknown action '%s'\n", act.c_str()); return 2; }
          
                      if (a.size() > 6) value = strtoul(a[6].c_str(), NULL, 0);
                      if (a.size() > 7) reg   = strtoul(a[7].c_str(), NULL, 0);
                  }
          
                  long slot = towa_hbp_arm(pid, addr, type, action, value, reg);
                  if (slot < 0) {
                      printf("(ENOSPC = all four debug registers in use;  "
                             "EINVAL/ENOTSUPP = the kernel will not take that address/type)\n");
                      return 1;
                  }
          
                  const char *what = type == TOWA_BP_W ? "write" : "execute";
                  if (action == TOWA_ACT_NONE)
                      printf("armed slot %ld on pid %d at 0x%lx (%s, counting)\n",
                             slot, pid, addr, what);
                  else
                      printf("armed slot %ld on pid %d at 0x%lx (%s, action %s, value 0x%lx)\n",
                             slot, pid, addr, what, a[5].c_str(), value);
          
                  if (sweep) {
                      for (int i = 0; i < 10; i++) { sleep(1); towa_hbp_stat(slot); }
                      towa_hbp_del(slot);
                      printf("disarmed slot %ld\n", slot);
                  }
                  return 0;
              }
          
              // One command that does the arithmetic: find the thread's stack pointer,
              // take the page it lives on, and watch that.  The address cannot be
              // remembered between runs - a reboot or a relaunch moves it.
              if (cmd == "watchstack") {
                  int pid = find_pid("com.dts.freefireth");
                  if (pid <= 0) { printf("the game is not running\n"); return 1; }
          
                  int tid = pid;
                  if (a.size() > 1) {
                      const std::string &arg = a[1];
                      bool numeric = !arg.empty();
          
                      for (size_t i = 0; i < arg.size(); i++)
                          if (arg[i] < '0' || arg[i] > '9') { numeric = false; break; }
          
                      if (numeric) {
                          tid = atoi(arg.c_str());
                      } else if (arg.find('.') != std::string::npos) {
                          int other = find_pid(arg.c_str());
                          if (other <= 0) { printf("no process matching %s\n", arg.c_str()); return 1; }
                          pid = other;
                          tid = pid;
                      } else {
                          /* a thread name - resolved now, because threads come and go */
                          tid = find_thread(pid, arg.c_str());
                          if (tid < 0) {
                              printf("no live thread called '%s'.  Threads in pid %d right now:\n",
                                     arg.c_str(), pid);
                              char dir[64];
                              snprintf(dir, sizeof(dir), "/proc/%d/task", pid);
                              DIR *d = opendir(dir);
                              if (d) {
                                  struct dirent *e;
                                  int shown = 0;
                                  while ((e = readdir(d)) != NULL && shown < 25) {
                                      if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
                                      char comm[64];
                                      read_comm(atoi(e->d_name), comm, sizeof(comm));
                                      if (comm[0]) { printf("  %-6s %s\n", e->d_name, comm); shown++; }
                                  }
                                  closedir(d);
                              }
                              return 1;
                          }
                      }
                  }
          
                  unsigned long sp = 0;
                  for (int i = 0; i < 50 && !sp; i++) {
                      sp = proc_sp(tid);
                      if (!sp) usleep(20000);
                  }
                  if (!sp) {
                      printf("could not read the stack pointer of tid %d - is it still alive?\n", tid);
                      return 1;
                  }
          
                  char comm[64];
                  read_comm(tid, comm, sizeof(comm));
          
                  unsigned long page = sp & ~0xfffUL;
                  printf("pid %d  tid %d (%s)  sp 0x%lx  page 0x%lx\n",
                         pid, tid, comm, sp, page);
          
                  long slot = towa_watch_arm(tid, page, TOWA_WATCH_WRITE);
                  if (slot < 0) {
                      printf("(the page under the live stack pointer should always be mapped;\n"
                             " EFAULT here means it is not faulted in yet - try again)\n");
                      return 1;
                  }
                  printf("watching slot %ld - play for ten seconds, then:\n", slot);
                  printf("    towacli watch stat %ld\n", slot);
                  return 0;
              }
          
              // Page watches: arm one page, see who touches it, put it back.
              if (cmd == "watch") {
                  if (a.size() < 2) { usage(argv[0]); return 2; }
          
                  if (a[1] == "stat") {
                      if (a.size() < 3) { usage(argv[0]); return 2; }
                      towa_watch_stat(strtoul(a[2].c_str(), NULL, 0));
                      return 0;
                  }
          
                  if (a[1] == "off") {
                      if (a.size() < 3) { usage(argv[0]); return 2; }
                      long r = towa_watch_off(strtoul(a[2].c_str(), NULL, 0));
                      if (r < 0) return 1;
                      printf("watch slot %s disarmed\n", a[2].c_str());
                      return 0;
                  }
          
                  // <pid> <hexaddr> [w|a]   or   sweep <pid> <hexaddr> [w|a]
                  //
                  // The documented form has no sub-command, so a[1] is the pid.  The
                  // earlier version demanded a literal "watch" there and printed the
                  // help instead, which is why the first attempt did nothing.
                  bool sweep = a[1] == "sweep";
                  size_t base = (a[1] == "watch" || sweep) ? 2 : 1;
                  if (a.size() < base + 3) { usage(argv[0]); return 2; }
          
                  int pid = resolve_pid(a[base].c_str());
                  unsigned long addr = strtoul(a[base + 1].c_str(), NULL, 16);
                  unsigned long mode = (a.size() > base + 2 && a[base + 2] == "a")
                                       ? TOWA_WATCH_ACCESS : TOWA_WATCH_WRITE;
          
                  long slot = towa_watch_arm(pid, addr, mode);
                  if (slot < 0) {
                      printf("(ENOENT  = that address is not in any mapping of that pid -\n"
                             "          the layout changed, get the address again\n"
                             " EFAULT  = mapped, but the page is not faulted in yet\n"
                             " EOPNOTSUPP = access mode refused - it needs a read-only file page;\n"
                             "          use write mode on anything else\n"
                             " EPERM   = the page is not writable by that process at all)\n");
                      return 1;
                  }
                  printf("watching slot %ld: pid %d page 0x%lx, next %s\n",
                         slot, pid, addr & ~0xfffUL,
                         mode == TOWA_WATCH_ACCESS ? "read/write/execute" : "write");
          
                  if (sweep) {
                      for (int i = 0; i < 20; i++) {
                          sleep(1);
                          if (towa_watch_stat(slot)) break;
                      }
                      towa_watch_off(slot);
                  }
                  return 0;
              }
          
              if (cmd == "read") {
                  if (a.size() < 4) { usage(argv[0]); return 2; }
                  int pid = atoi(a[1].c_str());
                  unsigned long addr = strtoul(a[2].c_str(), NULL, 16);
                  unsigned long len = strtoul(a[3].c_str(), NULL, 0);
                  if (len > 1024 * 1024) { printf("len too big\n"); return 2; }
          
                  std::vector<unsigned char> buf(len);
                  int got = towa_read(pid, addr, &buf[0], len);
                  if (got < 0) return 1;
                  hexdump(addr, &buf[0], got);
                  return 0;
              }
          
              if (cmd == "write") {
                  if (a.size() < 4) { usage(argv[0]); return 2; }
                  int pid = atoi(a[1].c_str());
                  unsigned long addr = strtoul(a[2].c_str(), NULL, 16);
          
                  std::vector<unsigned char> bytes;
                  if (!hex_to_bytes(a[3].c_str(), bytes)) { printf("bad hex\n"); return 2; }
          
                  int put = towa_write(pid, addr, &bytes[0], bytes.size());
                  if (put < 0) return 1;
                  printf("wrote %d bytes to 0x%lx\n", put, addr);
                  return 0;
              }
          
              usage(argv[0]);
              return 2;
          }
          TW_CLI
          
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors --no-progress-meter \
            -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          rm -f /tmp/ndk.zip
          
          NDK=$(ls -d /opt/android-ndk-* | head -1)
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          test -x "$CXX" || { echo "no ndk clang++ at $CXX"; ls -d /opt/android-ndk-* 2>/dev/null; exit 1; }
          
          # The syscall number comes from the tree we just built, because it is NOT 294:
          # this kernel's table already runs to 442, so 294 is somebody else's syscall and
          # calling it with six arguments would be worse than useless.
          NR=$(grep -m1 '^#define __NR_syscalls' \
                 "$GITHUB_WORKSPACE/kernel/include/uapi/asm-generic/unistd.h" | awk '{print $3}')
          NR=$((NR-1))
          echo "building against TOWA_NR=$NR"
          test "$NR" -gt 0 || { echo "could not read the syscall number"; exit 1; }
          
          # -static-libstdc++ so the binary does not need libc++_shared.so pushed next to
          # it; libc, libm and libdl are on the device already.
          STAMP=$(date -u +%Y%m%d.%H%M)
          echo "towacli build stamp: $STAMP"
          
          "$CXX" -O2 -fPIE -pie -static-libstdc++ -Wall -DNR_TOWA=$NR \
                 -DTOWACLI_BUILD="\"$STAMP\"" \
                 -o "$GITHUB_WORKSPACE/tools/towacli" "$GITHUB_WORKSPACE/tools/towacli.cpp"
          
          echo "--- what we built ---"
          ls -l "$GITHUB_WORKSPACE/tools/towacli"
          file "$GITHUB_WORKSPACE/tools/towacli" || true
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$GITHUB_WORKSPACE/tools/towacli" | grep -E 'Class|Type|Machine'
          echo "--- libraries it asks for (libc/libm/libdl only) ---"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$GITHUB_WORKSPACE/tools/towacli" | grep NEEDED
          
          rm -rf /opt/android-ndk-*
          echo "--- usage it prints for itself ---"
          "$GITHUB_WORKSPACE/tools/towacli" 2>&1 | head -5 || true
      - name: Package AnyKernel3 zip
        run: |
          set -e
          curl -fsSL "https://codeload.github.com/Aflaungos/AnyKernel3/tar.gz/refs/heads/m23xq" -o /tmp/ak3.tar.gz
          mkdir -p /tmp/ak3 && tar -xzf /tmp/ak3.tar.gz -C /tmp/ak3 --strip-components=1
          cd /tmp/ak3
          chmod +x tools/* 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/out/Image" Image
          [ -f "$GITHUB_WORKSPACE/out/dtb" ]  && cp "$GITHUB_WORKSPACE/out/dtb"  dtb
          [ -f "$GITHUB_WORKSPACE/out/dtbo" ] && cp "$GITHUB_WORKSPACE/out/dtbo" dtbo
          # The module rides inside the zip too, so one download has everything.
          # With builtin=y there is no module and the block below does nothing.
          if [ -f "$GITHUB_WORKSPACE/out/towa_core.ko" ]; then
            cp "$GITHUB_WORKSPACE/out/towa_core.ko" towa_core.ko
          fi
          # Appended after write_boot, which is plain shell by that point.
          cat >> anykernel.sh <<'AK3EOF'

          # towa: leave the module somewhere that survives, so it does not have to
          # be pushed again after every flash
          for d in "$AKHOME" .; do
            if [ -f "$d/towa_core.ko" ]; then
              mkdir -p /data/adb/towa
              cp "$d/towa_core.ko" /data/adb/towa/towa_core.ko
              chmod 0644 /data/adb/towa/towa_core.ko
              ui_print "  towa_core.ko -> /data/adb/towa/"
              break
            fi
          done
          AK3EOF
          rm -rf .github README.md
          Z="$GITHUB_WORKSPACE/towa-kernel-${{ github.run_number }}.zip"
          zip -r9 "$Z" . -x '.git/*' -x '.github/*' -x 'README.md' >/dev/null
          echo "--- contents ---"; unzip -l "$Z" | head -25
          echo "--- self-test ---"; unzip -t "$Z" | tail -3
          echo "--- sha256 ---"; sha256sum "$Z"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            /tmp/build.log
            /tmp/towa.log
            /tmp/cfg.log
          if-no-files-found: warn

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: towa-kernel-${{ github.run_number }}
          path: ${{ github.workspace }}/towa-kernel-*.zip
          if-no-files-found: error

      - name: Upload towa_core.ko
        if: ${{ inputs.builtin != 'y' }}
        uses: actions/upload-artifact@v4
        with:
          name: towa_core-ko-${{ github.run_number }}
          path: ${{ github.workspace }}/out/towa_core.ko
          if-no-files-found: error

      - name: Upload towacli
        uses: actions/upload-artifact@v4
        with:
          name: towacli-${{ github.run_number }}
          path: ${{ github.workspace }}/tools/towacli
          if-no-files-found: error

      - name: Attach to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Z="$GITHUB_WORKSPACE/towa-kernel-${{ github.run_number }}.zip"
          FILES="$Z"
          E="/tmp/extra.txt"
          if [ -f "$GITHUB_WORKSPACE/tools/towacli" ]; then
            cp "$GITHUB_WORKSPACE/tools/towacli" /tmp/towacli
            FILES="$FILES /tmp/towacli"
          fi
          if [ -f "$GITHUB_WORKSPACE/out/towa_core.ko" ]; then
            cp "$GITHUB_WORKSPACE/out/towa_core.ko" /tmp/towa_core.ko
            FILES="$FILES /tmp/towa_core.ko"
            echo "towa_core.ko is in this release" > "$E"
          else
            echo "built-in build: towa_core is in the Image, no .ko" > "$E"
          fi
          NR=$(grep -m1 '^#define __NR_syscalls' kernel/include/uapi/asm-generic/unistd.h | awk '{print $3}')
          gh release create "towa-${{ github.run_number }}" $FILES \
            --repo "$GITHUB_REPOSITORY" \
            --title "towa kernel build ${{ github.run_number }}" \
            --notes "TOWA_NR=$((NR-1))  cookie=0x9E3779B97F4A7C15  branch=${{ inputs.branch }}  builtin=${{ inputs.builtin }}
          $(cat "$E")
          sha256=$(sha256sum "$Z" | cut -d' ' -f1)" \
          || gh release upload "towa-${{ github.run_number }}" $FILES \
            --repo "$GITHUB_REPOSITORY" --clobber
