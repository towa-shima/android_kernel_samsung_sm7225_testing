          cat > drivers/kdbg/kdbg_watch.c <<'TW_W'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * Page watches - the fault-path half of a PTE hook.
           *
           * This file is built into the kernel, not into the module, because it needs two
           * things a module cannot have: a call site inside do_page_fault() and the core
           * mm helpers that manipulate another process's page tables.
           *
           * How it works, and why it is the safe end of "PTE hook":
           *
           *   1. Arming takes access to one page away from one process.  For a write
           *      watch that means clearing the write bit in the PTE; for an access watch
           *      it means clearing the PTE so the next touch faults.  Either way only the
           *      page TABLE is touched.  The page's contents are untouched, so a scanner
           *      that reads the memory finds exactly the original bytes - there is no
           *      shadow page and no patched instruction anywhere.
           *
           *   2. The next time that process touches the page it faults, do_page_fault()
           *      calls us before the normal handling, and we record the pc it faulted
           *      from, which task it was, and whether it was a write.
           *
           *   3. We then put the PTE back the way it was and return "not handled", so the
           *      normal fault path resolves it and the access simply succeeds.  Nothing
           *      is emulated and no instruction is decoded - which is the whole trick.
           *      A watch is single shot: one arm, one event.  Arm it again for another.
           *
           * What this deliberately does NOT do yet: substitute a different value for the
           * game to read.  That needs either a shadow page (the page then belongs to the
           * file's page cache, which is a real hazard) or decoding the faulting
           * instruction.  Both are separate steps that want this watcher proven first.
           */
          #include <linux/kernel.h>
          #include <linux/module.h>
          #include <linux/mm.h>
          #include <linux/sched.h>
          #include <linux/sched/mm.h>
          #include <linux/pid.h>
          #include <linux/export.h>
          #include <linux/string.h>
          #include <linux/spinlock.h>
          #include <linux/jump_label.h>
          #include <linux/rmap.h>
          #include <linux/pagemap.h>
          #include <linux/mmap_lock.h>
          #include <asm/pgtable.h>
          #include <asm/tlbflush.h>
          #include <asm/ptrace.h>
          #include <asm/esr.h>
          
          #include <linux/kdbg.h>	/* so our definition is checked against the
          				 * prototype fault.c calls us through */
          
          #include "kdbg.h"
          
          /*
           * Off unless something is armed.  A static branch compiles to a no-op that the
           * CPU predicts perfectly, so do_page_fault() pays nothing for the call below
           * while no watch exists.
           */
          DEFINE_STATIC_KEY_FALSE(kdbg_watch_key);
          
          struct kdbg_watch_slot {
          	struct mm_struct	*mm;		/* NULL = free */
          	unsigned long		end;		/* one past the last page */
          	unsigned long		addr;		/* page aligned */
          	unsigned long		mode;
          	unsigned long long	hits;
          	unsigned long		last_pc;
          	unsigned long		last_task;
          	unsigned long		last_addr;
          	unsigned long		flags;
          	unsigned long		regs[8];	/* x0..x7 at the fault	*/
          	unsigned long		sp;
          };
          
          static struct kdbg_watch_slot kdbg_watch[KDBG_WATCH_SLOTS];
          static int kdbg_watch_live;
          
          /* ------------------------------------------------------------- page table */
          
          struct kdbg_pte {
          	pmd_t		*pmd;
          	pte_t		*ptep;
          	spinlock_t	*ptl;
          };
          
          /*
           * Walk to the PTE for addr.  Caller must hold mmap_sem for read.  Returns
           * 0 with ptep locked, or an error with nothing held.
           */
          static int kdbg_pte_lock(struct mm_struct *mm, unsigned long addr,
          			 struct kdbg_pte *out)
          {
          	pgd_t *pgd;
          	pud_t *pud;
          	pmd_t *pmd;
          
          	pgd = pgd_offset(mm, addr);
          	if (pgd_none(*pgd) || pgd_bad(*pgd))
          		return -EFAULT;
          
          	pud = pud_offset(pgd, addr);
          	if (pud_none(*pud) || pud_bad(*pud))
          		return -EFAULT;
          
          	pmd = pmd_offset(pud, addr);
          	if (pmd_none(*pmd) || pmd_bad(*pmd))
          		return -EFAULT;
          
          	/* A huge mapping has no PTE to take access from.  (No pmd_devmap
          	 * here: this tree has not got it.) */
          	if (pmd_trans_huge(*pmd))
          		return -EOPNOTSUPP;
          
          	out->pmd  = pmd;
          	out->ptep = pte_offset_map_lock(mm, pmd, addr, &out->ptl);
          	if (!out->ptep) {
          		out->ptl = NULL;
          		return -EFAULT;
          	}
          	return 0;
          }
          
          static void kdbg_pte_unlock(struct kdbg_pte *p)
          {
          	if (p->ptep)
          		pte_unmap_unlock(p->ptep, p->ptl);
          }
          
          /* ---------------------------------------------------------------- arming */
          
          int kdbg_watch_arm(pid_t pid, unsigned long addr, unsigned long mode,
          		   unsigned long len)
          {
          	struct kdbg_watch_slot *w = NULL;
          	struct task_struct *t;
          	struct mm_struct *mm;
          	unsigned long start, end, a;
          	unsigned long armed = 0;
          	int slot, ret = 0;
          
          	if (mode != KDBG_WATCH_WRITE && mode != KDBG_WATCH_ACCESS)
          		return -EINVAL;
          
          	if (!len)
          		len = PAGE_SIZE;
          	if (len > (unsigned long)KDBG_WATCH_MAX_PAGES * PAGE_SIZE)
          		len = (unsigned long)KDBG_WATCH_MAX_PAGES * PAGE_SIZE;
          
          	start = addr & PAGE_MASK;
          	end   = (addr + len + ~PAGE_MASK) & PAGE_MASK;
          
          	for (slot = 0; slot < KDBG_WATCH_SLOTS; slot++)
          		if (!kdbg_watch[slot].mm) {
          			w = &kdbg_watch[slot];
          			break;
          		}
          	if (!w)
          		return -ENOSPC;
          
          	rcu_read_lock();
          	t = find_task_by_vpid(pid);
          	if (t)
          		get_task_struct(t);
          	rcu_read_unlock();
          	if (!t)
          		return -ESRCH;
          
          	/* get_task_mm returns with a reference held; we keep it until disarm. */
          	mm = get_task_mm(t);
          	put_task_struct(t);
          	if (!mm)
          		return -EINVAL;
          
          	mmap_read_lock(mm);
          
          	/*
          	 * A range is armed page by page, and a page that cannot be armed is
          	 * skipped rather than failing the whole range: a structure can easily
          	 * straddle the end of one mapping, and the pages that exist are worth
          	 * watching even when the next one does not.
          	 */
          	for (a = start; a < end; a += PAGE_SIZE) {
          		struct kdbg_pte p = { NULL, NULL, NULL };
          		struct vm_area_struct *vma;
          		pte_t pte, new;
          
          		vma = find_vma(mm, a);
          		if (!vma || vma->vm_start > a)
          			continue;		/* nothing mapped here */
          
          		if (kdbg_pte_lock(mm, a, &p))
          			continue;
          
          		pte = *p.ptep;
          		if (!pte_present(pte)) {
          			kdbg_pte_unlock(&p);
          			continue;		/* not faulted in yet */
          		}
          
          		new = pte;
          		if (mode == KDBG_WATCH_WRITE) {
          			/*
          			 * Safe on anything: clearing the write bit is what
          			 * copy-on-write does, and the page is not lost, only
          			 * made read-only until the next write faults.
          			 */
          			new = pte_wrprotect(pte);
          		} else if (!vma->vm_file || pte_write(pte)) {
          			/*
          			 * Clearing the PTE makes the normal fault path rebuild
          			 * it from the VMA, which needs a clean file page.
          			 */
          			kdbg_pte_unlock(&p);
          			continue;
          		}
          
          		if (mode == KDBG_WATCH_WRITE)
          			set_pte_at(mm, a, p.ptep, new);
          		else
          			ptep_get_and_clear(mm, a, p.ptep);
          
          		kdbg_pte_unlock(&p);
          		armed++;
          	}
          
          	mmap_read_unlock(mm);
          
          	if (!armed) {
          		mmput(mm);
          		return -EFAULT;
          	}
          
          	w->addr = start;
          	w->end  = end;
          	w->mode = mode;
          	w->hits = 0;
          	w->last_pc = 0;
          	w->last_task = 0;
          	w->last_addr = 0;
          	w->sp = 0;
          	memset(w->regs, 0, sizeof(w->regs));
          	w->flags = KDBG_WF_ARMED;
          	if (mode == KDBG_WATCH_ACCESS)
          		w->flags |= KDBG_WF_ACCESS;
          
          	/*
          	 * The page tables changed, so every CPU that might have them cached has
          	 * to be told.  Safe here - process context, no spinlock held.
          	 */
          	flush_tlb_mm(mm);
          
          	if (kdbg_watch_live++ == 0)
          		static_branch_enable(&kdbg_watch_key);
          
          	/* Published last: the fault path keys off w->mm. */
          	smp_wmb();
          	w->mm = mm;
          
          	(void)ret;
          
          	return slot;
          }
          EXPORT_SYMBOL_GPL(kdbg_watch_arm);
          
          /* -------------------------------------------------------------- restoring */
          
          /*
           * The fault-path entry.  Never claims the fault: it records, puts the page back
           * the way it was, and returns so the normal handling goes ahead and the access
           * succeeds.  Nothing here can fail the target's access.
           */
          int kdbg_watch_fault(struct pt_regs *regs, unsigned long addr, unsigned int esr)
          {
          	struct mm_struct *mm;
          	struct kdbg_watch_slot *w;
          	unsigned long flags;
          	int i;
          
          	if (!static_branch_unlikely(&kdbg_watch_key))
          		return 0;
          
          	mm = current->mm;
          	if (!mm)
          		return 0;
          
          	for (i = 0; i < KDBG_WATCH_SLOTS; i++) {
          		w = &kdbg_watch[i];
          		if (w->mm != mm)
          			continue;
          
          		flags = READ_ONCE(w->flags);
          		if (!(flags & KDBG_WF_ARMED))
          			continue;
          		if (addr < w->addr || addr >= w->end)
          			continue;
          
          		/*
          		 * Take the slot first: a second CPU faulting on the same page
          		 * must not record a second, phantom event.
          		 */
          		WRITE_ONCE(w->flags, flags | KDBG_WF_SPENT);
          
          		w->hits++;
          		w->last_pc = regs ? regs->pc : 0;
          		w->last_task = current->tgid;
          		w->last_addr = addr;
          		w->sp = regs ? regs->sp : 0;
          
          		if (regs) {
          			int r;
          
          			for (r = 0; r < 8; r++)
          				w->regs[r] = regs->regs[r];
          		}
          		if (esr & ESR_ELx_WNR)
          			WRITE_ONCE(w->flags, READ_ONCE(w->flags) | KDBG_WF_WRITE);
          
          		/*
          		 * That is all.  No page table work, no TLB shootdown, no lock
          		 * beyond the ones the fault path already holds - which is the
          		 * whole point.  The page is still write-protected, so the
          		 * retried write faults once more, finds this slot spent, and
          		 * the normal fault path installs a proper PTE itself.
          		 */
          		return 0;
          	}
          
          	return 0;
          }
          EXPORT_SYMBOL_GPL(kdbg_watch_fault);
          
          /* ---------------------------------------------------------------- disarm */
          
          int kdbg_watch_off(unsigned long slot)
          {
          	struct kdbg_watch_slot *w;
          	struct mm_struct *mm;
          
          	if (slot >= KDBG_WATCH_SLOTS)
          		return -EINVAL;
          
          	w = &kdbg_watch[slot];
          	if (!w->mm)
          		return -EINVAL;
          
          	mm = w->mm;
          
          	/*
          	 * Nothing to put back.  Arming only took the write bit away, and the
          	 * target's own first write to that page faults straight into the normal
          	 * path, which installs a correct PTE by itself.  So this deliberately
          	 * writes no page table at all: an unload must not be able to alter a
          	 * live process, and an "unfreeze" must not be able to wait on anything.
          	 */
          
          	WRITE_ONCE(w->flags, 0);
          	smp_wmb();
          	w->mm = NULL;
          	mmput(mm);
          
          	if (kdbg_watch_live > 0 && --kdbg_watch_live == 0)
          		static_branch_disable(&kdbg_watch_key);
          
          	return 0;
          }
          EXPORT_SYMBOL_GPL(kdbg_watch_off);
          
          /*
           * Release every slot.  Called from module_exit: the watches live in this
           * built-in file, not in the module, so without this an rmmod would leave pages
           * write-protected and the fault hook still firing - the module would look like
           * the cause of a freeze it can no longer clear.
           */
          void kdbg_watch_off_all(void)
          {
          	int i;
          
          	for (i = 0; i < KDBG_WATCH_SLOTS; i++)
          		if (kdbg_watch[i].mm)
          			kdbg_watch_off(i);
          }
          EXPORT_SYMBOL_GPL(kdbg_watch_off_all);
          
          int kdbg_watch_stat(unsigned long slot, struct kdbg_watch_info *out)
          {
          	struct kdbg_watch_slot *w;
          	int i;
          
          	if (slot >= KDBG_WATCH_SLOTS)
          		return -EINVAL;
          
          	w = &kdbg_watch[slot];
          	if (!w->mm)
          		return -EINVAL;
          
          	out->hits      = w->hits;
          	out->last_pc   = w->last_pc;
          	out->last_task = w->last_task;
          	out->addr      = w->addr;
          	out->flags     = READ_ONCE(w->flags);
          	out->sp        = w->sp;
          
          	for (i = 0; i < 8; i++)
          		out->regs[i] = w->regs[i];
          
          	return 0;
          }
          EXPORT_SYMBOL_GPL(kdbg_watch_stat);
          TW_W
          cat > drivers/kdbg/kdbg.c <<'TW_C'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * kdbg core - everything that actually touches memory.
           *
           * There is no device node, no proc entry, no sysfs attribute and not one
           * printk: logcat is one of the few channels the anti-cheat really does read,
           * so this module never says anything.
           *
           * Reads and writes map the target's own pages and copy straight between them
           * and the caller.  No staging buffer, so a bulk read costs one copy instead of
           * two, and none of the userspace checks apply - no VMA permission test, no
           * ptrace_may_access, no SELinux.  Writes break copy-on-write the same way
           * /proc/<pid>/mem does, so a read-only mapping can be written too.
           */
          #include <linux/kernel.h>
          #include <linux/sched.h>
          #include <linux/sched/mm.h>
          #include <linux/mm.h>
          #include <asm/pgtable.h>
          #include <linux/pid.h>
          #include <linux/uaccess.h>
          #include <linux/slab.h>
          #include <linux/rcupdate.h>
          #include <linux/fs.h>
          #include <linux/dcache.h>
          #include <linux/module.h>
          #include <linux/miscdevice.h>
          #include <linux/proc_fs.h>
          #include <linux/string.h>
          #include <linux/perf_event.h>
          #include <linux/hw_breakpoint.h>
          #include <linux/pagemap.h>
          #include <linux/mmap_lock.h>
          #include <linux/highmem.h>
          #include <linux/capability.h>
          #include <linux/uio.h>
          #include <linux/workqueue.h>
          
          #include <linux/kdbg.h>	/* KDBG_PRCTL_MAGIC, and the fault-path hook */
          
          #include "kdbg.h"
          
          /*
           * 1 = also answer as a device node the wanbai.h family of clients can find
           * (see the block below).  0 = syscall only, no nodes.
           */
          #define KDBG_COMPAT	1
          
          /*
           * 1 = answer a request from an unimplemented family with success instead of
           *     -ENOTTY, and record it.  A discovery setting: it makes a client that is
           *     not ours keep talking, so its protocol can be read out of the log in a
           *     single run.  Nothing is performed for those calls, so a client that
           *     trusts the answer acts on whatever was already in its buffer.
           * 0 = behave like a driver that does not know the request (the normal state).
           */
          #define KDBG_ANSWER_UNKNOWN	1
          
          /*
           * 1 = answer the prctl probe for anyone, not just root.  0 is the safer
           * default: an unprivileged caller asking and being told "yes" would be one way
           * to discover the driver, and -EINVAL is what a kernel without it returns.
           */
          #define KDBG_PROBE_ANYONE	0
          
          /*
           * find_task_by_vpid() is NOT exported to modules, and this file is a module -
           * modpost refuses the link over it.  find_get_pid() and get_pid_task() are both
           * EXPORT_SYMBOL_GPL, and get_pid_task() hands back a task reference, which is
           * exactly what the rcu_read_lock + get_task_struct dance was doing by hand.
           *
           * (The built-in half, kdbg_watch.c, keeps using find_task_by_vpid(): built-in
           * code may use unexported symbols, and it is already proven to link.)
           */
          static struct task_struct *kdbg_get_task(pid_t pid)
          {
          	struct pid *p;
          	struct task_struct *t;
          
          	p = find_get_pid(pid);
          	if (!p)
          		return NULL;
          
          	t = get_pid_task(p, PIDTYPE_PID);
          	put_pid(p);
          
          	return t;
          }
          
          /* ------------------------------------------------------- bulk memory, no buffer */
          
          /*
           * The session counters, defined up here because the transfer path below counts
           * what it could not read.  Everything else that touches them lives further
           * down with the compatibility layer.
           */
          static struct {
          	atomic64_t	opens;		/* nodes open right now		*/
          	atomic64_t	total_opens;
          	atomic64_t	keys;
          	atomic64_t	reads;
          	atomic64_t	writes;
          	atomic64_t	bases;
          	atomic64_t	denied;		/* refused: no CAP_SYS_PTRACE	*/
          	atomic64_t	prctl_reads;
          	atomic64_t	prctl_writes;
          	atomic64_t	prctl_probes;
          	atomic64_t	sys_reads;	/* plain read(2) on a node	*/
          	atomic64_t	sys_writes;	/* plain write(2) on a node	*/
          	atomic64_t	mmaps;		/* mmap(2) on a node		*/
          	atomic64_t	last_len;	/* the size the last one asked	*/
          	atomic64_t	xfer_fails;	/* the client was told "no"	*/
          	atomic64_t	xfer_holes;	/* pages not mapped, skipped	*/
          	atomic64_t	max_xfer;	/* the largest single transfer	*/
          	atomic_t	holder_pid;
          	atomic_t	last_pid;
          	char		holder_comm[TASK_COMM_LEN];
          	char		last_comm[TASK_COMM_LEN];
          	char		last_node[TASK_COMM_LEN];
          } kdbg_stat;
          
          /* --------------------------------------------------------- direct map access */
          /*
           * Reaching the target's memory through its own page tables and the kernel's
           * linear map, instead of only by pinning pages.
           *
           * get_user_pages is honest but narrow: it refuses mappings it will not fault
           * in (device and VM_IO pages among them) and charges a page reference and a
           * kmap per page.  Over a 5.6-million-read session that showed up as 19,460
           * unreadable pages, and in the cost of every single read.  Translating the
           * address here and copying through the direct map reaches those pages, and
           * costs one page-table walk instead.
           *
           * It is the first try, not the only one: a page that is not present (swapped
           * out, or not faulted in yet) and a huge mapping fall through to
           * get_user_pages, which faults pages in and handles THP properly.  Nothing
           * that worked before stops working.
           *
           * The guard that matters: a page-table page that has been recycled can
           * translate to a physical address outside the linear map, and phys_to_virt()
           * then returns an unmapped kernel address that faults on the first load - a
           * kernel oops caused by a userspace read.  virt_addr_valid() is what stops
           * that, and it has to stay.
           */
          static int kdbg_va_to_kaddr(struct mm_struct *mm, unsigned long va,
          			    void **kva, unsigned long *pfn_out)
          {
          	pgd_t *pgd;
          	pud_t *pud;
          	pmd_t *pmd;
          	pte_t *ptep;
          	pte_t pte;
          	unsigned long pfn;
          	void *k;
          
          	pgd = pgd_offset(mm, va);
          	if (pgd_none(*pgd) || pgd_bad(*pgd))
          		return -EFAULT;
          
          	pud = pud_offset(pgd, va);
          	if (pud_none(*pud) || pud_bad(*pud))
          		return -EFAULT;
          
          	pmd = pmd_offset(pud, va);
          	if (pmd_none(*pmd) || pmd_bad(*pmd))
          		return -EFAULT;
          	if (pmd_trans_huge(*pmd))
          		return -EOPNOTSUPP;	/* leave it to get_user_pages */
          
          	ptep = pte_offset_kernel(pmd, va);
          	if (!ptep)
          		return -EFAULT;
          
          	pte = READ_ONCE(*ptep);
          	if (!pte_present(pte))
          		return -EFAULT;		/* swapped, or not faulted in yet */
          
          	pfn = pte_pfn(pte);
          	if (!pfn_valid(pfn))
          		return -EFAULT;
          
          	k = phys_to_virt((phys_addr_t)pfn << PAGE_SHIFT) + (va & ~PAGE_MASK);
          	if (!virt_addr_valid(k))
          		return -EFAULT;		/* not in the linear map - do not touch */
          
          	*kva = k;
          	*pfn_out = pfn;
          
          	return 0;
          }
          
          /*
           * One page of a transfer.  `hole` means the page could not be reached at all,
           * which is not an error here: what to do about it is the caller's decision,
           * and for a read it is "skip it and carry on".
           */
          static int kdbg_copy_page(struct task_struct *t, struct mm_struct *mm,
          			  unsigned long va, void __user *ubuf, size_t n,
          			  bool write, bool *hole)
          {
          	unsigned long pfn = 0;
          	void *kva = NULL;
          	struct page *pg;
          	void *kaddr;
          
          	*hole = false;
          
          	/*
          	 * A WRITE never takes the direct map shortcut.
          	 *
          	 * FOLL_FORCE|FOLL_WRITE is what breaks copy-on-write: it hands back the
          	 * process's OWN page, which is the page its next read will see.  Writing
          	 * through the direct map instead writes whichever page the PTE points at
          	 * at that instant - and for a clean copy-on-write page that is the shared
          	 * original, which the process then copies for itself on its own first
          	 * write, so the value we wrote is never the one it reads back.  A read
          	 * has no such problem, so the walk is kept for reads.
          	 *
          	 * A write is also rare - 285 against 17.6 million reads in the session
          	 * that prompted this - so nothing is lost by paying for the pin.
          	 *
          	 * The lock covers the walk AND the copy after it, for the same reason
          	 * get_user_pages takes one: between reading a PTE and reading the page it
          	 * points at, the mapping could be zapped.  It cannot cover the pin below,
          	 * because get_user_pages_remote() takes mmap_sem itself and a recursive
          	 * read lock on a rwsem deadlocks against a writer that is already waiting.
          	 */
          	if (!write) {
          		mmap_read_lock(mm);
          		if (!kdbg_va_to_kaddr(mm, va, &kva, &pfn)) {
          			int err = copy_to_user(ubuf, kva, n) ? -EFAULT : 0;
          
          			mmap_read_unlock(mm);
          			return err;
          		}
          		mmap_read_unlock(mm);
          	}
          
          	/* Pin the page: correct copy-on-write for a write, and it faults a read in. */
          	if (get_user_pages_remote(t, mm, va, 1,
          				  write ? (FOLL_FORCE | FOLL_WRITE) : FOLL_FORCE,
          				  &pg, NULL, NULL) != 1) {
          		*hole = true;
          		return 0;
          	}
          
          	kaddr = kmap(pg);
          	if (!kaddr) {
          		put_page(pg);
          		*hole = true;
          		return 0;
          	}
          
          	if (write) {
          		if (copy_from_user(kaddr + (va & ~PAGE_MASK), ubuf, n)) {
          			kunmap(pg);
          			put_page(pg);
          			return -EFAULT;
          		}
          		set_page_dirty_lock(pg);
          	} else if (copy_to_user(ubuf, kaddr + (va & ~PAGE_MASK), n)) {
          		kunmap(pg);
          		put_page(pg);
          		return -EFAULT;
          	}
          
          	kunmap(pg);
          	put_page(pg);
          
          	return 0;
          }
          
          static long kdbg_rw(pid_t pid, unsigned long addr, void __user *ubuf,
          		    unsigned long len, bool write)
          {
          	struct task_struct *t;
          	struct mm_struct *mm;
          	unsigned long done = 0;
          	int ret = 0;
          
          	if (!len || len > KDBG_MAX_XFER || !ubuf)
          		return -EINVAL;
          
          	t = kdbg_get_task(pid);
          	if (!t)
          		return -ESRCH;
          	mm = get_task_mm(t);
          	if (!mm) {
          		put_task_struct(t);
          		return -EINVAL;
          	}
          
          	/*
          	 * A read is best-effort; a write is not.
          	 *
          	 * One unreachable page in the middle of a range used to cost the caller
          	 * the whole range - it was told "no" and lost everything readable a page
          	 * later.  That is what a flickering ESP is made of.  A read now skips
          	 * the holes and still succeeds: a blob is zero-filled where the memory
          	 * is gone (a stale value is worse than a zero one, because it is
          	 * plausible), while a small read keeps the caller's own value (0.0 has a
          	 * meaning in a field somebody is testing).
          	 *
          	 * A write keeps the strict behaviour - quietly skipping it would be a
          	 * write that did not happen, reported as one that did.
          	 */
          	while (done < len) {
          		unsigned long va = addr + done;
          		size_t n = min_t(size_t, len - done,
          				 PAGE_SIZE - (va & ~PAGE_MASK));
          		bool hole = false;
          
          		ret = kdbg_copy_page(t, mm, va, ubuf + done, n, write, &hole);
          		if (ret)
          			break;
          
          		if (hole) {
          			if (write) {
          				ret = -EFAULT;
          				break;
          			}
          			if (len > 8)
          				(void)clear_user(ubuf + done, n);
          			atomic64_inc(&kdbg_stat.xfer_holes);
          		}
          
          		done += n;
          	}
          
          	mmput(mm);
          	put_task_struct(t);
          
          	if (ret && !done)
          		return ret;
          	return done;
          }
          
          
          /* ------------------------------------------------------------ module base */
          
          /*
           * Lowest mapping of a shared object, i.e. its load base.  Walked from the
           * target's own mm rather than from /proc/<pid>/maps, so it works even if the
           * map file is closed off.
           */
          static long kdbg_find_base(pid_t pid, const char __user *uname, unsigned long *out)
          {
          	struct task_struct *t;
          	struct mm_struct *mm;
          	struct vm_area_struct *vma;
          	char name[64];
          	unsigned long base = 0;
          	size_t nlen;
          
          	if (copy_from_user(name, uname, sizeof(name)))
          		return -EFAULT;
          	name[sizeof(name) - 1] = '\0';
          	nlen = strlen(name);
          	if (!nlen)
          		return -EINVAL;
          
          	t = kdbg_get_task(pid);
          	if (!t)
          		return -ESRCH;
          	mm = get_task_mm(t);
          	put_task_struct(t);
          	if (!mm)
          		return -EINVAL;
          
          	mmap_read_lock(mm);
          	for (vma = mm->mmap; vma; vma = vma->vm_next) {
          		const struct qstr *q;
          		int hit;
          
          		if (!vma->vm_file)
          			continue;
          
          		rcu_read_lock();
          		q = &vma->vm_file->f_path.dentry->d_name;
          		hit = q->len == nlen && !memcmp(q->name, name, nlen);
          		rcu_read_unlock();
          
          		if (hit) {
          			base = vma->vm_start;	/* mmap is address-ordered */
          			break;
          		}
          	}
          	mmap_read_unlock(mm);
          	mmput(mm);
          
          	if (!base)
          		return -ENOENT;
          	*out = base;
          
          	return 0;
          }
          
          /* ------------------------------------------------------ hardware breakpoints */
          
          #ifdef CONFIG_HAVE_HW_BREAKPOINT
          /*
           * Hardware breakpoints - the reason a kernel side is worth having.
           *
           * Nothing about the target changes.  The address goes into one of the four
           * debug registers, and the CPU tells us when it gets there.  There is no
           * patched byte, no page made writable, no trampoline and no leftover rwxp
           * mapping, so there is nothing to find by comparing the process against a
           * clean copy of itself - and nothing that survives the game being restarted.
           *
           * The handler runs in debug-exception context: no sleeping, no locks, no
           * allocation.  It counts, remembers the pc, and does what the slot was armed
           * to do.
           */
          struct kdbg_hbp {
          	struct perf_event	*bp;		/* per task		*/
          	struct perf_event * __percpu *wbp;	/* per cpu, wide	*/
          	unsigned long		tgid;
          	unsigned long		addr;
          	unsigned long long	hits;
          	unsigned long		last_pc;
          	unsigned long long	spent;
          	unsigned long		action;
          	unsigned long		value;
          	unsigned long		reg;
          	unsigned long		nregs;
          	unsigned long		regs[KDBG_HBP_REGS];
          	unsigned long		vals[KDBG_HBP_REGS];
          };
          
          static struct kdbg_hbp kdbg_hbp[KDBG_HBP_SLOTS];
          
          static void kdbg_hbp_triggered(struct perf_event *bp,
          			       struct perf_sample_data *data,
          			       struct pt_regs *regs)
          {
          	struct kdbg_hbp *h = bp->overflow_handler_context;
          
          	if (!h)
          		return;
          
          	/*
          	 * A wide breakpoint is armed on the address, not on a task, so it fires
          	 * for whichever process happens to execute there - including ones that
          	 * merely share the address.  The guard is what keeps the actioned
          	 * registers belonging to the process that asked for it.
          	 */
          	if (h->tgid && task_tgid_vnr(current) != (pid_t)h->tgid)
          		return;
          
          	h->hits++;
          	if (regs)
          		h->last_pc = regs->pc;
          
          	if (h->action == KDBG_ACT_NONE) {
          		/*
          		 * Counting mode.  An execute breakpoint traps before the
          		 * instruction runs, so if the kernel does not single-step it
          		 * the CPU retries and traps again; after KDBG_HBP_TRIP hits we
          		 * skip it once.  That derails at most the thread that tripped
          		 * it, where letting it spin would take the core with it.
          		 */
          		if (h->hits == KDBG_HBP_TRIP && regs) {
          			regs->pc += 4;
          			h->spent = 1;
          		}
          		return;
          	}
          
          	if (!regs)
          		return;
          
          	/*
          	 * Every action below leaves pc somewhere other than this address.
          	 * One that did not would trip again on the same instruction and never
          	 * get out - which is why there is no "set the register and carry on".
          	 */
          	switch (h->action) {
          	case KDBG_ACT_SKIP:
          		regs->pc += 4;
          		break;
          	case KDBG_ACT_RET:
          		/* Return from the function now, answering with `value`. */
          		regs->pc = regs->regs[30];
          		regs->regs[0] = h->value;
          		break;
          	case KDBG_ACT_PC:
          		regs->pc = h->value;
          		break;
          	case KDBG_ACT_X0:
          		regs->regs[0] = h->value;
          		regs->pc += 4;
          		break;
          	case KDBG_ACT_REG:
          		if (h->reg < 31)
          			regs->regs[h->reg] = h->value;
          		regs->pc += 4;
          		break;
          	case KDBG_ACT_GP: {
          		unsigned long i;
          
          		for (i = 0; i < h->nregs && i < KDBG_HBP_REGS; i++)
          			if (h->regs[i] < 31)
          				regs->regs[h->regs[i]] = h->vals[i];
          
          		regs->pc += 4;		/* the instruction does not run */
          		break;
          	}
          	case KDBG_ACT_FP: {
          		struct user_fpsimd_state *st = &current->thread.uw.fpsimd_state;
          		unsigned long i;
          
          		for (i = 0; i < h->nregs && i < KDBG_HBP_REGS; i++) {
          			unsigned long idx = h->regs[i];
          
          			if (idx >= 32)
          				continue;
          
          			/*
          			 * An "s" register is the low 32 bits of the 128-bit
          			 * vector, so only those bits are replaced and the rest
          			 * of the vector is left alone.
          			 */
          			st->vregs[idx] = (st->vregs[idx] & ~(__uint128_t)0xffffffffULL)
          				       | (__uint128_t)(u32)h->vals[i];
          		}
          
          		/*
          		 * Mark the task's FP state as not in the registers, so the
          		 * kernel loads what we just wrote on the way back to
          		 * userspace.  Doing it this way avoids touching the FP/SIMD
          		 * hardware from a debug exception.
          		 */
          		set_thread_flag(TIF_FOREIGN_FPSTATE);
          
          		regs->pc += 4;
          		break;
          	}
          	}
          }
          
          static long kdbg_hbp_set(const struct kdbg_hbp_cfg *cfg)
          {
          	struct perf_event_attr attr;
          	struct task_struct *t;
          	struct perf_event *bp = NULL;
          	struct perf_event * __percpu *wbp = NULL;
          	int slot;
          
          	if (!cfg->addr)
          		return -EINVAL;
          
          	/*
          	 * A data watchpoint is refused outright, and so is counting mode - a
          	 * debug exception is taken before the access completes, this kernel
          	 * does not single-step it, and the access therefore re-executes and
          	 * traps forever.  Every action below moves pc, so none of them storms.
          	 */
          	if (cfg->type == KDBG_BP_W)
          		return -EOPNOTSUPP;
          	if (cfg->action == KDBG_ACT_NONE)
          		return -EOPNOTSUPP;
          
          	for (slot = 0; slot < KDBG_HBP_SLOTS; slot++)
          		if (!kdbg_hbp[slot].bp && !kdbg_hbp[slot].wbp)
          			break;
          	if (slot == KDBG_HBP_SLOTS)
          		return -ENOSPC;
          
          	t = kdbg_get_task((pid_t)cfg->pid);
          	if (!t)
          		return -ESRCH;
          
          	hw_breakpoint_init(&attr);
          	attr.bp_addr = cfg->addr;
          	attr.bp_len  = cfg->len ? cfg->len : HW_BREAKPOINT_LEN_4;
          	attr.bp_type = cfg->type ? HW_BREAKPOINT_W : HW_BREAKPOINT_X;
          
          	/*
          	 * Wide arms the address itself on every CPU, so one slot covers every
          	 * thread of the game rather than the single thread it was armed on.  It
          	 * also fires for any other process that reaches that address, which is
          	 * what the tgid guard in the handler is for.
          	 */
          	if (cfg->flags & KDBG_HBPF_WIDE) {
          		wbp = register_wide_hw_breakpoint(&attr, kdbg_hbp_triggered,
          						  &kdbg_hbp[slot]);
          		if (IS_ERR(wbp)) {
          			put_task_struct(t);
          			return PTR_ERR(wbp);
          		}
          	} else {
          		bp = register_user_hw_breakpoint(&attr, kdbg_hbp_triggered,
          						 &kdbg_hbp[slot], t);
          		if (IS_ERR(bp)) {
          			put_task_struct(t);
          			return PTR_ERR(bp);
          		}
          	}
          
          	kdbg_hbp[slot].bp      = bp;
          	kdbg_hbp[slot].wbp     = wbp;
          	kdbg_hbp[slot].tgid    = (unsigned long)task_tgid_vnr(t);
          	kdbg_hbp[slot].addr    = cfg->addr;
          	kdbg_hbp[slot].hits    = 0;
          	kdbg_hbp[slot].last_pc = 0;
          	kdbg_hbp[slot].spent   = 0;
          	kdbg_hbp[slot].action  = cfg->action;
          	kdbg_hbp[slot].value   = cfg->value;
          	kdbg_hbp[slot].reg     = cfg->reg;
          	kdbg_hbp[slot].nregs   = cfg->nregs > KDBG_HBP_REGS
          			       ? KDBG_HBP_REGS : cfg->nregs;
          	memcpy(kdbg_hbp[slot].regs, cfg->regs, sizeof(kdbg_hbp[slot].regs));
          	memcpy(kdbg_hbp[slot].vals, cfg->vals, sizeof(kdbg_hbp[slot].vals));
          
          	put_task_struct(t);
          
          	return slot;
          }
          
          static long kdbg_hbp_del(unsigned long slot)
          {
          	if (slot >= KDBG_HBP_SLOTS)
          		return -EINVAL;
          	if (!kdbg_hbp[slot].bp && !kdbg_hbp[slot].wbp)
          		return -EINVAL;
          
          	if (kdbg_hbp[slot].wbp) {
          		unregister_wide_hw_breakpoint(kdbg_hbp[slot].wbp);
          		kdbg_hbp[slot].wbp = NULL;
          	}
          
          	if (kdbg_hbp[slot].bp) {
          		unregister_hw_breakpoint(kdbg_hbp[slot].bp);
          		kdbg_hbp[slot].bp = NULL;
          	}
          
          	kdbg_hbp[slot].tgid = 0;
          
          	return 0;
          }
          
          static long kdbg_hbp_stat(unsigned long slot, unsigned long __user *uout)
          {
          	u64 v[4];
          
          	if (slot >= KDBG_HBP_SLOTS ||
          	    (!kdbg_hbp[slot].bp && !kdbg_hbp[slot].wbp))
          		return -EINVAL;
          
          	v[0] = kdbg_hbp[slot].hits;
          	v[1] = kdbg_hbp[slot].last_pc;
          	v[2] = kdbg_hbp[slot].spent;
          	v[3] = kdbg_hbp[slot].addr;
          
          	return copy_to_user(uout, v, sizeof(v)) ? -EFAULT : 0;
          }
          
          static void kdbg_hbp_cleanup(void)
          {
          	int slot;
          
          	for (slot = 0; slot < KDBG_HBP_SLOTS; slot++)
          		if (kdbg_hbp[slot].bp || kdbg_hbp[slot].wbp) {
          			if (kdbg_hbp[slot].wbp) {
          				unregister_wide_hw_breakpoint(kdbg_hbp[slot].wbp);
          				kdbg_hbp[slot].wbp = NULL;
          			}
          			if (kdbg_hbp[slot].bp) {
          				unregister_hw_breakpoint(kdbg_hbp[slot].bp);
          				kdbg_hbp[slot].bp = NULL;
          			}
          		}
          }
          #else /* !CONFIG_HAVE_HW_BREAKPOINT */
          static void kdbg_hbp_cleanup(void) { }
          #endif /* CONFIG_HAVE_HW_BREAKPOINT */
          
          /*
           * Only root may read or write another process's memory.
           *
           * This matters more than it looks.  The prctl magic is written in every scene
           * header, so it is effectively public knowledge - without this check any app on
           * the phone could use the driver, and worse, the game's own anti-cheat (which
           * runs unprivileged, inside the game process) could call the magic and discover
           * the driver just by asking.  With the check it gets -EPERM and learns nothing.
           *
           * Every scene client runs as root, so nothing legitimate is lost.
           */
          static bool kdbg_allowed(void)
          {
          	return capable(CAP_SYS_PTRACE);
          }
          
          /* -------------------------------------------------------- wanbai.h compatibility */
          /*
           * Compatibility with the wanbai.h family of clients.
           *
           * Those hacks do not know about us and never will: they open a device node
           * and issue ioctl 0x800..0x803.
           *
           *   0x800  initKey, a per-build key string
           *   0x801  {int pid; uintptr_t addr; void *buffer; size_t size;}
           *   0x802  the same struct, writing
           *   0x803  {int pid; char *name; uintptr_t base;}
           *
           * Those struct layouts are copied from their header, so the offsets match
           * exactly.  One node per name they hunt for, plus a fake /proc entry for the
           * rt-proc shape, lets an unmodified hack work against us by picking its own
           * menu entry - nothing to recompile and nothing to rebuild.
           *
           * The key is accepted whatever it is.  We are not the build that minted it,
           * and refusing an unknown key would only break the handshake.
           *
           * Set KDBG_COMPAT to 0 when you want no device nodes at all.
           */
          /*
           * The names the scene hacks hunt for.  Two families: wanbai.h scans /dev for
           * its five, and the Bing backend tries its six in order.  One node per name
           * costs a /dev entry and nothing else, and any of them lands on this driver -
           * which is what makes an unmodified hack work by picking its own menu entry.
           */
          #define KDBG_COMPAT_DEVS \
          	"wanbai,CheckMe,Ckanri,lanran,video188,bing,"      \
          	"ft_driver,bing_rw,Bing_rw,Bing,w1a3n3a7n"
          #define KDBG_COMPAT_PROC "kvmstats"
          #define KDBG_COMPAT_CHRDEV "kdbg"
          
          #define KDBG_IOCTL_INIT_KEY	0x800
          #define KDBG_IOCTL_READ_MEM	0x801
          #define KDBG_IOCTL_WRITE_MEM	0x802
          #define KDBG_IOCTL_MODULE_BASE	0x803
          
          /*
           * A second family, same idea and the same structs, different opcode range and
           * different node names.  Answering it too costs one dispatch arm and makes the
           * "option 7 / Bing" entry in a hack's menu work.
           */
          #define KDBG_IOCTL_BING_KEY	0x100
          #define KDBG_IOCTL_BING_READ	0x101
          #define KDBG_IOCTL_BING_WRITE	0x102
          #define KDBG_IOCTL_BING_BASE	0x103
          
          struct kdbg_copy_memory {
          	pid_t		pid;
          	uintptr_t	addr;
          	void		*buffer;
          	size_t		size;
          };
          
          struct kdbg_module_base {
          	pid_t		pid;
          	char		*name;
          	uintptr_t	base;
          };
          
          /*
           * Who is using it.
           *
           * From the outside, a hack that drives this driver and a hack that opened a
           * node, gave up and fell back to process_vm_readv look exactly the same: both
           * leave a node open for a moment and both read the game either way.  The
           * difference only exists in here, so it is counted in here - opens, the key
           * handshake, and then the reads, writes and module lookups that follow.
           * Nothing is inferred: if the counters are zero, nothing used us.
           */
          
          /*
           * The ioctl request values themselves, whatever they are.
           *
           * A backend that finds a node, opens it and then walks away has told us the
           * name is right and the next step is not: it sent a request we did not answer,
           * or it sent nothing at all.  Those two look identical from the counters, and
           * they are different problems - so the request values are recorded too, up to
           * eight distinct ones, and an empty table means the mod never asked us anything.
           */
          #define KDBG_CMD_SLOTS	8
          #define KDBG_CMD_UNUSED	0xffffffffU
          
          static unsigned int	kdbg_cmds[KDBG_CMD_SLOTS];
          static atomic64_t	kdbg_cmd_hits[KDBG_CMD_SLOTS];
          static unsigned int	kdbg_cmd_arg[KDBG_CMD_SLOTS][8];
          static atomic_t		kdbg_cmd_next = ATOMIC_INIT(0);
          
          static void kdbg_count_seen(unsigned int *tab, atomic64_t *hits,
          			    atomic_t *next, unsigned int v)
          {
          	int i;
          	int n = atomic_read(next);
          
          	for (i = 0; i < KDBG_CMD_SLOTS; i++) {
          		if (tab[i] == v) {
          			atomic64_inc(&hits[i]);
          			return;
          		}
          	}
          
          	i = n % KDBG_CMD_SLOTS;		/* none matched: take the next slot */
          	tab[i] = v;
          	atomic64_set(&hits[i], 1);
          	atomic_set(next, n + 1);
          }
          
          /*
           * What the argument pointed at, for a request we have never seen.
           *
           * An unknown opcode is a whole protocol hiding behind one number: the only way
           * to decode it without its author's header is to look at what it passed.  The
           * first 32 bytes are copied out of the caller's memory (a scalar argument just
           * fails the copy and leaves zeroes), which is enough to see a
           * {pid, addr, buffer, size} layout at a glance.
           */
          static void kdbg_note_cmd(unsigned int cmd, unsigned long arg)
          {
          	int i;
          	int n = atomic_read(&kdbg_cmd_next);
          
          	for (i = 0; i < KDBG_CMD_SLOTS; i++) {
          		if (kdbg_cmds[i] == cmd) {
          			atomic64_inc(&kdbg_cmd_hits[i]);
          			return;
          		}
          	}
          
          	i = n % KDBG_CMD_SLOTS;		/* none matched: take the next slot */
          	kdbg_cmds[i] = cmd;
          	atomic64_set(&kdbg_cmd_hits[i], 1);
          
          	memset(kdbg_cmd_arg[i], 0, sizeof(kdbg_cmd_arg[i]));
          	if (arg)
          		(void)copy_from_user(kdbg_cmd_arg[i], (void __user *)arg,
          				     sizeof(kdbg_cmd_arg[i]));
          
          	atomic_set(&kdbg_cmd_next, n + 1);
          }
          
          /*
           * Every prctl the kernel sees, filtered to the ones that are not libc's.
           *
           * A scene driver's magic is a large number - 0x4E41 is one - while every option
           * glibc and bionic use is small, so anything under 1024 is dropped before the
           * table.  What is left is a driver probe, from whichever process sent it, and
           * that answers a question the prctl counters cannot: whether a mod is asking
           * for a driver we have not implemented.
           */
          static unsigned int	kdbg_pcmds[KDBG_CMD_SLOTS];
          static atomic64_t	kdbg_pcmd_hits[KDBG_CMD_SLOTS];
          static atomic_t		kdbg_pcmd_next = ATOMIC_INIT(0);
          
          static void kdbg_prctl_note(int option)
          {
          	if (option < 1024 || option == KDBG_PRCTL_MAGIC)
          		return;			/* libc's own, or one we already answer */
          	kdbg_count_seen(kdbg_pcmds, kdbg_pcmd_hits, &kdbg_pcmd_next,
          			(unsigned int)option);
          }
          
          static void kdbg_note(atomic64_t *ctr)
          {
          	if (ctr)
          		atomic64_inc(ctr);
          	atomic_set(&kdbg_stat.last_pid, task_tgid_vnr(current));
          	strlcpy(kdbg_stat.last_comm, current->comm, TASK_COMM_LEN);
          }
          
          static void kdbg_note_denied(void)
          {
          	atomic64_inc(&kdbg_stat.denied);
          	kdbg_note(NULL);
          }
          
          /*
           * A transfer that did not come back whole.
           *
           * A hack that reads eight bytes at a time and gets -EFAULT on some of them
           * shows it as stutter, not as an error - which is why it is counted here and
           * not left to be guessed at.  `max_xfer` is there to catch the other failure
           * mode: a client asking for one big block and being refused for size.
           */
          static void kdbg_xfer_note(unsigned long len, bool ok)
          {
          	if (!ok)
          		atomic64_inc(&kdbg_stat.xfer_fails);
          	if (len > atomic64_read(&kdbg_stat.max_xfer))
          		atomic64_set(&kdbg_stat.max_xfer, len);
          }
          
          static long kdbg_compat_ioctl(struct file *f, unsigned int cmd, unsigned long arg)
          {
          	void __user *uarg = (void __user *)arg;
          	struct miscdevice *m = f ? f->private_data : NULL;
          
          	/*
          	 * Every request, recognised or not, and the node it came to.  A mod that
          	 * picked the wrong entry of its own menu shows up here as an opcode we
          	 * do not answer, and that is a line to add rather than a mystery.
          	 */
          	kdbg_note_cmd(cmd, arg);
          	strlcpy(kdbg_stat.last_node, (m && m->name) ? m->name : "?",
          		sizeof(kdbg_stat.last_node));
          
          	switch (cmd) {
          	case KDBG_IOCTL_INIT_KEY:
          	case KDBG_IOCTL_BING_KEY:
          		/* any key, any length, even none */
          		kdbg_note(&kdbg_stat.keys);
          		return 0;
          
          	case KDBG_IOCTL_READ_MEM:
          	case KDBG_IOCTL_BING_READ: {
          		if (!kdbg_allowed()) {
          			kdbg_note_denied();
          			return -EPERM;
          		}
          		kdbg_note(&kdbg_stat.reads);
          
          		struct kdbg_copy_memory cm;
          		long r;
          
          		if (copy_from_user(&cm, uarg, sizeof(cm)))
          			return -EFAULT;
          		if (!cm.buffer || !cm.size)
          			return -EINVAL;
          
          		r = kdbg_rw(cm.pid, cm.addr, (void __user *)cm.buffer, cm.size, false);
          		kdbg_xfer_note(cm.size, r == (long)cm.size);
          		return r == (long)cm.size ? 0 : (r < 0 ? r : -EFAULT);
          	}
          
          	case KDBG_IOCTL_WRITE_MEM:
          	case KDBG_IOCTL_BING_WRITE: {
          		if (!kdbg_allowed()) {
          			kdbg_note_denied();
          			return -EPERM;
          		}
          		kdbg_note(&kdbg_stat.writes);
          
          		struct kdbg_copy_memory cm;
          		long r;
          
          		if (copy_from_user(&cm, uarg, sizeof(cm)))
          			return -EFAULT;
          		if (!cm.buffer || !cm.size)
          			return -EINVAL;
          
          		r = kdbg_rw(cm.pid, cm.addr, (void __user *)cm.buffer, cm.size, true);
          		kdbg_xfer_note(cm.size, r == (long)cm.size);
          		return r == (long)cm.size ? 0 : (r < 0 ? r : -EFAULT);
          	}
          
          	case KDBG_IOCTL_MODULE_BASE:
          	case KDBG_IOCTL_BING_BASE: {
          		if (!kdbg_allowed()) {
          			kdbg_note_denied();
          			return -EPERM;
          		}
          		kdbg_note(&kdbg_stat.bases);
          
          		struct kdbg_module_base mb;
          		unsigned long base = 0;
          		long r;
          
          		if (copy_from_user(&mb, uarg, sizeof(mb)))
          			return -EFAULT;
          		if (!mb.name)
          			return -EINVAL;
          
          		r = kdbg_find_base(mb.pid, (const char __user *)mb.name, &base);
          		if (r)
          			return r;
          		if (put_user(base, &((struct kdbg_module_base __user *)uarg)->base))
          			return -EFAULT;
          		return 0;
          	}
          
          	default:
          		/*
          		 * A request from a family we have not implemented.  KDBG_ANSWER_UNKNOWN
          		 * says yes to it anyway, for one reason: a client that is refused here
          		 * stops, and stops telling us anything.  Answered, it goes on to its
          		 * next request, and the table above records every one of them along
          		 * with the first 32 bytes of each argument - which is how an unknown
          		 * protocol gets decoded, in one run instead of one flash per opcode.
          		 *
          		 * It is a discovery setting: nothing is actually done for the call, so
          		 * a client that trusts the answer will read whatever was already in its
          		 * buffer.  Set it to 0 once the protocol is known and its arms exist.
          		 */
          		return KDBG_ANSWER_UNKNOWN ? 0 : -ENOTTY;
          	}
          }
          
          /*
           * The nodes stay until they are taken away.
           *
           * They used to tidy themselves up: every open and close was counted, and a
           * timer removed the whole set once nothing had held it for 30 seconds.  That
           * was wrong for how these hacks behave - a client opens a node, validates,
           * closes it, and comes back later - so the set vanished underneath a mod that
           * was still working, and "driver not found" was all it could say.  Now they
           * live from `compat on` to `compat off`, and nothing between.
           */
          static void kdbg_compat_up(void);
          static void kdbg_compat_down(void);
          static DEFINE_MUTEX(kdbg_compat_lock);
          
          /* Counting only - nothing here ever takes a node away. */
          static int kdbg_compat_open(struct inode *ino, struct file *f)
          {
          	/*
          	 * The node's name comes from the file, not from private_data: which of
          	 * them a mod picks is the whole question when it opens and then says
          	 * nothing, and private_data is not guaranteed to be set this early.
          	 */
          	strlcpy(kdbg_stat.last_node,
          		(const char *)f->f_path.dentry->d_name.name,
          		sizeof(kdbg_stat.last_node));
          
          	atomic64_inc(&kdbg_stat.opens);
          	atomic64_inc(&kdbg_stat.total_opens);
          	atomic_set(&kdbg_stat.holder_pid, task_tgid_vnr(current));
          	strlcpy(kdbg_stat.holder_comm, current->comm, TASK_COMM_LEN);
          	kdbg_note(NULL);
          
          	return 0;
          }
          
          static int kdbg_compat_release(struct inode *ino, struct file *f)
          {
          	atomic64_dec(&kdbg_stat.opens);
          
          	return 0;
          }
          
          /*
           * What the last `compat on` actually managed, on the proc entry and readable
           * from the nodes.  It exists because the outside world had no way to tell a
           * registration that worked from one that quietly did not: the syscall used to
           * answer 0 either way, and so did the client.
           *
           *	misc=<n>       how many nodes the kernel made itself
           *	misc_err=<e>   what misc_register() said when it would not
           *	major=<m>      the fallback's major, 0 when the fallback was not needed
           *
           * When major is not 0 the kernel could not create the nodes at all - that is
           * device_create() refusing, not the minor pool - and the client makes them with
           * mknod, the way the scene hacks that ship one already do.
           */
          static char kdbg_status[128];
          
          static ssize_t kdbg_status_read(struct file *f, char __user *buf, size_t len,
          				loff_t *off)
          {
          	size_t n;
          
          	if (*off)
          		return 0;
          
          	n = strlen(kdbg_status);
          	if (n > len)
          		n = len;
          	if (n && copy_to_user(buf, kdbg_status, n))
          		return -EFAULT;
          	*off += n;
          
          	return n;
          }
          
          /*
           * The other things a program can do to a node.
           *
           * None of them is part of the interface - the hacks use ioctl - but a mod that
           * opens a node and sends no request at all is doing one of these instead, and
           * that is the difference between "it uses the driver" and "it keeps the
           * driver's existence as a token while it reads the game some other way".
           * Counted, answered honestly, and nothing faked: a node here has no read()
           * semantics to invent.
           */
          static ssize_t kdbg_compat_read(struct file *f, char __user *buf, size_t len,
          				loff_t *off)
          {
          	atomic64_inc(&kdbg_stat.sys_reads);
          	atomic64_set(&kdbg_stat.last_len, len);
          
          	return -EINVAL;
          }
          
          static ssize_t kdbg_compat_write(struct file *f, const char __user *buf,
          				 size_t len, loff_t *off)
          {
          	atomic64_inc(&kdbg_stat.sys_writes);
          	atomic64_set(&kdbg_stat.last_len, len);
          
          	return -EINVAL;
          }
          
          static int kdbg_compat_mmap(struct file *f, struct vm_area_struct *vma)
          {
          	atomic64_inc(&kdbg_stat.mmaps);
          	atomic64_set(&kdbg_stat.last_len, vma->vm_end - vma->vm_start);
          
          	return -ENODEV;
          }
          
          /*
           * The status file answers one thing only: what the last `compat on` managed.
           * It has no ioctl, so nothing can be handed to it by mistake for a real node.
           */
          static const struct file_operations kdbg_status_fops = {
          	.owner		= THIS_MODULE,
          	.read		= kdbg_status_read,
          };
          
          /*
           * The rt-proc shape: the same driver behind /proc/kvmstats.
           *
           * A backend that looks for a proc entry instead of a node opens this and then
           * speaks the same ioctls - so it gets the same ioctls.  Before this it could
           * find the file and do nothing with it, which reads exactly like a driver that
           * does not exist.  Reading it still returns the status line.
           */
          static const struct file_operations kdbg_proc_fops = {
          	.owner		= THIS_MODULE,
          	.read		= kdbg_status_read,
          	.unlocked_ioctl	= kdbg_compat_ioctl,
          	.compat_ioctl	= kdbg_compat_ioctl,
          };
          
          static const struct file_operations kdbg_compat_fops = {
          	.owner		= THIS_MODULE,
          	.open		= kdbg_compat_open,
          	.release	= kdbg_compat_release,
          	.read		= kdbg_compat_read,
          	.write		= kdbg_compat_write,
          	.mmap		= kdbg_compat_mmap,
          	.unlocked_ioctl	= kdbg_compat_ioctl,
          	.compat_ioctl	= kdbg_compat_ioctl,
          };
          
          #define KDBG_COMPAT_MAX	12
          
          /*
           * 0 = do not create the device nodes at load.  They are the only part of this
           * driver that is visible to every process, so the default is nothing; a session
           * that needs them asks for them, either with `insmod ... compat=1` or with the
           * KDBG_OP_COMPAT syscall at runtime.
           */
          #ifdef MODULE
          static int kdbg_compat;
          module_param(kdbg_compat, int, 0644);
          MODULE_PARM_DESC(kdbg_compat, "register the wanbai/bing device nodes at load (0/1)");
          #else
          static int kdbg_compat;	/* built in: no parameter, so no /sys/module entry */
          #endif
          
          static struct miscdevice kdbg_misc[KDBG_COMPAT_MAX];
          static char kdbg_misc_name[KDBG_COMPAT_MAX][32];
          static int kdbg_misc_n;
          static struct proc_dir_entry *kdbg_proc;
          static int kdbg_misc_err;	/* the last refusal from misc_register()	*/
          static int kdbg_chrdev_major;	/* the fallback's major, 0 when unused		*/
          
          /* the pair the rest of the driver - and the syscall - actually uses */
          static int kdbg_compat_init(void)
          {
          	int r, i;
          
          	mutex_lock(&kdbg_compat_lock);
          	kdbg_compat_up();
          
          	/* a new session, a new count - but never `opens`, which is live */
          	atomic64_set(&kdbg_stat.total_opens, 0);
          	atomic64_set(&kdbg_stat.keys, 0);
          	atomic64_set(&kdbg_stat.reads, 0);
          	atomic64_set(&kdbg_stat.writes, 0);
          	atomic64_set(&kdbg_stat.bases, 0);
          	atomic64_set(&kdbg_stat.denied, 0);
          	atomic64_set(&kdbg_stat.prctl_reads, 0);
          	atomic64_set(&kdbg_stat.prctl_writes, 0);
          	atomic64_set(&kdbg_stat.prctl_probes, 0);
          	atomic64_set(&kdbg_stat.sys_reads, 0);
          	atomic64_set(&kdbg_stat.sys_writes, 0);
          	atomic64_set(&kdbg_stat.mmaps, 0);
          	atomic64_set(&kdbg_stat.last_len, 0);
          	atomic64_set(&kdbg_stat.xfer_fails, 0);
          	atomic64_set(&kdbg_stat.xfer_holes, 0);
          	atomic64_set(&kdbg_stat.max_xfer, 0);
          	atomic_set(&kdbg_stat.last_pid, 0);
          	kdbg_stat.last_comm[0] = '\0';
          	kdbg_stat.last_node[0] = '\0';
          	for (i = 0; i < KDBG_CMD_SLOTS; i++) {
          		kdbg_cmds[i] = KDBG_CMD_UNUSED;
          		atomic64_set(&kdbg_cmd_hits[i], 0);
          		memset(kdbg_cmd_arg[i], 0, sizeof(kdbg_cmd_arg[i]));
          		kdbg_pcmds[i] = KDBG_CMD_UNUSED;
          		atomic64_set(&kdbg_pcmd_hits[i], 0);
          	}
          	atomic_set(&kdbg_cmd_next, 0);
          	atomic_set(&kdbg_pcmd_next, 0);
          
          	r = (kdbg_misc_n || kdbg_chrdev_major)
          		? 0
          		: (kdbg_misc_err ? kdbg_misc_err : -ENODEV);
          	mutex_unlock(&kdbg_compat_lock);
          
          	return r;
          }
          
          static void kdbg_compat_cleanup(void)
          {
          	mutex_lock(&kdbg_compat_lock);
          	kdbg_compat_down();
          	mutex_unlock(&kdbg_compat_lock);
          }
          
          static void kdbg_compat_up(void)
          {
          	char list[160];
          	char *p = list;
          	char *tok;
          	int i;
          
          	if (kdbg_misc_n || kdbg_proc || kdbg_chrdev_major)
          		return;			/* already up */
          
          	/* miscdevice.name has to outlive this call, hence the static copies */
          	strlcpy(list, KDBG_COMPAT_DEVS, sizeof(list));
          	kdbg_misc_err = 0;
          
          	while (p && *p && kdbg_misc_n < KDBG_COMPAT_MAX) {
          		int err;
          		int m;
          
          		tok = strsep(&p, ",");
          		if (!tok || !*tok)
          			continue;
          
          		for (i = 0; i < kdbg_misc_n; i++)
          			if (!strcmp(kdbg_misc_name[i], tok))
          				break;
          		if (i < kdbg_misc_n)
          			continue;
          
          		strlcpy(kdbg_misc_name[kdbg_misc_n], tok, 32);
          		kdbg_misc[kdbg_misc_n].name  = kdbg_misc_name[kdbg_misc_n];
          		kdbg_misc[kdbg_misc_n].fops  = &kdbg_compat_fops;
          		kdbg_misc[kdbg_misc_n].mode  = 0666;
          		kdbg_misc[kdbg_misc_n].minor = MISC_DYNAMIC_MINOR;
          
          		err = misc_register(&kdbg_misc[kdbg_misc_n]);
          
          		/*
          		 * The pool of dynamic minor numbers is 96 wide (DYNAMIC_MINORS in
          		 * drivers/char/misc.c) and every driver in the tree draws from it -
          		 * on a phone the msm audio, usb, ion and ashmem devices alone take
          		 * the whole top half.  A refusal there says nothing about the
          		 * device we are asking for, so ask again with minors of our own
          		 * choosing: the high end, which only the fixed assignments in
          		 * miscdevice.h reach and which nothing on this device uses.
          		 */
          		for (m = 254; err && m >= 240; m--) {
          			kdbg_misc[kdbg_misc_n].minor = m;
          			err = misc_register(&kdbg_misc[kdbg_misc_n]);
          		}
          
          		if (err) {
          			kdbg_misc_err = err;	/* keep what it said */
          			continue;
          		}
          
          		kdbg_misc_n++;
          	}
          
          	/*
          	 * Not one of them registered, so the minor number was never the problem
          	 * and device_create() is refusing outright.  There is still a way to
          	 * have the nodes: a character device under a major of our own, with the
          	 * nodes made by the client.  Nothing in that path goes near udev.
          	 */
          	if (!kdbg_misc_n) {
          		kdbg_chrdev_major = register_chrdev(0, KDBG_COMPAT_CHRDEV,
          						    &kdbg_compat_fops);
          		if (kdbg_chrdev_major < 0)
          			kdbg_chrdev_major = 0;
          	}
          
          	kdbg_proc = proc_create(KDBG_COMPAT_PROC, 0666, NULL, &kdbg_proc_fops);
          
          	snprintf(kdbg_status, sizeof(kdbg_status),
          		 "kdbg compat: misc=%d misc_err=%d major=%d\n",
          		 kdbg_misc_n, kdbg_misc_err, kdbg_chrdev_major);
          }
          
          static void kdbg_compat_down(void)
          {
          	int i;
          
          	if (kdbg_proc) {
          		remove_proc_entry(KDBG_COMPAT_PROC, NULL);
          		kdbg_proc = NULL;
          	}
          
          	if (kdbg_chrdev_major) {
          		unregister_chrdev(kdbg_chrdev_major, KDBG_COMPAT_CHRDEV);
          		kdbg_chrdev_major = 0;
          	}
          
          	for (i = 0; i < kdbg_misc_n; i++)
          		misc_deregister(&kdbg_misc[i]);
          	kdbg_misc_n = 0;
          
          	kdbg_status[0] = '\0';
          }
          
          /* ------------------------------------------------------------- prctl family */
          /*
           * The KPM/Neo family carries the same two operations in a struct through
           * prctl() instead of an ioctl on a node:
           *
           *	prctl(0x4E41, 1, &cmd, 0, 0);	-- read
           *	prctl(0x4E41, 2, &cmd, 0, 0);	-- write
           *	prctl(0x4E41, 5, &cmd, 0, 0);	-- get pid, the probe
           *
           * Layout must match struct na_cmd in the client header byte for byte.
           *
           * The payload never leaves user memory: only the little header is copied in,
           * and kdbg_rw writes straight to and from the caller's own data[] array.
           */
          #define KDBG_NA_MAX_RW	4096
          #define KDBG_NA_CMD_READ	1
          #define KDBG_NA_CMD_WRITE	2
          #define KDBG_NA_CMD_GET_PID	5
          
          struct kdbg_na_cmd {
          	u32 op;
          	u32 pid;
          	u64 addr;
          	u32 size;
          	s32 result;
          	s32 screen_w;
          	s32 screen_h;
          	char pkg[256];
          	u8 data[KDBG_NA_MAX_RW];
          };
          
          static long kdbg_prctl(unsigned long cmd, void __user *uarg)
          {
          	struct kdbg_na_cmd __user *uc = uarg;
          	struct kdbg_na_cmd h;
          	long r;
          
          	if (!uarg)
          		return -EFAULT;
          
          	/* header only - the 4 KB payload stays where the caller put it */
          	if (copy_from_user(&h, uc, offsetof(struct kdbg_na_cmd, pkg)))
          		return -EFAULT;
          
          	switch (cmd) {
          	case KDBG_NA_CMD_GET_PID:
          		/*
          		 * The probe used to answer for anyone, on the reasoning that a
          		 * client may ask it before it elevates.  Closed by default
          		 * instead: the magic is printed in every scene header, so an
          		 * unprivileged caller asking and getting a "yes" would be a way
          		 * to discover the driver.  Returning -EINVAL is exactly what a
          		 * kernel without this option returns, so nothing is revealed.
          		 *
          		 * Set KDBG_PROBE_ANYONE to 1 if a hack turns out to probe
          		 * before it takes root and its DIT option stops being found.
          		 */
          #if !KDBG_PROBE_ANYONE
          		if (!kdbg_allowed()) {
          			kdbg_note_denied();
          			return -EINVAL;
          		}
          #endif
          		atomic64_inc(&kdbg_stat.prctl_probes);
          		kdbg_note(NULL);
          
          		h.pid = current->tgid;
          		h.result = 0;
          		break;
          
          	case KDBG_NA_CMD_READ:
          	case KDBG_NA_CMD_WRITE:
          		if (!kdbg_allowed()) {
          			kdbg_note_denied();
          			return -EPERM;
          		}
          		kdbg_note(cmd == KDBG_NA_CMD_WRITE ? &kdbg_stat.prctl_writes
          						  : &kdbg_stat.prctl_reads);
          		if (!h.size || h.size > KDBG_NA_MAX_RW) {
          			h.result = -EINVAL;
          			break;
          		}
          		r = kdbg_rw(h.pid, h.addr, (void __user *)&uc->data, h.size,
          			    cmd == KDBG_NA_CMD_WRITE);
          		h.result = (r == (long)h.size) ? 0 : (r < 0 ? r : -EIO);
          		break;
          
          	default:
          		return -EINVAL;
          	}
          
          	if (put_user(h.pid, &uc->pid) || put_user(h.result, &uc->result))
          		return -EFAULT;
          
          	return 0;
          }
          
          /* ------------------------------------------------------- the syscall forward */
          /*
           * process_vm_readv() and process_vm_writev() end up in process_vm_rw(), and
           * that function now calls kdbg_pvm_try() first (mm/process_vm_access.c, patched
           * at build time - a compiled-in call, not a hook).
           *
           * This is the answer to a mod that opens no device and speaks no protocol: it
           * reads memory one syscall at a time, and the syscall can be answered by us.
           *
           * Mode 1 records the caller and lets the kernel do the work exactly as before,
           * which is how a packed binary's mechanism gets identified at all.  Mode 2
           * performs the copy itself and the kernel's own path never runs.
           */
          static int kdbg_pvm_mode;
          static int kdbg_pvm_pid;	/* serve mode: only this caller, 0 = anyone */
          static struct kdbg_pvm_stat kdbg_pvm_tab[KDBG_PVM_SLOTS];
          
          static void kdbg_pvm_note(pid_t pid, unsigned long long bytes)
          {
          	int i, free = -1;
          
          	for (i = 0; i < KDBG_PVM_SLOTS; i++) {
          		if (kdbg_pvm_tab[i].pid == pid) {
          			kdbg_pvm_tab[i].calls++;
          			kdbg_pvm_tab[i].bytes += bytes;
          			return;
          		}
          		if (free < 0 && !kdbg_pvm_tab[i].pid)
          			free = i;
          	}
          
          	if (free < 0)
          		return;			/* table full: the busiest callers stay */
          
          	kdbg_pvm_tab[free].pid   = pid;
          	kdbg_pvm_tab[free].calls = 1;
          	kdbg_pvm_tab[free].bytes = bytes;
          	strlcpy(kdbg_pvm_tab[free].comm, current->comm, TASK_COMM_LEN);
          }
          
          #define KDBG_PVM_IOV	16
          
          static ssize_t kdbg_pvm(pid_t pid, const struct iovec __user *lvec,
          			unsigned long liovcnt, const struct iovec __user *rvec,
          			unsigned long riovcnt, int vm_write)
          {
          	struct iovec li[KDBG_PVM_IOV], ri[KDBG_PVM_IOV];
          	unsigned long long bytes = 0;
          	unsigned long n, i;
          	ssize_t done = 0;
          
          	if (!kdbg_pvm_mode || !lvec || !rvec)
          		return KDBG_NOT_HANDLED;
          	if (!liovcnt || !riovcnt)
          		return KDBG_NOT_HANDLED;
          
          	/*
          	 * pid 0 is not "no process" here - the syscall's own contract says it
          	 * means the calling process, which is how a process reads its own
          	 * memory through this call.  Treating it as a literal pid made every
          	 * self-read in the system fail with -ESRCH while serve was on, which
          	 * is a whole-system break, not a driver detail.
          	 */
          	if (!pid)
          		pid = task_tgid_vnr(current);
          
          	/*
          	 * Anything with more vectors than we have room for is left to the
          	 * kernel untouched - we are a shortcut, not a reimplementation, and a
          	 * shortcut that half-answers would be worse than no shortcut.
          	 */
          	if (liovcnt > KDBG_PVM_IOV || riovcnt > KDBG_PVM_IOV)
          		return KDBG_NOT_HANDLED;
          
          	n = min(liovcnt, riovcnt);
          
          	if (copy_from_user(li, lvec, n * sizeof(struct iovec)) ||
          	    copy_from_user(ri, rvec, n * sizeof(struct iovec)))
          		return KDBG_NOT_HANDLED;
          
          	for (i = 0; i < n; i++)
          		bytes += ri[i].iov_len;
          
          	kdbg_pvm_note(pid, bytes);
          
          	if (kdbg_pvm_mode < 2)
          		return KDBG_NOT_HANDLED;	/* counting only */
          
          	/*
          	 * Serving is aimed at one caller.
          	 *
          	 * This call sits in front of every process_vm_readv() on the phone, and
          	 * a driver bug here is not a driver problem - it is every self-read in
          	 * the system failing at once.  So serve mode names the pid it is for,
          	 * and everything else gets the kernel's own path untouched.
          	 */
          	if (kdbg_pvm_pid && task_tgid_vnr(current) != kdbg_pvm_pid)
          		return KDBG_NOT_HANDLED;
          
          	/*
          	 * The caller's own iovec is the destination for a read and the source
          	 * for a write, and copy_to_user/copy_from_user work here because we
          	 * are running in the caller's context, in its syscall.
          	 */
          	for (i = 0; i < n; i++) {
          		unsigned long len = min_t(unsigned long,
          					  li[i].iov_len, ri[i].iov_len);
          		long r;
          
          		if (!len)
          			break;
          
          		r = kdbg_rw(pid, (unsigned long)ri[i].iov_base,
          			    (void __user *)li[i].iov_base, len, vm_write != 0);
          		kdbg_xfer_note(len, r == (long)len);
          
          		if (r < 0) {
          			if (!done)
          				return r;
          			break;
          		}
          
          		done += r;
          
          		if ((unsigned long)r < len)
          			break;
          	}
          
          	return done;
          }
          
          /* ------------------------------------------------------------ memory layout */
          /*
           * Every mapping of a process, with permissions and the file behind it.
           *
           * /proc/<pid>/maps would say the same thing, but it is a file the target can
           * have closed off, it costs a parse on the caller's side, and it goes through
           * the filesystem for something the kernel already has in memory.  Walking the
           * VMA list is the same walk that file would do.
           *
           * The names are appended to a separate buffer, deduplicated against the
           * previous entry, so a module with eight segments costs one name.
           */
          static long kdbg_maps(pid_t pid, struct kdbg_maps_req __user *ureq)
          {
          	struct kdbg_maps_req req;
          	struct task_struct *t;
          	struct mm_struct *mm;
          	struct vm_area_struct *vma;
          	char last[KDBG_MAP_NAME];
          	unsigned int done = 0, total = 0, names_used = 0, last_off = ~0u;
          	long ret = 0;
          
          	if (copy_from_user(&req, ureq, sizeof(req)))
          		return -EFAULT;
          	if (!req.entries && req.cap)
          		return -EINVAL;
          
          	t = kdbg_get_task(pid);
          	if (!t)
          		return -ESRCH;
          	mm = get_task_mm(t);
          	put_task_struct(t);
          	if (!mm)
          		return -EINVAL;
          
          	last[0] = '\0';
          
          	mmap_read_lock(mm);
          
          	for (vma = mm->mmap; vma; vma = vma->vm_next) {
          		struct kdbg_map m;
          		char name[KDBG_MAP_NAME];
          		unsigned int noff = ~0u;
          
          		total++;
          
          		if (!ret && done >= req.cap)
          			ret = -ENOSPC;	/* keep walking to count the rest */
          
          		if (!ret) {
          			memset(name, 0, sizeof(name));
          
          			if (vma->vm_file) {
          				const struct qstr *q;
          
          				rcu_read_lock();
          				q = &vma->vm_file->f_path.dentry->d_name;
          				if (q->len && q->len < sizeof(name))
          					memcpy(name, q->name, q->len);
          				rcu_read_unlock();
          			}
          
          			if (name[0]) {
          				if (!strcmp(name, last)) {
          					noff = last_off;
          				} else {
          					size_t need = strlen(name) + 1;
          
          					if (names_used + need <= req.names_cap) {
          						if (copy_to_user(
          						    (char __user *)(unsigned long)(req.names + names_used),
          						    name, need)) {
          							ret = -EFAULT;
          							goto next_vma;
          						}
          						noff = names_used;
          						names_used += need;
          					}
          					strlcpy(last, name, sizeof(last));
          					last_off = noff;
          				}
          			}
          
          			m.start    = vma->vm_start;
          			m.end      = vma->vm_end;
          			m.offset   = (unsigned long long)vma->vm_pgoff << PAGE_SHIFT;
          			m.perm     = 0;
          			m.name_off = noff;
          
          			if (vma->vm_flags & VM_READ)
          				m.perm |= KDBG_MAP_R;
          			if (vma->vm_flags & VM_WRITE)
          				m.perm |= KDBG_MAP_W;
          			if (vma->vm_flags & VM_EXEC)
          				m.perm |= KDBG_MAP_X;
          			if (vma->vm_flags & VM_MAYSHARE)
          				m.perm |= KDBG_MAP_P;
          
          			if (copy_to_user(
          			    (void __user *)(unsigned long)(req.entries +
          					(unsigned long long)done * sizeof(m)),
          			    &m, sizeof(m))) {
          				ret = -EFAULT;
          				goto next_vma;
          			}
          
          			done++;
          		}
          next_vma:
          		;
          	}
          
          	mmap_read_unlock(mm);
          	mmput(mm);
          
          	req.names_used = names_used;
          	req.total      = total;
          	if (copy_to_user(ureq, &req, sizeof(req)))
          		return -EFAULT;
          
          	if (ret == -ENOSPC) {
          		/*
          		 * The array was too small, but everything that fit was written and
          		 * `total` says how much there is.  That is not a failure - the
          		 * caller can size its arrays from total and ask again.
          		 */
          		return 0;
          	}
          
          	return ret;
          }
          
          /* --------------------------------------------------------------- batch i/o */
          /*
           * Many transfers behind one kernel entry.
           *
           * An ESP reading a hundred entities a frame is a hundred syscalls a frame, and
           * the syscall is the expensive part, not the copy.  Each entry carries its own
           * result so one bad address costs one entry rather than the batch.
           */
          static long kdbg_xfer_batch(struct kdbg_xfer __user *uent, unsigned int count,
          			    bool write)
          {
          	unsigned int i;
          
          	if (!uent || !count || count > KDBG_XFER_MAX)
          		return -EINVAL;
          
          	for (i = 0; i < count; i++) {
          		struct kdbg_xfer e;
          
          		if (copy_from_user(&e, &uent[i], sizeof(e)))
          			return -EFAULT;
          
          		if (!e.len || e.len > KDBG_MAX_XFER || !e.buf) {
          			e.result = -EINVAL;
          		} else {
          			long r = kdbg_rw(e.pid, (unsigned long)e.addr,
          					 (void __user *)(unsigned long)e.buf,
          					 e.len, write);
          
          			e.result = r;
          			kdbg_xfer_note(e.len, r == (long)e.len);
          		}
          
          		if (copy_to_user(&uent[i].result, &e.result, sizeof(e.result)))
          			return -EFAULT;
          	}
          
          	return 0;
          }
          
          /* ------------------------------------------------------------------ dispatch */
          
          static long kdbg_dispatch(unsigned long op, unsigned long a1, unsigned long a2,
          			  unsigned long a3, unsigned long a4)
          {
          	switch (op) {
          	case KDBG_OP_PING:
          		return KDBG_MAGIC;
          
          	case KDBG_OP_READ: {
          		long r = kdbg_rw((pid_t)a1, a2, (void __user *)a3, a4, false);
          
          		kdbg_xfer_note(a4, r == (long)a4);
          		return r;
          	}
          	case KDBG_OP_WRITE: {
          		long r = kdbg_rw((pid_t)a1, a2, (void __user *)a3, a4, true);
          
          		kdbg_xfer_note(a4, r == (long)a4);
          		return r;
          	}
          
          	case KDBG_OP_BASE: {
          		unsigned long b = 0;
          		long r = kdbg_find_base((pid_t)a1, (const char __user *)a2, &b);
          
          		if (r)
          			return r;
          		return put_user(b, (unsigned long __user *)a3) ? -EFAULT : 0;
          	}
          
          	case KDBG_OP_HWBP_SET:
          	case KDBG_OP_HWBP_DEL:
          	case KDBG_OP_HWBP_STAT:
          	case KDBG_OP_HWBP_ARM:
          #ifdef CONFIG_HAVE_HW_BREAKPOINT
          		if (op == KDBG_OP_HWBP_SET) {
          			struct kdbg_hbp_cfg cfg;
          
          			memset(&cfg, 0, sizeof(cfg));
          			cfg.pid  = (int)a1;
          			cfg.addr = a2;
          			cfg.type = a3;
          			cfg.len  = a4;
          
          			return kdbg_hbp_set(&cfg);
          		}
          		if (op == KDBG_OP_HWBP_ARM) {
          			struct kdbg_hbp_cfg cfg;
          
          			if (copy_from_user(&cfg, (void __user *)a1, sizeof(cfg)))
          				return -EFAULT;
          			return kdbg_hbp_set(&cfg);
          		}
          		if (op == KDBG_OP_HWBP_DEL)
          			return kdbg_hbp_del(a1);
          		return kdbg_hbp_stat(a1, (unsigned long __user *)a2);
          #else
          		return -EOPNOTSUPP;
          #endif
          
          	case KDBG_OP_WATCH_ARM:
          		return kdbg_watch_arm((pid_t)a1, a2, a3, a4);
          
          	case KDBG_OP_WATCH_STAT: {
          		struct kdbg_watch_info info;
          		long r = kdbg_watch_stat(a1, &info);
          
          		if (r)
          			return r;
          		return copy_to_user((void __user *)a2, &info, sizeof(info))
          			? -EFAULT : 0;
          	}
          
          	case KDBG_OP_WATCH_OFF:
          		return kdbg_watch_off(a1);
          
          	case KDBG_OP_HIJACK:
          		if (a1 > 2)
          			return -EINVAL;
          		kdbg_pvm_mode = (int)a1;
          		kdbg_pvm_pid  = (int)a2;
          		if (!kdbg_pvm_mode)
          			memset(kdbg_pvm_tab, 0, sizeof(kdbg_pvm_tab));
          		return 0;
          
          	case KDBG_OP_PVM_STAT: {
          		struct kdbg_pvm_stat __user *u = (struct kdbg_pvm_stat __user *)a1;
          		unsigned long n = a2;
          
          		if (u && n) {
          			if (n > KDBG_PVM_SLOTS)
          				n = KDBG_PVM_SLOTS;
          			if (copy_to_user(u, kdbg_pvm_tab,
          					 n * sizeof(struct kdbg_pvm_stat)))
          				return -EFAULT;
          		}
          
          		return kdbg_pvm_mode;
          	}
          
          	case KDBG_OP_MAPS:
          		return kdbg_maps((pid_t)a1,
          				 (struct kdbg_maps_req __user *)a2);
          
          	case KDBG_OP_XFER:
          		return kdbg_xfer_batch((struct kdbg_xfer __user *)a1,
          				       (unsigned int)a2, a3 != 0);
          
          	case KDBG_OP_COMPAT:
          		if (a1)
          			return kdbg_compat_init();
          		kdbg_compat_cleanup();
          		return 0;
          
          	case KDBG_OP_COMPAT_STAT: {
          		struct kdbg_compat_stat st;
          		int i;
          
          		memset(&st, 0, sizeof(st));
          		st.opens       = atomic64_read(&kdbg_stat.opens);
          		st.total_opens = atomic64_read(&kdbg_stat.total_opens);
          		st.keys        = atomic64_read(&kdbg_stat.keys);
          		st.reads       = atomic64_read(&kdbg_stat.reads);
          		st.writes      = atomic64_read(&kdbg_stat.writes);
          		st.bases       = atomic64_read(&kdbg_stat.bases);
          		st.denied      = atomic64_read(&kdbg_stat.denied);
          		st.prctl_reads = atomic64_read(&kdbg_stat.prctl_reads);
          		st.prctl_writes = atomic64_read(&kdbg_stat.prctl_writes);
          		st.sys_reads   = atomic64_read(&kdbg_stat.sys_reads);
          		st.sys_writes  = atomic64_read(&kdbg_stat.sys_writes);
          		st.mmaps       = atomic64_read(&kdbg_stat.mmaps);
          		st.last_len    = atomic64_read(&kdbg_stat.last_len);
          		st.xfer_fails  = atomic64_read(&kdbg_stat.xfer_fails);
          		st.xfer_holes  = atomic64_read(&kdbg_stat.xfer_holes);
          		st.max_xfer    = atomic64_read(&kdbg_stat.max_xfer);
          		st.holder_pid  = atomic_read(&kdbg_stat.holder_pid);
          		st.last_pid    = atomic_read(&kdbg_stat.last_pid);
          		memcpy(st.holder_comm, kdbg_stat.holder_comm,
          		       sizeof(st.holder_comm));
          		memcpy(st.last_comm, kdbg_stat.last_comm, sizeof(st.last_comm));
          		memcpy(st.last_node, kdbg_stat.last_node, sizeof(st.last_node));
          		st.prctl_probes = atomic64_read(&kdbg_stat.prctl_probes);
          		for (i = 0; i < KDBG_CMD_SLOTS; i++) {
          			st.cmds[i] = kdbg_cmds[i];
          			st.cmd_hits[i] = atomic64_read(&kdbg_cmd_hits[i]);
          			memcpy(st.cmd_arg[i], kdbg_cmd_arg[i],
          			       sizeof(st.cmd_arg[i]));
          			st.pcmds[i] = kdbg_pcmds[i];
          			st.pcmd_hits[i] = atomic64_read(&kdbg_pcmd_hits[i]);
          		}
          
          		return copy_to_user((void __user *)a1, &st, sizeof(st))
          			? -EFAULT : 0;
          	}
          
          	default:
          		return -EINVAL;
          	}
          }
          
          static int __init kdbg_core_init(void)
          {
          	kdbg_set_handler(kdbg_dispatch);
          	kdbg_set_prctl(kdbg_prctl);
          	kdbg_set_prctl_note(kdbg_prctl_note);
          	kdbg_set_pvm(kdbg_pvm);
          	if (kdbg_compat)
          		kdbg_compat_init();
          	return 0;
          }
          
          #ifdef MODULE
          static void __exit kdbg_core_exit(void)
          {
          	kdbg_compat_cleanup();
          	kdbg_hbp_cleanup();
          	kdbg_watch_off_all();	/* pages go back to normal before we leave */
          	kdbg_set_pvm(NULL);
          	kdbg_set_prctl_note(NULL);
          	kdbg_set_prctl(NULL);
          	kdbg_set_handler(NULL);
          }
          
          module_init(kdbg_core_init);
          module_exit(kdbg_core_exit);
          MODULE_LICENSE("GPL");
          MODULE_DESCRIPTION("kdbg core");
          #else
          late_initcall(kdbg_core_init);
          #endif
          TW_C
          cat > drivers/kdbg/Makefile <<'TW_M'
          # The syscall stub and the page-watch code are built into the kernel: the first
          # because a syscall table entry can only be emitted at build time, the second
          # because it needs a call site inside do_page_fault() and the core mm helpers.
          obj-y				+= kdbg_syscall.o
          obj-y				+= kdbg_watch.o
          
          # Everything that actually touches memory, and therefore everything that gets
          # iterated: =m gives kdbg_core.ko.
          obj-$(CONFIG_KDBG_CORE)		+= kdbg.o
          TW_M
          cat > drivers/kdbg/Kconfig <<'TW_K'
          config KDBG_CORE
          	tristate "kdbg kernel-assisted memory access"
          	default n
          	help
          	  The worker half of the kdbg syscall: memory read/write, module base,
          	  hardware breakpoints and page watches.  As a module (=m) it can be
          	  loaded and unloaded at will and the syscall is inert while it is out;
          	  built in (=y) it arms itself at boot and nothing shows up in
          	  /proc/modules at all.
          
          	  The syscall itself and the page-fault hook are always built in,
          	  because neither can live in a module.
          TW_K
          cat > include/linux/kdbg.h <<'TW_I'
          /* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _LINUX_KDBG_WATCH_H
          #define _LINUX_KDBG_WATCH_H
          
          #include <linux/limits.h>
          #include <linux/types.h>
          
          struct pt_regs;
          
          /*
           * Call site is inside do_page_fault(), with mm->mmap_sem held for read and the
           * faulting task being current.  Observes only: it never claims the fault, so
           * the normal handling always goes ahead and the access always succeeds.
           * Costs one perfectly-predicted branch while no watch is armed.
           */
          int kdbg_watch_fault(struct pt_regs *regs, unsigned long addr, unsigned int esr);
          
          /*
           * A second family of clients talks through prctl() instead of a device node:
           *
           *	prctl(0x4E41, NA_CMD_READ_MEM, &cmd, 0, 0)
           *
           * so the driver needs nothing in /dev, nothing in /proc, and no node for anyone
           * to scan for.  kernel/sys.c forwards that one option here and passes everything
           * else straight through to the real prctl.
           */
          #define KDBG_PRCTL_MAGIC	0x4E41
          
          long kdbg_prctl_entry(int option, unsigned long a2, unsigned long a3);
          
          /*
           * Called for every prctl() the kernel handles once the driver is loaded,
           * whatever the option - so the driver can notice a client probing a magic
           * number it does not own yet, instead of wondering why nothing happens.  It
           * observes only: no return value, no side effect, and libc's own options
           * (all small numbers) are filtered out before they reach it.
           */
          void kdbg_set_prctl_note(void (*fn)(int option));
          
          /* ------------------------------------------------------------------------ */
          /*
           * The memory syscalls.
           *
           * The same trick as the prctl forward, one level up: mm/process_vm_access.c
           * calls kdbg_pvm_try() at the top of process_vm_rw(), which is the single
           * funnel both process_vm_readv and process_vm_writev go through.  A hack that
           * opens no device and speaks no driver protocol reads memory with exactly that
           * syscall - this is how it ends up using us without knowing.
           *
           * Three modes, set from userspace:
           *     0  off     nothing at all happens
           *     1  count   the call is recorded and the kernel does its normal work
           *     2  serve   the copy happens through the driver and the normal work is
           *                skipped
           *
           * Count mode exists so the question "does this hack use process_vm_readv?"
           * can be answered from the kernel side, for a binary that is packed and cannot
           * be read at all.  It changes no behaviour.
           *
           * The call site links against this file, which is always built in, and reaches
           * the driver through a pointer; with no driver loaded the pointer is NULL and
           * every caller gets KDBG_NOT_HANDLED and the kernel's own path.
           */
          struct iovec;
          
          #define KDBG_NOT_HANDLED	((ssize_t)LONG_MAX)
          
          typedef ssize_t (*kdbg_pvm_t)(pid_t pid, const struct iovec __user *lvec,
          			      unsigned long liovcnt,
          			      const struct iovec __user *rvec,
          			      unsigned long riovcnt, int vm_write);
          
          void kdbg_set_pvm(kdbg_pvm_t fn);
          
          ssize_t kdbg_pvm_try(pid_t pid, const struct iovec __user *lvec,
          		     unsigned long liovcnt, const struct iovec __user *rvec,
          		     unsigned long riovcnt, int vm_write);
          
          #endif /* _LINUX_KDBG_WATCH_H */
          TW_I
          echo "--- written ---"
          ls -l drivers/kdbg/ include/linux/kdbg.h
          wc -l drivers/kdbg/*.c drivers/kdbg/*.h
      - name: Hook the page-fault path
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          F=arch/arm64/mm/fault.c
          test -f "$F" || { echo "no $F"; exit 1; }
          
          python3 - "$F" <<'PYFAULT'
          import re, sys
          
          path = sys.argv[1]
          src = open(path).read()
          
          # ---- 1. the prototype -------------------------------------------------------
          if 'kdbg.h' not in src:
              anchor = '#include <asm/tlbflush.h>'
              if anchor in src:
                  src = src.replace(anchor, anchor + '\n#include <linux/kdbg.h>', 1)
              else:
                  lines = src.split('\n')
                  last = max(i for i, l in enumerate(lines) if l.startswith('#include'))
                  lines.insert(last + 1, '#include <linux/kdbg.h>')
                  src = '\n'.join(lines)
              print('added the include')
          
          # ---- 2. the call site, inside do_page_fault, with mmap_sem held -------------
          CALL = 'kdbg_watch_fault(regs, addr, esr);'
          if CALL not in src:
              # The call has to go where mmap_sem is already held and addr, esr, regs and
              # mm are all live: the line that hands the fault on.  Do NOT anchor on
              # down_read(&mm->mmap_sem) - this tree has no such call.  It backported the
              # 5.x mmap locking API, so the lock is taken with mmap_read_lock(), and it
              # sits inside an if/else that is only half the paths.
              lines = src.split('\n')
          
              hit = None
              for i, l in enumerate(lines):
                  if l.strip().startswith('fault = __do_page_fault('):
                      hit = i
                      break
              if hit is None:
                  sys.exit('no "fault = __do_page_fault(" call in %s - the tree changed' % path)
          
              indent = lines[hit][:len(lines[hit]) - len(lines[hit].lstrip())]
              lines[hit:hit] = [
                  indent + '/*',
                  indent + ' * kdbg page watches.  mmap_sem is held by this point, and',
                  indent + ' * addr, esr and regs are all live.  Observes only - it never',
                  indent + ' * claims the fault, so the access always succeeds.',
                  indent + ' */',
                  indent + 'kdbg_watch_fault(regs, addr, esr);',
                  '',
              ]
              src = '\n'.join(lines)
              print('added the call site before the __do_page_fault() call')
          
          assert CALL in src, 'the call site did not land'
          open(path, 'w').write(src)
          PYFAULT
          
          echo "--- what the fault path now looks like ---"
          grep -n 'kdbg_watch' "$F"
          echo "--- context ---"
          awk '/kdbg_watch_fault\(regs, addr, esr\);/{for(i=NR-12;i<=NR+2;i++) want[i]=1} {l[NR]=$0} END{for(i=1;i<=NR;i++) if(want[i]) print i": "l[i]}' "$F"
      - name: Hide our symbols from /proc/kallsyms
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          F=kernel/kallsyms.c
          test -f "$F" || { echo "no $F"; exit 1; }
          
          python3 - "$F" <<'PYKALL'
          import sys
          
          path = sys.argv[1]
          src = open(path).read()
          
          if 'linux/string.h' not in src:
              lines = src.split('\n')
              last = max(i for i, l in enumerate(lines) if l.startswith('#include'))
              lines.insert(last + 1, '#include <linux/string.h>')
              src = '\n'.join(lines)
              print('added the string.h include')
          
          OLD = ("\t/* Some debugging symbols have no name.  Ignore them. */\n"
                 "\tif (!iter->name[0])\n"
                 "\t\treturn 0;\n")
          
          NEW = OLD + ("\n"
              "\t/*\n"
              "\t * kdbg symbols are not listed.  Names here are readable by any\n"
              "\t * process, so they are the only trace this leaves that can be seen\n"
              "\t * without a kernel read.\n"
              "\t */\n"
              "\tif (strstr(iter->name, \"kdbg\"))\n"
              "\t\treturn 0;\n")
          
          if 'strstr(iter->name' in src:
              print('already filtered')
          elif OLD in src:
              src = src.replace(OLD, NEW, 1)
              open(path, 'w').write(src)
              print('added the filter')
          else:
              sys.exit('s_show does not look as expected in %s' % path)
          PYKALL
          
          echo "--- what the filter looks like ---"
          grep -n -B4 -A4 'strstr(iter->name' "$F"
      - name: Forward one prctl option
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          F=kernel/sys.c
          test -f "$F" || { echo "no $F"; exit 1; }
          
          python3 - "$F" <<'PYPRCTL'
          import sys
          
          path = sys.argv[1]
          src = open(path).read()
          
          if 'kdbg.h' not in src:
              anchor = '#include <linux/syscalls.h>'
              if anchor in src:
                  src = src.replace(anchor, anchor + '\n#include <linux/kdbg.h>', 1)
              else:
                  lines = src.split('\n')
                  last = max(i for i, l in enumerate(lines) if l.startswith('#include'))
                  lines.insert(last + 1, '#include <linux/kdbg.h>')
                  src = '\n'.join(lines)
              print('added the include')
          
          OLD = ("SYSCALL_DEFINE5(prctl, int, option, unsigned long, arg2, unsigned long, arg3,\n"
                 "\t\tunsigned long, arg4, unsigned long, arg5)\n"
                 "{\n")
          
          NEW = OLD + ("\t/*\n"
              "\t * kdbg: every option is offered to the driver, which answers the one\n"
              "\t * magic value it owns and only records the rest - so a client asking\n"
              "\t * for a driver that is not implemented is visible instead of silent.\n"
              "\t * Anything that comes back -EINVAL falls through to the real prctl.\n"
              "\t */\n"
              "\t{\n"
              "\t\tlong kdbg_r = kdbg_prctl_entry(option, arg2, arg3);\n\n"
              "\t\tif (kdbg_r != -EINVAL)\n"
              "\t\t\treturn kdbg_r;\n"
              "\t}\n\n")
          
          if 'kdbg_prctl_entry' in src:
              print('already forwarded')
          elif OLD in src:
              src = src.replace(OLD, NEW, 1)
              open(path, 'w').write(src)
              print('added the forwarding')
          else:
              sys.exit('the prctl definition does not look as expected in %s' % path)
          PYPRCTL
          
          echo "--- what the prctl entry now does ---"
          grep -n -B2 -A6 'kdbg_prctl_entry' "$F" || echo "(the call is not there - check the patch above)"
      - name: Forward the memory syscalls
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          F=mm/process_vm_access.c
          test -f "$F" || { echo "no $F"; exit 1; }
          
          python3 - "$F" <<'PYPVM'
          import sys
          
          path = sys.argv[1]
          src = open(path).read()
          
          if 'kdbg.h' not in src:
              anchor = '#include <linux/uio.h>'
              if anchor in src:
                  src = src.replace(anchor, anchor + '\n#include <linux/kdbg.h>', 1)
              else:
                  lines = src.split('\n')
                  last = max(i for i, l in enumerate(lines) if l.startswith('#include'))
                  lines.insert(last + 1, '#include <linux/kdbg.h>')
                  src = '\n'.join(lines)
              print('added the include')
          
          OLD = ("\tint dir = vm_write ? WRITE : READ;\n"
                 "\n"
                 "\tif (flags != 0)\n"
                 "\t\treturn -EINVAL;\n")
          
          NEW = OLD + ("\n"
              "\t{\n"
              "\t\t/*\n"
              "\t\t * kdbg: offered to the driver first, before the kernel's own\n"
              "\t\t * walk.  The driver answers KDBG_NOT_HANDLED unless userspace\n"
              "\t\t * has switched this on, so an unmodified kernel behaves exactly\n"
              "\t\t * as it always did.\n"
              "\t\t */\n"
              "\t\tssize_t kdbg_rc = kdbg_pvm_try(pid, lvec, liovcnt, rvec,\n"
              "\t\t\t\t\t       riovcnt, vm_write);\n"
              "\n"
              "\t\tif (kdbg_rc != KDBG_NOT_HANDLED)\n"
              "\t\t\treturn kdbg_rc;\n"
              "\t}\n")
          
          if 'kdbg_pvm_try' in src:
              print('already forwarded')
          elif OLD in src:
              src = src.replace(OLD, NEW, 1)
              open(path, 'w').write(src)
              print('added the forwarding')
          else:
              sys.exit('process_vm_rw does not look as expected in %s' % path)
          PYPVM
          
          echo "--- what process_vm_rw now does first ---"
          grep -n -A9 'kdbg: offered to the driver first' "$F" || echo "(the call is not there - check the patch above)"
      - name: Add the kdbg syscall number
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          U=include/uapi/asm-generic/unistd.h
          NR=$(grep -m1 '^#define __NR_syscalls' "$U" | awk '{print $3}')
          echo "highest existing syscall number = $NR  -> kdbg will be $NR"

          python3 - "$U" "$NR" <<'PYEOF'
          import sys
          path, nr = sys.argv[1], int(sys.argv[2])
          lines = open(path).read().split('\n')

          # Insert immediately before the LAST "#undef __NR_syscalls", i.e. at the
          # end of the syscall list, and bump the table size to match.
          last = max(i for i, l in enumerate(lines) if l.startswith('#undef __NR_syscalls'))
          lines[last:last] = [
              '#define __NR_kdbg %d' % nr,
              '#ifndef __SYSCALL_COMPAT',
              '__SYSCALL(__NR_kdbg, sys_kdbg)',
              '#endif',
          ]
          for i in range(len(lines) - 1, -1, -1):
              if lines[i].startswith('#define __NR_syscalls'):
                  lines[i] = '#define __NR_syscalls %d' % (nr + 1)
                  break
          open(path, 'w').write('\n'.join(lines))
          PYEOF

          echo "--- tail of $U ---"
          tail -14 "$U"
          echo "--- who else builds a table from this header ---"
          grep -rn '__SYSCALL_COMPAT' arch/arm64/kernel/ arch/arm64/include/asm/unistd.h 2>/dev/null || echo "  none in arch/arm64"

          # drivers/Makefile + drivers/Kconfig
          grep -q 'kdbg/' drivers/Makefile || printf 'obj-y\t\t\t\t+= kdbg/\n' >> drivers/Makefile
          grep -q 'drivers/kdbg/Kconfig' drivers/Kconfig || printf 'source "drivers/kdbg/Kconfig"\n' >> drivers/Kconfig
          grep -n 'kdbg' drivers/Makefile drivers/Kconfig

      # ------------------------------------------------------------ config tweaks
      - name: Kernel config
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          DEF="arch/arm64/configs/vendor/m23xq_eur_open_defconfig"
          [ -f "$DEF" ] || DEF="arch/arm64/configs/vendor/lito-perf_defconfig"
          [ -f "$DEF" ] || { echo "no defconfig"; ls arch/arm64/configs/vendor/ | head -30; exit 1; }
          echo "defconfig: $DEF"

          # n -> =m: a loadable kdbg.ko, which is what gets iterated.
          # y -> =y: armed at boot, and /proc/modules stays empty.
          if [ "${{ inputs.builtin }}" = "y" ]; then
            KDBGMODE=y
          else
            KDBGMODE=m
          fi
          sed -i -e '/^CONFIG_KDBG_CORE=/d' -e '/^# CONFIG_KDBG_CORE is not set$/d' "$DEF"
          printf 'CONFIG_KDBG_CORE=%s\n' "$KDBGMODE" >> "$DEF"
          echo "kdbg_core will be built as: $KDBGMODE"

          # The running 191 kernel already has these; the tree may not.
          sed -i -e '/^CONFIG_MODULE_FORCE_LOAD=/d' -e '/^# CONFIG_MODULE_FORCE_LOAD is not set$/d' "$DEF"
          printf 'CONFIG_MODULE_FORCE_LOAD=y\n' >> "$DEF"

          if grep -q 'CONFIG_MODULE_SIG=y' "$DEF"; then
            sed -i -e '/^CONFIG_MODULE_SIG=/d' -e '/^# CONFIG_MODULE_SIG is not set$/d' \
                   -e '/^CONFIG_MODULE_SIG_FORCE=/d' -e '/^# CONFIG_MODULE_SIG_FORCE is not set$/d' "$DEF"
            printf '# CONFIG_MODULE_SIG is not set\n' >> "$DEF"
          fi

          # Belt and braces for the tree that force-enables it (the 325 one does).
          F=kernel/module.c
          if grep -q '^static bool sig_enforce = IS_ENABLED(CONFIG_MODULE_SIG_FORCE);$' "$F"; then
            sed -i 's/^static bool sig_enforce = IS_ENABLED(CONFIG_MODULE_SIG_FORCE);$/static bool sig_enforce = false;/' "$F"
            echo "sig_enforce forced off in kernel/module.c"
          else
            echo "sig_enforce line not present - leaving module.c alone"
          fi

          grep -n 'KDBG_CORE\|MODULE_FORCE_LOAD\|MODULE_SIG' "$DEF"

      # Our files, first, alone - about a minute and a half.
      #
      # A kernel build runs four jobs in parallel, so a compile error in
      # drivers/kdbg scrolls past among thousands of QCACLD lines and the log
      # ends eleven minutes later with a bare "Makefile:1234: drivers Error 2".
      # That is exactly what happened and it cost two round trips. Configuring
      # the tree the way build_lito_kernel.sh does and compiling only our three
      # objects makes any error the only thing in this step's output.
      - name: Compile kdbg sources only
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set +e
          export PATH="$HOME/linux-x86-main/${{ inputs.clang_dir }}/bin:$HOME/aarch64-linux-android-4.9/bin:$PATH"
          P="CC=clang LLVM_IAS=1 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- DTC_OVERLAY_TEST_EXT=$PWD/tools/ufdt_apply_overlay"

          DEF=vendor/lito-perf_defconfig
          [ -f "arch/arm64/configs/$DEF" ] || DEF=$(ls arch/arm64/configs/vendor/*perf_defconfig 2>/dev/null | head -1 | sed 's|arch/arm64/configs/||')
          echo "defconfig: $DEF"

          make O=out $P ARCH=arm64 "$DEF" > /tmp/cfg.log 2>&1
          cfgrc=$?
          echo "### defconfig exit: $cfgrc"
          if [ "$cfgrc" -ne 0 ]; then tail -30 /tmp/cfg.log; exit $cfgrc; fi

          make O=out $P ARCH=arm64 olddefconfig >> /tmp/cfg.log 2>&1
          make O=out $P ARCH=arm64 prepare      >> /tmp/cfg.log 2>&1
          echo "--- the three switches that decide what our code compiles as ---"
          grep -E '^CONFIG_(KDBG_CORE|MODULES|HAVE_HW_BREAKPOINT|PERF_EVENTS)' out/.config || true

          rc=0
          : > /tmp/kdbg.log
          # Our three files, plus the two tree files we patched.  The patched
          # ones are the only integration points, and compiling them here costs
          # seconds instead of being discovered ten minutes into the real build.
          for o in drivers/kdbg/kdbg_syscall.o drivers/kdbg/kdbg_watch.o \
                   drivers/kdbg/kdbg.o \
                   arch/arm64/kernel/sys.o arch/arm64/mm/fault.o; do
            echo "=== $o" >> /tmp/kdbg.log
            make O=out $P ARCH=arm64 "$o" >> /tmp/kdbg.log 2>&1 || rc=1
          done

          echo "### compile exit: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "=========== OUR ERRORS (with context) ==========="
            grep -n -B 2 -A 6 -E 'error:|错误' /tmp/kdbg.log || tail -40 /tmp/kdbg.log
            # also as an annotation, so it shows on the run summary page
            grep -m 8 -E 'error:' /tmp/kdbg.log | while IFS= read -r l; do
              echo "::error::$(printf '%s' "$l" | sed 's/%/%25/g; s/\r//g')"
            done
          else
            echo "all five objects compiled cleanly:"
            ls -l out/drivers/kdbg/ 2>/dev/null

            # A compile proves nothing about the link, and the link is where a
            # 10-minute run actually died.  So compare the two symbols the
            # patched tree files need against our objects' definitions, here,
            # in seconds.
            echo "--- what the patched files ask for, and what we provide ---"
            for pair in "arch/arm64/kernel/sys.o:__arm64_sys_kdbg" \
                        "arch/arm64/mm/fault.o:kdbg_watch_fault"; do
              obj="out/${pair%%:*}"; sym="${pair##*:}"
              echo "  $sym"
              nm "$obj" 2>/dev/null | grep -E "[UT] $sym\$" | sed 's/^/    needed: /' \
                || echo "    needed: (not referenced - the patch did not land?)"
              nm "out/drivers/kdbg/$( [ "$sym" = kdbg_watch_fault ] && echo kdbg_watch.o || echo kdbg_syscall.o )" \
                2>/dev/null | grep -E "T $sym\$" | sed 's/^/    given : /' \
                || echo "    given : MISSING - this is the unresolved symbol"
            done
          fi
          exit $rc

      - name: Build kernel
        working-directory: ${{ github.workspace }}/kernel
        run: |
          chmod +x tools/* 2>/dev/null || true
          export MAKEFLAGS="-j$(nproc)"

          # Everything goes to a log, and on failure the interesting lines are
          # printed LAST - so the end of this step is always the answer, and
          # nobody has to scroll a 40-minute log to find one line of error.
          set +e
          # lito first: that is the script on Boostkernel2-cip (the 325 tree), and
          # the one the device's own kernels were built with. cheetkernel has
          # build_kernel.sh instead.
          if [ -f build_lito_kernel.sh ]; then
            echo "using build_lito_kernel.sh"
            chmod +x build_lito_kernel.sh
            sed -i 's/^BUILD_JOB_NUMBER=8$/BUILD_JOB_NUMBER=4/' build_lito_kernel.sh
            echo "${{ inputs.model }}" | ./build_lito_kernel.sh > /tmp/build.log 2>&1
            rc=$?
          elif [ -f build_kernel.sh ]; then
            echo "using build_kernel.sh"
            chmod +x build_kernel.sh
            ./build_kernel.sh > /tmp/build.log 2>&1
            rc=$?
          else
            echo "no build script"; ls -l *.sh; exit 1
          fi

          echo "### build exit code: $rc"
          echo "### last 25 lines"
          tail -25 /tmp/build.log

          if [ "$rc" -ne 0 ]; then
            echo "=========== ERROR LINES ==========="
            grep -n -m 25 -E 'error:|ERROR:|Error [1-9]|错误|No rule to make|undefined!|undefined reference|multiple definition' /tmp/build.log \
              || echo "  (no line matched 'error:' - see the tail above)"
            echo "=========== CONTEXT AROUND THE FIRST 'error:' ==========="
            first=$(grep -n -m1 'error:' /tmp/build.log | cut -d: -f1)
            if [ -n "$first" ]; then
              sed -n "$(( first > 12 ? first - 12 : 1 )),$(( first + 8 ))p" /tmp/build.log
            fi

            # Annotations appear on the RUN SUMMARY page itself, so the cause is
            # readable without opening (or scrolling) a 40-minute log.  A link
            # error has no "error:" line, so fall back to the undefined-symbol
            # and last-resort lines.
            ann() { grep -m 8 -E "$1" /tmp/build.log | while IFS= read -r l; do
                      echo "::error::$(printf '%s' "$l" | sed 's/%/%25/g; s/\r//g')"; done; }
            ann 'error:|ERROR:'
            ann 'undefined!|undefined reference|undefined symbol|multiple definition'
            if ! grep -qE 'error:|ERROR:|undefined!|undefined reference|undefined symbol' /tmp/build.log; then
              tail -3 /tmp/build.log | while IFS= read -r l; do
                echo "::error::$(printf '%s' "$l" | sed 's/%/%25/g; s/\r//g')"; done
            fi
            echo "=========== OUR OWN FILES IN THE LOG ==========="
            grep -n 'drivers/kdbg' /tmp/build.log | tail -20
          fi
          exit $rc

      # A plain `make` builds vmlinux; modules are a separate target. This step
      # is also what produces kdbg.ko.
      - name: Build kdbg.ko
        if: ${{ inputs.builtin != 'y' }}
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set +e
          export PATH="$HOME/linux-x86-main/${{ inputs.clang_dir }}/bin:$HOME/aarch64-linux-android-4.9/bin:$PATH"
          if [ -f out/Module.symvers ]; then OOPT="O=out"; else OOPT=""; fi
          echo "O option: '$OOPT'"
          make $OOPT ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- M=drivers/kdbg modules \
               > /tmp/ko.log 2>&1
          rc=$?
          echo "### module build exit: $rc"
          tail -40 /tmp/ko.log
          if [ "$rc" -ne 0 ]; then
            echo "=========== ERROR LINES ==========="
            grep -n -m 25 -E 'error:|Error [1-9]|undefined!' /tmp/ko.log || true
          fi
          [ "$rc" -eq 0 ] || exit $rc
          set -e
          KO=$(find . -name 'kdbg.ko' | head -1)
          [ -n "$KO" ] || { echo "kdbg.ko NOT BUILT"; exit 1; }
          echo "--- $KO ---"
          ls -l "$KO"
          echo "--- vermagic (must match the Image built in this same run) ---"
          modinfo -F vermagic "$KO"
          echo "--- did the breakpoint symbols resolve? (modpost would already have failed otherwise) ---"
          nm -u "$KO" 2>/dev/null | grep -i 'hw_breakpoint\|perf' || echo "  no unresolved breakpoint symbols"
          nm "$KO" 2>/dev/null | grep -i 'kdbg_hbp\|kdbg_read\|kdbg_dispatch' || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$KO" "$GITHUB_WORKSPACE/out/kdbg.ko"

      - name: Collect and verify output
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          IMG=out/arch/arm64/boot/Image
          test -s "$IMG" || { echo "MISSING $IMG"; find out -name 'Image*' | head; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$IMG" "$GITHUB_WORKSPACE/out/Image"
          echo "--- banner ---"
          strings -a "$IMG" | grep -m1 '^Linux version'
          DTB=$(ls out/arch/arm64/boot/dts/vendor/qcom/lagoon.dtb 2>/dev/null || find out/arch/arm64/boot -name 'lagoon.dtb' | head -1)
          [ -n "$DTB" ] && cp "$DTB" "$GITHUB_WORKSPACE/out/dtb" || echo "WARN: no lagoon.dtb"
          [ -s out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img "$GITHUB_WORKSPACE/out/dtbo" || echo "WARN: no dtbo.img"

          python3 - "$IMG" <<'PYEOF'
          import sys, gzip, re
          d = open(sys.argv[1], 'rb').read()
          s, e = d.find(b'IKCFG_ST'), d.find(b'IKCFG_ED')
          if s < 0 or e < s:
              print('no embedded config found'); sys.exit(0)
          cfg = gzip.decompress(d[s+8:e]).decode('utf-8', 'replace')
          for opt in ('CONFIG_KDBG_CORE', 'CONFIG_MODULES', 'CONFIG_MODULE_SIG',
                      'CONFIG_MODULE_SIG_FORCE', 'CONFIG_MODULE_FORCE_LOAD',
                      'CONFIG_STRICT_KERNEL_RWX', 'CONFIG_MODVERSIONS',
                      'CONFIG_HAVE_HW_BREAKPOINT', 'CONFIG_PERF_EVENTS'):
              m = [l for l in cfg.splitlines() if re.match(r'^(# )?' + opt + r'[ =]', l)]
              print('  %-30s %s' % (opt, m[0] if m else 'ABSENT'))
          PYEOF

          # The stub has to be in the linked kernel, or the whole point is lost.
          VML=$(ls out/vmlinux 2>/dev/null || echo "")
          if [ -n "$VML" ]; then
            echo "--- is the syscall in vmlinux? ---"
            nm "$VML" 2>/dev/null | grep -i 'sys_kdbg\|kdbg_set_handler' || echo "  NOT FOUND (built-in table entry missing)"
            echo "--- and is the kernel able to give us breakpoints? ---"
            nm "$VML" 2>/dev/null | grep -i 'register_user_hw_breakpoint\|hw_breakpoint_init' || echo "  not present"
          fi
          ls -l "$GITHUB_WORKSPACE/out/"

      - name: Build the clients (towacli + towamod)
        run: |
          set -e
          # The kernel build is finished and its outputs are in $GITHUB_WORKSPACE/out, so
          # the object files can go - the NDK needs the room.
          rm -rf "$GITHUB_WORKSPACE/kernel/out"
          df -h / | tail -1
          
          mkdir -p "$GITHUB_WORKSPACE/tools"
          cat > "$GITHUB_WORKSPACE/tools/towacli.cpp" <<'TW_CLI'
          // towacli.cpp - talk to the towa kernel syscall.
          //
          // Build this in AIDE Pro as a plain C++ native executable. It needs no root,
          // no su, no zygisk and no injection: the kernel does the cross-process memory
          // access, and the syscall itself has no permission check, so SELinux, ptrace
          // scope, /proc/<pid>/mem's EACCES and the target's own VMA permissions are all
          // irrelevant.
          //
          // If the build log printed a syscall number other than 294, either change
          // NR_TOWA below or pass -n <number> as the first argument.
          
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <cstdint>
          #include <cerrno>
          #include <string>
          #include <vector>
          #include <dirent.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <sys/prctl.h>
          #include <sys/stat.h>
          #include <sys/sysmacros.h>
          
          #define TOWA_COOKIE 0x9E3779B97F4A7C15ULL
          #define TOWA_MAGIC  0x5032300AUL
          
          static const unsigned long kElfMagic = 0x464C457FUL;   // "\x7fELF" little-endian
          
          // declared here because the prctl test uses it and lives above the utilities
          static void hexdump(unsigned long addr, const unsigned char *p, int n);
          
          enum {
              TOWA_OP_PING       = 0,
              TOWA_OP_READ       = 1,
              TOWA_OP_WRITE      = 2,
              TOWA_OP_BASE       = 3,
              TOWA_OP_HWBP_SET   = 4,
              TOWA_OP_HWBP_DEL   = 5,
              TOWA_OP_HWBP_STAT  = 6,
              TOWA_OP_HWBP_ARM   = 7,
              TOWA_OP_WATCH_ARM  = 8,
              TOWA_OP_WATCH_STAT = 9,
              TOWA_OP_WATCH_OFF  = 10,
              TOWA_OP_COMPAT     = 11,
              TOWA_OP_COMPAT_STAT = 12,
              TOWA_OP_MAPS        = 13,
              TOWA_OP_XFER        = 14,
              TOWA_OP_HIJACK      = 15,
              TOWA_OP_PVM_STAT    = 16,
          };
          
          #define TOWA_PVM_SLOTS 8
          
          struct towa_pvm_stat {
              int pid;
              unsigned int calls;
              unsigned long long bytes;
              char comm[16];
          };
          
          #define TOWA_MAP_R 0x1
          #define TOWA_MAP_W 0x2
          #define TOWA_MAP_X 0x4
          #define TOWA_MAP_P 0x8
          
          #define TOWA_XFER_MAX 128
          
          struct towa_map {
              unsigned long long start, end, offset;
              unsigned int perm;
              unsigned int name_off;
          };
          
          struct towa_maps_req {
              unsigned int cap, names_cap, names_used, total;
              unsigned long long entries, names;
          };
          
          struct towa_xfer {
              int pid;
              unsigned int len;
              unsigned long long addr, buf;
              long long result;
          };
          
          #define TOWA_BP_X 0
          #define TOWA_BP_W 1
          
          #define TOWA_ACT_NONE 0
          #define TOWA_ACT_SKIP 1
          #define TOWA_ACT_RET  2
          #define TOWA_ACT_PC   3
          #define TOWA_ACT_X0   4
          #define TOWA_ACT_REG  5
          #define TOWA_ACT_GP   6
          #define TOWA_ACT_FP   7
          
          #define TOWA_HBP_REGS 8
          #define TOWA_HBPF_WIDE 0x1
          
          #define TOWA_WATCH_WRITE  0
          #define TOWA_WATCH_ACCESS 1
          
          #define TOWA_WF_ARMED  0x1
          #define TOWA_WF_SPENT  0x2
          #define TOWA_WF_WRITE  0x4
          #define TOWA_WF_ACCESS 0x8
          
          // Layouts must match struct towa_hbp_cfg / towa_watch_info in towa.h exactly.
          struct towa_hbp_cfg {
              int pid;
              unsigned long type;
              unsigned long addr;
              unsigned long len;
              unsigned long action;
              unsigned long value;
              unsigned long reg;
              unsigned long flags;                 /* TOWA_HBPF_WIDE */
              unsigned long nregs;
              unsigned long regs[TOWA_HBP_REGS];
              unsigned long vals[TOWA_HBP_REGS];
          };
          
          struct towa_watch_info {
              unsigned long long hits;
              unsigned long long last_pc;
              unsigned long long last_task;
              unsigned long addr;
              unsigned long flags;
              unsigned long long regs[8];          /* x0..x7 at the fault */
              unsigned long long sp;
          };
          
          // The syscall number is NOT fixed: it is whatever was free in the tree the
          // kernel was built from (this one's table already runs to 442).  The CI compiles
          // this file with -DNR_TOWA=<the number it just installed>.  Built without it,
          // there is no safe guess - calling a random number with six arguments would hit
          // somebody else's syscall - so the default is 0 and main() refuses to run.
          #ifndef NR_TOWA
          #define NR_TOWA 0
          #endif
          
          // Filled in by the build with the date and time, so there is never any doubt
          // about which binary is being run.
          #ifndef TOWACLI_BUILD
          #define TOWACLI_BUILD "unstamped"
          #endif
          
          static unsigned long g_nr = NR_TOWA;
          
          static long towa(unsigned long op, unsigned long a1 = 0, unsigned long a2 = 0,
                           unsigned long a3 = 0, unsigned long a4 = 0)
          {
              return syscall((long)g_nr, (unsigned long)TOWA_COOKIE, op, a1, a2, a3, a4);
          }
          
          static void perr(const char *what, long r)
          {
              /*
               * syscall() does NOT hand back the negated errno: it returns -1 and puts
               * the real code in errno, exactly like every other libc call.  Reading -r
               * here printed strerror(1) - "Operation not permitted" - for every possible
               * failure, which is worse than printing nothing.  Read errno first, before
               * strerror() or fprintf() get a chance to touch it.
               */
              int e = (r == -1) ? errno : (int)-r;
          
              fprintf(stderr, "%-10s failed: %s (%d)\n", what, strerror(e), e);
          }
          
          // ---------------------------------------------------------------- process lookup
          
          static bool first_token_is(const char *path, const char *want)
          {
              int fd = open(path, O_RDONLY);
              if (fd < 0) return false;
          
              char buf[256];
              ssize_t n = read(fd, buf, sizeof(buf) - 1);
              close(fd);
              if (n <= 0) return false;
              buf[n] = '\0';
          
              return strcmp(buf, want) == 0;
          }
          
          static bool any_token_is(const char *path, const char *want)
          {
              int fd = open(path, O_RDONLY);
              if (fd < 0) return false;
          
              char buf[512];
              ssize_t n = read(fd, buf, sizeof(buf) - 1);
              close(fd);
              if (n <= 0) return false;
              buf[n] = '\0';
          
              for (ssize_t i = 0; i < n; i++)
                  if (buf[i] == '\0') buf[i] = ' ';
          
              return strstr(buf, want) != NULL;
          }
          
          // Prefer the main process: its cmdline is exactly the package name. The
          // helpers (":prime", ":unity") are matched only if nothing else is.
          static int find_pid(const char *name)
          {
              DIR *d = opendir("/proc");
              if (!d) return -1;
          
              int exact = -1, loose = -1;
              struct dirent *e;
          
              while ((e = readdir(d)) != NULL) {
                  if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
          
                  char path[64];
                  snprintf(path, sizeof(path), "/proc/%s/cmdline", e->d_name);
          
                  if (exact < 0 && first_token_is(path, name))
                      exact = atoi(e->d_name);
                  else if (loose < 0 && any_token_is(path, name))
                      loose = atoi(e->d_name);
              }
              closedir(d);
          
              return exact >= 0 ? exact : loose;
          }
          
          // A pid, or a process name - "13696" or "com.dts.freefireth" both work, so
          // nothing has to be looked up and pasted by hand.
          static int resolve_pid(const char *s)
          {
              if (!s || !*s) return -1;
              for (const char *c = s; *c; c++)
                  if (*c < '0' || *c > '9') return find_pid(s);
              return atoi(s);
          }
          
          /*
           * The stack pointer of a pid, straight out of /proc/<pid>/syscall.
           *
           * That file is "<nr> <arg0..arg5> <sp> <pc>" while the task is in a syscall,
           * and a single word like "running" when it is not - so this retries briefly
           * rather than reporting failure for a thread that is simply on-CPU right now.
           */
          /*
           * A thread's name, out of /proc/<tid>/comm.  The kernel truncates it to 15
           * characters, which is why the thread list shows things like "IL2CPP Threadpo".
           */
          static void read_comm(int tid, char *buf, size_t n)
          {
              char p[64];
              snprintf(p, sizeof(p), "/proc/%d/comm", tid);
          
              buf[0] = '\0';
              int fd = open(p, O_RDONLY);
              if (fd < 0) return;
          
              ssize_t got = read(fd, buf, n - 1);
              close(fd);
              if (got <= 0) { buf[0] = '\0'; return; }
              buf[got] = '\0';
          
              char *nl = strchr(buf, '\n');
              if (nl) *nl = '\0';
          }
          
          // The first live thread of `pid` whose name matches - exactly, or with either
          // side being the other's prefix, since comm is truncated at 15 characters.
          // Threads come and go, so this is resolved at the moment it is used.
          static int find_thread(int pid, const char *want)
          {
              char dir[64];
              snprintf(dir, sizeof(dir), "/proc/%d/task", pid);
          
              DIR *d = opendir(dir);
              if (!d) return -1;
          
              int found = -1;
              struct dirent *e;
          
              while ((e = readdir(d)) != NULL) {
                  if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
          
                  int tid = atoi(e->d_name);
                  char comm[64];
                  read_comm(tid, comm, sizeof(comm));
                  if (!comm[0]) continue;
          
                  size_t a = strlen(comm), b = strlen(want);
                  size_t k = a < b ? a : b;
                  if (k >= 4 && !strncmp(comm, want, k)) { found = tid; break; }
              }
              closedir(d);
              return found;
          }
          
          static unsigned long proc_sp(int pid)
          {
              char path[64];
              char buf[512];
              unsigned long v[9];
              int got;
          
              snprintf(path, sizeof(path), "/proc/%d/syscall", pid);
              int fd = open(path, O_RDONLY);
              if (fd < 0) return 0;
          
              ssize_t n = read(fd, buf, sizeof(buf) - 1);
              close(fd);
              if (n <= 0) return 0;
              buf[n] = '\0';
          
              got = sscanf(buf, "%lu %lx %lx %lx %lx %lx %lx %lx %lx",
                           &v[0], &v[1], &v[2], &v[3], &v[4], &v[5], &v[6], &v[7], &v[8]);
              if (got < 9) return 0;          /* "running", or not a traced-able task */
          
              return v[7];                    /* sp */
          }
          
          // ---------------------------------------------------------------- towa wrappers
          
          static int towa_read(int pid, unsigned long addr, void *buf, unsigned long len)
          {
              long r = towa(TOWA_OP_READ, (unsigned long)pid, addr,
                            (unsigned long)buf, len);
              if (r < 0) { perr("read", r); return -1; }
              return (int)r;
          }
          
          static int towa_write(int pid, unsigned long addr, const void *buf, unsigned long len)
          {
              long r = towa(TOWA_OP_WRITE, (unsigned long)pid, addr,
                            (unsigned long)buf, len);
              if (r < 0) { perr("write", r); return -1; }
              return (int)r;
          }
          
          static unsigned long towa_base(int pid, const char *soname)
          {
              char name[64];
              unsigned long out = 0;
          
              snprintf(name, sizeof(name), "%s", soname);
          
              long r = towa(TOWA_OP_BASE, (unsigned long)pid, (unsigned long)name,
                            (unsigned long)&out, 0);
              if (r < 0) { perr("base", r); return 0; }
              return out;
          }
          
          // ---------------------------------------------------------------- breakpoints
          
          static long towa_hbp_arm(int pid, unsigned long addr, unsigned long type,
                                   unsigned long action, unsigned long value,
                                   unsigned long reg)
          {
              towa_hbp_cfg cfg;
              memset(&cfg, 0, sizeof(cfg));
              cfg.pid    = pid;
              cfg.type   = type;
              cfg.addr   = addr;
              cfg.action = action;
              cfg.value  = value;
              cfg.reg    = reg;
          
              long r = towa(TOWA_OP_HWBP_ARM, (unsigned long)&cfg);
              if (r < 0) perr("hbp arm", r);
              return r;
          }
          
          static long towa_hbp_del(unsigned long slot)
          {
              long r = towa(TOWA_OP_HWBP_DEL, slot);
              if (r < 0) perr("hbp del", r);
              return r;
          }
          
          static void towa_hbp_stat(unsigned long slot)
          {
              unsigned long long v[4] = { 0, 0, 0, 0 };
          
              long r = towa(TOWA_OP_HWBP_STAT, slot, (unsigned long)v);
              if (r < 0) { perr("hbp stat", r); return; }
          
              printf("slot %lu  hits %llu  at 0x%llx  last pc 0x%llx%s\n",
                     slot, v[0], v[3], v[1],
                     v[2] ? "  <-- tripped the guard: it was looping, so one instruction was skipped"
                          : "");
          }
          
          // --------------------------------------------------------- page watches
          //
          // Arm one page in one process. The next time that process touches it the kernel
          // records who, from where, and whether it was a write, then puts the page back
          // and lets the access through. Nothing in the game's memory is modified.
          
          static long towa_watch_arm(int pid, unsigned long addr, unsigned long mode,
                                     unsigned long len)
          {
              long r = towa(TOWA_OP_WATCH_ARM, (unsigned long)pid, addr, mode, len);
              if (r < 0) perr("watch arm", r);
              return r;
          }
          
          // A set of registers at one instruction: the GP form writes general registers,
          // the FP form writes SIMD ones by index (3,4,5 are s3/s4/s5, which is where a
          // bullet's direction lives).  Either way the instruction is skipped and the
          // function carries on with the values we put there.
          //
          //   towacli hbp gp <pid> <hexaddr> <reg:val[,reg:val...]> [wide]
          //   towacli hbp fp <pid> <hexaddr> <idx:val[,idx:val...]> [wide]
          //
          // Values are hex, and for fp they are the raw 32-bit float bits.
          static int cmd_hbp_set(int pid, unsigned long addr, bool fp, const char *list,
                                 bool wide)
          {
              towa_hbp_cfg cfg;
              memset(&cfg, 0, sizeof(cfg));
          
              cfg.pid    = pid;
              cfg.type   = TOWA_BP_X;
              cfg.addr   = addr;
              cfg.action = fp ? TOWA_ACT_FP : TOWA_ACT_GP;
              if (wide)
                  cfg.flags |= TOWA_HBPF_WIDE;
          
              const char *p = list;
              while (*p && cfg.nregs < TOWA_HBP_REGS) {
                  char *end = NULL;
                  unsigned long idx = strtoul(p, &end, 0);
                  if (!end || *end != ':') { printf("bad list at '%s'\n", p); return 2; }
          
                  unsigned long val = strtoul(end + 1, &end, 0);
          
                  cfg.regs[cfg.nregs] = idx;
                  cfg.vals[cfg.nregs] = val;
                  cfg.nregs++;
          
                  p = end;
                  if (*p == ',') p++;
              }
          
              if (!cfg.nregs) { printf("no registers given\n"); return 2; }
          
              long slot = towa(TOWA_OP_HWBP_ARM, (unsigned long)&cfg);
              if (slot < 0) { perr("hbp set", slot); return 1; }
          
              printf("slot %ld armed: %s%s at 0x%lx, %lu register(s)\n",
                     slot, wide ? "wide " : "", fp ? "fp" : "gp", addr, cfg.nregs);
              return 0;
          }
          
          static long towa_watch_off(unsigned long slot)
          {
              long r = towa(TOWA_OP_WATCH_OFF, slot);
              if (r < 0) perr("watch off", r);
              return r;
          }
          
          static bool towa_watch_stat(unsigned long slot)
          {
              towa_watch_info w;
              memset(&w, 0, sizeof(w));
          
              long r = towa(TOWA_OP_WATCH_STAT, slot, (unsigned long)&w);
              if (r < 0) { perr("watch stat", r); return false; }
          
              printf("slot %lu  page 0x%lx  hits %llu  %-6s  %s",
                     slot, w.addr, w.hits,
                     (w.flags & TOWA_WF_ACCESS) ? "access" : "write",
                     (w.flags & TOWA_WF_SPENT) ? "" : "(still armed) ");
          
              if (w.regs[0] || w.regs[1] || w.regs[2] || w.regs[3] || w.sp)
                  printf("\n  at the access: x0 0x%llx  x1 0x%llx  x2 0x%llx  x3 0x%llx  sp 0x%llx\n",
                         w.regs[0], w.regs[1], w.regs[2], w.regs[3], w.sp);
          
              if (w.hits) {
                  printf("pid %llu pc 0x%llx  %s",
                         w.last_task, w.last_pc,
                         (w.flags & TOWA_WF_WRITE) ? "WROTE it" : "read/executed it");
              }
              printf("\n");
          
              return w.hits != 0;
          }
          
          // ------------------------------------------------- the wanbai.h-style path
          //
          // This is what a scene hack does: find a device node, open it, send the key,
          // then ioctl 0x801/0x802/0x803 with their structs. Nothing here uses the
          // syscall - it is the compatibility path being tested, from the outside.
          
          #define TOWA_IOCTL_INIT_KEY    0x800
          #define TOWA_IOCTL_READ_MEM    0x801
          #define TOWA_IOCTL_MODULE_BASE 0x803
          
          struct towa_copy_memory {
              int pid;
              unsigned long addr;
              void *buffer;
              unsigned long size;
          };
          
          struct towa_module_base {
              int pid;
              char *name;
              unsigned long base;
          };
          
          static bool try_node(const char *path, int pid, unsigned int elfmagic)
          {
              printf("%-22s ", path);
          
              int fd = open(path, O_RDWR);
              if (fd < 0) {
                  printf("cannot open (%s)\n", strerror(errno));
                  return false;
              }
          
              // Their clients always send a key. Any string is accepted on our side.
              if (ioctl(fd, TOWA_IOCTL_INIT_KEY, (void *)"towacli") != 0) {
                  printf("initKey refused\n");
                  close(fd);
                  return false;
              }
              printf("key ok  ");
          
              struct towa_module_base mb;
              mb.pid  = pid;
              mb.name = (char *)"libil2cpp.so";
              mb.base = 0;
          
              if (ioctl(fd, TOWA_IOCTL_MODULE_BASE, &mb) != 0 || !mb.base) {
                  printf("module base failed\n");
                  close(fd);
                  return false;
              }
          
              unsigned int magic = 0;
              struct towa_copy_memory cm;
              cm.pid    = pid;
              cm.addr   = mb.base;
              cm.buffer = &magic;
              cm.size   = 4;
          
              if (ioctl(fd, TOWA_IOCTL_READ_MEM, &cm) != 0) {
                  printf("read failed\n");
                  close(fd);
                  return false;
              }
          
              printf("base 0x%lx  first word 0x%08x  %s\n", mb.base, magic,
                     magic == elfmagic ? "ELF - a hack would be in business" : "NOT elf");
              close(fd);
              return true;
          }
          
          // Must stay the same list the kernel registers - it is what the fallback path
          // creates nodes for when the kernel could not.
          static const char *kCompatNames[] = {
              "wanbai", "CheckMe", "Ckanri", "lanran", "video188", "bing",
              "ft_driver", "bing_rw", "Bing_rw", "Bing", "w1a3n3a7n",
          };
          
          // The driver publishes what the last `compat on` managed on its proc entry:
          //
          //     kdbg compat: misc=6 misc_err=0 major=0
          //
          // misc is how many nodes the kernel made itself.  When it could not make any -
          // device_create() refusing, not the minor pool being full - it falls back to a
          // character device under a major of its own and puts that major there, and the
          // nodes become ours to create.  That is what every scene hack that ships an
          // mknod already does; nothing here needs udev.
          static std::string compat_status(void)
          {
              char st[192] = {0};
              int fd = open("/proc/kvmstats", O_RDONLY);
              if (fd >= 0) {
                  ssize_t n = read(fd, st, sizeof(st) - 1);
                  (void)n;
                  close(fd);
              }
              return std::string(st);
          }
          
          static int compat_major(const std::string &st)
          {
              size_t p = st.find("major=");
              return p == std::string::npos ? -1 : atoi(st.c_str() + p + 6);
          }
          
          static void compat_nodes(int major, bool remove)
          {
              for (unsigned i = 0; i < sizeof(kCompatNames) / sizeof(kCompatNames[0]); i++) {
                  char path[64];
                  snprintf(path, sizeof(path), "/dev/%s", kCompatNames[i]);
          
                  if (remove) {
                      unlink(path);
                      continue;
                  }
          
                  unlink(path);                       // a stale node of another major
                  if (mknod(path, S_IFCHR | 0666, makedev(major, 0)) != 0)
                      printf("    %-20s mknod failed: %s\n", path, strerror(errno));
                  else {
                      chmod(path, 0666);
                      printf("    %-20s made, char %d:0\n", path, major);
                  }
              }
          }
          
          // ------------------------------------------------------- is anything using it
          //
          // The one question the outside world cannot answer.  A hack that drives the
          // driver and a hack that opened a node, gave up and fell back to
          // process_vm_readv look identical from /proc: both hold a node for a moment,
          // both read the game either way.  Only the driver's own counters tell them
          // apart, so it counts, and this prints what it counted.
          
          struct towa_compat_stat {
              unsigned long long opens;
              unsigned long long total_opens;
              unsigned long long keys;
              unsigned long long reads;
              unsigned long long writes;
              unsigned long long bases;
              unsigned long long denied;
              unsigned long long prctl_reads;
              unsigned long long prctl_writes;
              unsigned long long prctl_probes;
              unsigned long long sys_reads;
              unsigned long long sys_writes;
              unsigned long long mmaps;
              unsigned long long last_len;
              unsigned long long xfer_fails;
              unsigned long long xfer_holes;
              unsigned long long max_xfer;
              int  holder_pid;
              int  last_pid;
              char holder_comm[16];
              char last_comm[16];
              char last_node[16];
              unsigned int cmds[8];
              unsigned long long cmd_hits[8];
              unsigned int cmd_arg[8][8];
              unsigned int pcmds[8];
              unsigned long long pcmd_hits[8];
          };
          
          static bool print_usage_block(void)
          {
              struct towa_compat_stat st;
              memset(&st, 0, sizeof(st));
          
              long r = towa(TOWA_OP_COMPAT_STAT, (unsigned long)&st);
              if (r < 0) { perr("usage", r); return false; }
          
              bool via_node  = st.reads || st.writes || st.bases;
              bool via_prctl = st.prctl_reads || st.prctl_writes;
          
              printf("--- is anything using it? ---\n");
              printf("open right now     : %llu", st.opens);
              if (st.opens)
                  printf("   by %s (pid %d)",
                         st.holder_comm[0] ? st.holder_comm : "?", st.holder_pid);
              printf("\n");
              printf("opened since on    : %llu\n", st.total_opens);
              printf("key handshakes     : %llu\n", st.keys);
              printf("reads / writes     : %llu / %llu\n", st.reads, st.writes);
              printf("module lookups     : %llu\n", st.bases);
              printf("refused (no root)  : %llu\n", st.denied);
              printf("via prctl          : %llu reads / %llu writes, %llu probe(s)\n",
                     st.prctl_reads, st.prctl_writes, st.prctl_probes);
              printf("plain read/write   : %llu / %llu   (%llu mmap, last size %llu)\n",
                     st.sys_reads, st.sys_writes, st.mmaps, st.last_len);
              printf("short transfers    : %llu   (biggest single %llu bytes)\n",
                     st.xfer_fails, st.max_xfer);
              printf("unmapped pages hit : %llu   (skipped, the read still succeeded)\n",
                     st.xfer_holes);
              if (st.last_pid)
                  printf("last caller        : %s (pid %d)\n",
                         st.last_comm[0] ? st.last_comm : "?", st.last_pid);
              if (st.last_node[0])
                  printf("last node touched  : /dev/%s\n", st.last_node);
          
              // The raw requests.  A mod that opened a node and then used an opcode we do
              // not answer shows up here as a value that is not 0x800..0x803 or
              // 0x100..0x103 - and that is a line to add to the driver, not a mystery.
              bool any_cmd = false;
              for (int i = 0; i < 8; i++)
                  if (st.cmd_hits[i]) any_cmd = true;
          
              if (any_cmd) {
                  printf("--- ioctls, as they arrived ---\n");
                  printf("  ours: key 0x800, read 0x801, write 0x802, base 0x803,\n");
                  printf("        bing: key 0x100, read 0x101, write 0x102, base 0x103\n");
                  for (int i = 0; i < 8; i++) {
                      if (!st.cmd_hits[i]) continue;
                      printf("  0x%08x  x%llu\n", st.cmds[i], st.cmd_hits[i]);
                      const unsigned int *w = st.cmd_arg[i];
                      if (w[0] || w[1] || w[2] || w[3] || w[4] || w[5] || w[6] || w[7])
                          printf("      arg: %08x %08x %08x %08x\n"
                                 "           %08x %08x %08x %08x\n",
                                 w[0], w[1], w[2], w[3], w[4], w[5], w[6], w[7]);
                  }
              } else if (st.total_opens) {
                  printf("--- ioctls, as they arrived ---\n"
                         "  none: the node was opened and closed with no request at all\n");
              }
          
              // prctl options above 1023 from any process: a scene driver's magic is a
              // big number, libc's are all small, so this is a driver probe and nothing
              // else.  A value here that is not 0x4e41 is a magic we have not implemented.
              bool any_pcmd = false;
              for (int i = 0; i < 8; i++)
                  if (st.pcmd_hits[i]) any_pcmd = true;
          
              if (any_pcmd) {
                  printf("--- prctl options above 1023 seen ---\n");
                  for (int i = 0; i < 8; i++)
                      if (st.pcmd_hits[i])
                          printf("  0x%08x  x%llu\n", st.pcmds[i], st.pcmd_hits[i]);
              }
          
              printf("verdict            : ");
              if (via_node)
                  printf("a hack IS using the driver, through a node\n");
              else if (via_prctl)
                  printf("a hack IS using the driver, through prctl\n");
              else if (any_pcmd)
                  printf("something probed a prctl magic we do not answer - see below\n");
              else if (st.opens && (st.sys_reads || st.sys_writes || st.mmaps))
                  printf("a node is held and used by read/write/mmap, not ioctl\n");
              else if (st.opens)
                  printf("a node is HELD but idle - it is a token, not a data path\n");
              else if (st.total_opens)
                  printf("nodes were opened and let go - a hack tried and fell back\n");
              else
                  printf("nothing has used the driver since compat on\n");
          
              return via_node || via_prctl;
          }
          
          static int cmd_who(void)
          {
              print_usage_block();
              return 0;
          }
          
          // Free Fire and Free Fire MAX are two packages and usually only one is running.
          // Asking for "com.dts.freefireth" alone left the pid at -1 with MAX open (its
          // loose prefix match sometimes caught it, sometimes not), so both are tried by
          // their exact names, normal Free Fire first.
          static int find_game(void)
          {
              int pid = find_pid("com.dts.freefireth");
              if (pid < 0)
                  pid = find_pid("com.dts.freefiremax");
              return pid;
          }
          
          static int cmd_compat(int pid)
          {
              std::string st = compat_status();
              int major = compat_major(st);
          
              if (major > 0)
                  compat_nodes(major, false);         // ours to make, so make them
          
              // Before the node test below, which opens all of them itself.
              print_usage_block();
          
              printf("pid        : %d\n", pid);
              if (!st.empty())
                  printf("driver     : %s", st.c_str());
              printf("--- looking for the nodes our module registers ---\n");
          
              bool any = false;
              for (unsigned i = 0; i < sizeof(kCompatNames) / sizeof(kCompatNames[0]); i++) {
                  char path[64];
                  snprintf(path, sizeof(path), "/dev/%s", kCompatNames[i]);
                  if (access(path, F_OK) != 0 && access(path, R_OK) != 0)
                      continue;
                  any = true;
                  try_node(path, pid, kElfMagic);
              }
              if (!any) {
                  printf("none of them exist.  Either the kernel half is not in this build,\n"
                         "or the nodes have not been asked for - they are off by default:\n"
                         "    towacli compat on\n");
                  return 1;
              }
          
              printf("--- the rt-proc shape ---\n");
              printf("/proc/kvmstats          %s\n",
                     access("/proc/kvmstats", F_OK) == 0 ? "exists" : "missing");
          
              // The test above opened every node and handshaked with each one, so its own
              // traffic is in the counters.  Hand the session back clean, or the next
              // `who` describes this command instead of the hack you want to check.
              towa(TOWA_OP_COMPAT, 1);
          
              return 0;
          }
          
          // ------------------------------------------------- address -> who owns it
          //
          // A pc is only useful if you can say which library it is in and how far into
          // it, because that pair is what you would arm a hook on.
          
          struct mapping {
              unsigned long start, end, off;
              char perms[8];
              char path[256];
          };
          
          static int read_maps(int pid, std::vector<mapping> &out)
          {
              char p[64];
              snprintf(p, sizeof(p), "/proc/%d/maps", pid);
          
              FILE *f = fopen(p, "r");
              if (!f) return -1;
          
              char line[512];
              while (fgets(line, sizeof(line), f)) {
                  mapping m;
                  char perms[8] = { 0 };
                  char dev[16] = { 0 };
                  unsigned long ino = 0;
                  (void)dev; (void)ino;   /* parsed, not used */
          
                  memset(&m, 0, sizeof(m));
                  int n = sscanf(line, "%lx-%lx %7s %lx %15s %lu %255[^\n]",
                                 &m.start, &m.end, perms, &m.off, dev, &ino, m.path);
                  if (n < 5) continue;                 /* anonymous lines end after ino */
          
                  snprintf(m.perms, sizeof(m.perms), "%s", perms);
                  char *q = m.path;
                  while (*q == ' ') q++;
                  memmove(m.path, q, strlen(q) + 1);
                  out.push_back(m);
              }
              fclose(f);
              return 0;
          }
          
          // module + offset for an address; false if it is not mapped in that process
          static bool module_of(int pid, unsigned long addr, char *name, size_t n,
                                unsigned long *base, unsigned long *off)
          {
              std::vector<mapping> ms;
              if (read_maps(pid, ms) < 0) return false;
          
              int hit = -1;
              for (size_t i = 0; i < ms.size(); i++)
                  if (addr >= ms[i].start && addr < ms[i].end) { hit = (int)i; break; }
              if (hit < 0) return false;
          
              const mapping &m = ms[hit];
              snprintf(name, n, "%s", m.path[0] ? m.path : "(anonymous)");
          
              unsigned long b = m.start;
              if (m.path[0])
                  for (size_t i = 0; i < ms.size(); i++)
                      if (!strcmp(ms[i].path, m.path) && ms[i].start < b)
                          b = ms[i].start;
          
              if (base) *base = b;
              if (off)  *off  = addr - b;
              return true;
          }
          
          /*
           * hunt: arm a write watch on the stack page of every thread that looks like it
           * runs game code, then get out of the way.
           *
           * It returns immediately rather than waiting, because the game only runs when
           * it is in the foreground - so the watching has to happen while the terminal is
           * not on screen.  Arm now, play, then `towacli report`.
           */
          // -------------------------------------------------- the memory syscalls
          //
          // process_vm_readv / process_vm_writev are offered to the driver before the
          // kernel handles them (a call compiled into process_vm_rw, nothing hooked).
          // Off by default; "count" records who calls them without changing anything,
          // "serve" answers them through the driver instead.
          //
          // This is how a mod that opens no device and speaks no protocol ends up using
          // the driver - and count mode is how its mechanism gets identified at all,
          // when its binary is packed and cannot be read.
          
          static int g_hijack_pid;
          
          static int cmd_hijack(const char *arg, const char *pidarg)
          {
              if (arg) {
                  int m = !strcmp(arg, "off")   ? 0
                        : !strcmp(arg, "count") ? 1
                        : !strcmp(arg, "serve") ? 2 : -1;
          
                  if (m < 0) {
                      printf("usage: hijack [off|count|serve]\n");
                      return 2;
                  }
          
                  int tpid = (m == 2 && pidarg) ? resolve_pid(pidarg) : 0;
          
                  long r = towa(TOWA_OP_HIJACK, (unsigned long)m, (unsigned long)tpid);
                  if (r < 0) { perr("hijack", r); return 1; }
          
                  if (m == 2)
                      printf("serving process_vm_readv for %s\n",
                             tpid ? pidarg : "EVERY process (no pid given)");
              }
          
              towa_pvm_stat st[TOWA_PVM_SLOTS];
              memset(st, 0, sizeof(st));
          
              long mode = towa(TOWA_OP_PVM_STAT,
                               (unsigned long)(uintptr_t)st, TOWA_PVM_SLOTS);
              if (mode < 0) { perr("pvm stat", mode); return 1; }
          
              printf("memory syscalls : %s\n",
                     mode == 0 ? "off" : mode == 1 ? "count only (kernel still does the work)"
                                                   : "served by the driver");
          
              bool any = false;
              for (int i = 0; i < TOWA_PVM_SLOTS; i++)
                  if (st[i].pid) any = true;
          
              if (!any) {
                  printf("callers         : none recorded\n");
                  return 0;
              }
          
              printf("  %-8s %-18s %-12s %s\n", "pid", "comm", "calls", "bytes");
              for (int i = 0; i < TOWA_PVM_SLOTS; i++)
                  if (st[i].pid)
                      printf("  %-8d %-18s %-12u %llu\n",
                             st[i].pid, st[i].comm, st[i].calls, st[i].bytes);
          
              return 0;
          }
          
          // ------------------------------------------------------- the memory layout
          //
          // Our own answer to /proc/<pid>/maps: every mapping, its permissions, and the
          // file behind it, straight out of the target's VMA list through the driver.
          
          static int cmd_maps(int pid)
          {
              if (pid <= 0) { printf("no pid\n"); return 1; }
          
              const unsigned int cap = 512;
              const unsigned int names_cap = 32 * 1024;
          
              std::vector<towa_map> maps(cap);
              std::vector<char>     names(names_cap);
          
              towa_maps_req req;
              memset(&req, 0, sizeof(req));
              req.cap       = cap;
              req.names_cap = names_cap;
              req.entries   = (unsigned long long)(uintptr_t)maps.data();
              req.names     = (unsigned long long)(uintptr_t)names.data();
          
              long r = towa(TOWA_OP_MAPS, (unsigned long)pid, (unsigned long)&req);
              if (r < 0) { perr("maps", r); return 1; }
          
              printf("pid %d: %u mappings (%u shown)\n", pid, req.total, req.cap);
              printf("  %-18s %-18s %-5s %-9s %s\n", "start", "end", "perm", "offset", "name");
          
              for (unsigned int i = 0; i < cap; i++) {
                  const towa_map &m = maps[i];
                  if (!m.start)
                      break;
          
                  char perm[5] = { '.', '.', '.', '.', 0 };
                  if (m.perm & TOWA_MAP_R) perm[0] = 'r';
                  if (m.perm & TOWA_MAP_W) perm[1] = 'w';
                  if (m.perm & TOWA_MAP_X) perm[2] = 'x';
                  if (m.perm & TOWA_MAP_P) perm[3] = 's';
          
                  const char *name = "";
                  if (m.name_off != 0xffffffffu && m.name_off < names_cap)
                      name = &names[m.name_off];
          
                  printf("  %016llx-%016llx %-5s %09llx %s\n",
                         m.start, m.end, perm, m.offset, name);
              }
          
              return 0;
          }
          
          // --------------------------------------------------------------- batch read
          //
          // One call, one entry: proves the batch op end to end.  The same op with more
          // entries is what the mod will use, a frame's worth of fields per syscall.
          
          static int cmd_xfer(int pid, unsigned long addr, unsigned long len)
          {
              if (pid <= 0 || !addr || !len || len > 4096) {
                  printf("usage: xfer <pid|name> <hexaddr> <len up to 4096>\n");
                  return 2;
              }
          
              std::vector<unsigned char> buf(len);
              towa_xfer e;
              memset(&e, 0, sizeof(e));
              e.pid  = pid;
              e.len  = (unsigned int)len;
              e.addr = addr;
              e.buf  = (unsigned long long)(uintptr_t)buf.data();
          
              long r = towa(TOWA_OP_XFER, (unsigned long)&e, 1, 0);
              if (r < 0) { perr("xfer", r); return 1; }
          
              if (e.result < 0) {
                  printf("one entry, result %lld - that address did not read\n",
                         (long long)e.result);
                  return 1;
              }
          
              printf("one entry, %lld byte(s) through the batch op\n", (long long)e.result);
              hexdump(addr, buf.data(), (int)e.result);
          
              return 0;
          }
          
          // ------------------------------------------------- find a string in a process
          //
          // Hacks ship packed: the one on the phone has 300 readable strings in the file
          // and not one of them is its driver protocol.  Packing is undone in memory, so
          // the moment it runs its own "/dev/..." names, ioctl numbers and error messages
          // are sitting in its data and its heap - and the driver can read them.  This
          // walks the readable mappings, reads them and prints where the string lives.
          static void print_window(const unsigned char *p, long from, long to,
                                   unsigned long base)
          {
              printf("  0x%016lx  ", base + (unsigned long)from);
              for (long i = from; i < to; i++) {
                  unsigned char c = p[i];
                  putchar((c >= 32 && c < 127) ? c : '.');
              }
              putchar('\n');
          }
          
          static int cmd_scan(int pid, const char *needle)
          {
              if (pid <= 0) { printf("no pid - is that process running?\n"); return 1; }
          
              size_t nlen = strlen(needle);
              if (!nlen) { printf("empty string\n"); return 1; }
          
              char path[64];
              snprintf(path, sizeof(path), "/proc/%d/maps", pid);
              FILE *f = fopen(path, "r");
              if (!f) { perror(path); return 1; }
          
              const long chunk = 256 * 1024;
              std::vector<unsigned char> buf((size_t)chunk);
              unsigned long long scanned = 0;
              int hits = 0;
              char line[512];
          
              printf("scanning pid %d for \"%s\" ...\n", pid, needle);
          
              while (hits < 40 && fgets(line, sizeof(line), f)) {
                  unsigned long start = 0, end = 0;
                  char perms[8] = {0};
          
                  if (sscanf(line, "%lx-%lx %7s", &start, &end, perms) != 3) continue;
                  if (perms[0] != 'r' || end <= start) continue;
          
                  for (unsigned long a = start; a < end && hits < 40; a += chunk) {
                      unsigned long want = end - a;
                      if (want > (unsigned long)chunk) want = (unsigned long)chunk;
          
                      long got = towa(TOWA_OP_READ, (unsigned long)pid, a,
                                      (unsigned long)buf.data(), want);
                      if (got <= 0) break;
          
                      scanned += (unsigned long long)got;
          
                      for (long i = 0; i + (long)nlen <= got; i++) {
                          if (memcmp(&buf[(size_t)i], needle, nlen)) continue;
          
                          long from = (i - 48 < 0) ? 0 : i - 48;
                          long to   = i + (long)nlen + 48;
                          if (to > got) to = got;
                          print_window(buf.data(), from, to, a);
                          if (++hits >= 40) break;
                      }
          
                      if ((unsigned long)got < want) break;
                  }
              }
          
              fclose(f);
              printf("scan done: %llu bytes read, %d hit(s)\n", scanned, hits);
              return hits ? 0 : 1;
          }
          
          static int cmd_hunt(void)
          {
              int pid = find_game();
              if (pid <= 0) { printf("the game is not running\n"); return 1; }
          
              /*
               * Slots stay held once used, so clear them first - but quietly: on a
               * fresh boot none of them are armed and every one of those calls
               * answers -EINVAL, which is not a failure.
               */
              for (int i = 0; i < 4; i++)
                  towa(TOWA_OP_WATCH_OFF, (unsigned long)i);
          
              char dir[64];
              snprintf(dir, sizeof(dir), "/proc/%d/task", pid);
          
              DIR *d = opendir(dir);
              if (!d) { perror("task"); return 1; }
          
              struct thread_cand { int tid; char comm[64]; unsigned long sp; };
              thread_cand cand[512];
              int nc = 0;
              struct dirent *e;
          
              while ((e = readdir(d)) != NULL && nc < 512) {
                  if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
          
                  int tid = atoi(e->d_name);
                  char comm[64];
                  read_comm(tid, comm, sizeof(comm));
                  if (!comm[0]) continue;
          
                  /* threads that plausibly execute the game, not the framework */
                  if (!strstr(comm, "Unity") && !strstr(comm, "IL2CPP") &&
                      !strstr(comm, "Gfx")   && !strstr(comm, "Render"))
                      continue;
          
                  cand[nc].tid = tid;
                  snprintf(cand[nc].comm, sizeof(cand[nc].comm), "%s", comm);
                  cand[nc].sp = proc_sp(tid);
                  nc++;
              }
              closedir(d);
          
              if (!nc) { printf("no Unity/IL2CPP-looking threads found in pid %d\n", pid); return 1; }
          
              printf("pid %d, %d candidate threads\n", pid, nc);
          
              /* hottest first: a thread that is actually in a syscall right now has a
               * live stack pointer and is far more likely to write to it soon */
              for (int i = 0; i < nc; i++)
                  for (int j = i + 1; j < nc; j++)
                      if (cand[j].sp && !cand[i].sp) {
                          thread_cand t = cand[i]; cand[i] = cand[j]; cand[j] = t;
                      }
          
              int armed = 0;
              for (int i = 0; i < nc && armed < 4; i++) {
                  unsigned long sp = cand[i].sp;
          
                  for (int k = 0; k < 5 && !sp; k++) {
                      sp = proc_sp(cand[i].tid);
                      if (!sp) usleep(10000);
                  }
                  if (!sp) continue;
          
                  unsigned long page = sp & ~0xfffUL;
                  long slot = towa_watch_arm(cand[i].tid, page, TOWA_WATCH_WRITE, 0);
                  if (slot < 0) continue;
          
                  printf("  slot %ld  tid %-6d %-16s page 0x%lx\n",
                         slot, cand[i].tid, cand[i].comm, page);
                  armed++;
              }
          
              if (!armed) { printf("could not arm anything - are all four slots busy?\n"); return 1; }
          
              printf("\nnow put the game in front and play, then run:\n"
                     "    towacli report\n");
              return 0;
          }
          
          /*
           * report: read back every slot, name the pc, and release the slots.
           */
          static int cmd_report(void)
          {
              int pid = find_game();
              int any = 0;
          
              for (int slot = 0; slot < 4; slot++) {
                  towa_watch_info w;
                  memset(&w, 0, sizeof(w));
          
                  if (towa(TOWA_OP_WATCH_STAT, slot, (unsigned long)&w) < 0)
                      continue;
          
                  any = 1;
                  printf("slot %d  page 0x%lx  hits %llu  %-6s",
                         slot, w.addr, w.hits,
                         (w.flags & TOWA_WF_ACCESS) ? "access" : "write");
          
                  if (!w.hits) {
                      printf("  (never touched)\n");
                      towa_watch_off(slot);
                      continue;
                  }
          
                  unsigned long pc = (unsigned long)w.last_pc;
          
                  if ((pc >> 48) == 0xffff) {
                      printf("  pc 0x%lx  <kernel>\n", pc);
                  } else {
                      char nm[256];
                      unsigned long base = 0, off = 0;
                      if (pid > 0 && module_of(pid, pc, nm, sizeof(nm), &base, &off)) {
                          const char *base_name = strrchr(nm, '/');
                          printf("  pc 0x%lx  %s + 0x%lx\n",
                                 pc, base_name ? base_name + 1 : nm, off);
                      } else {
                          printf("  pc 0x%lx  (unmapped)\n", pc);
                      }
                  }
          
                  printf("        %s\n", (w.flags & TOWA_WF_WRITE) ? "WROTE it" : "read");
                  towa_watch_off(slot);
              }
          
              if (!any) printf("nothing armed - run 'towacli hunt' first\n");
              return 0;
          }
          
          static int cmd_where(int pid, unsigned long addr)
          {
              std::vector<mapping> ms;
              if (read_maps(pid, ms) < 0) { perror("maps"); return 1; }
          
              int hit = -1;
              for (size_t i = 0; i < ms.size(); i++)
                  if (addr >= ms[i].start && addr < ms[i].end) { hit = (int)i; break; }
          
              if (hit < 0) { printf("0x%lx is not mapped in pid %d\n", addr, pid); return 1; }
          
              const mapping &m = ms[hit];
              printf("mapping : %lx-%lx %s off %lx\n", m.start, m.end, m.perms, m.off);
              printf("file    : %s\n", m.path[0] ? m.path : "(anonymous)");
          
              /* the lowest mapping of the same file is its load base */
              unsigned long base = m.start;
              if (m.path[0]) {
                  for (size_t i = 0; i < ms.size(); i++)
                      if (!strcmp(ms[i].path, m.path) && ms[i].start < base)
                          base = ms[i].start;
              }
          
              printf("base    : 0x%lx\n", base);
              printf("offset  : 0x%lx        <- %lx + 0x%lx\n", addr - base, base, addr - base);
              return 0;
          }
          
          // ------------------------------------------------------- the prctl family
          //
          // The KPM/Neo family carries the same two operations through prctl() with a
          // magic option, so it needs no device node at all.  Layout must match
          // struct kdbg_na_cmd in the kernel byte for byte.
          #define KDBG_PRCTL_MAGIC 0x4E41
          
          struct na_cmd {
              unsigned int  op;
              unsigned int  pid;
              unsigned long long addr;
              unsigned int  size;
              int           result;
              int           screen_w;
              int           screen_h;
              char          pkg[256];
              unsigned char data[4096];
          };
          
          static int cmd_kpm(int pid, unsigned long addr, unsigned long len)
          {
              static struct na_cmd c;      /* 4 KB - deliberately not on the stack */
          
              if (len == 0 || len > sizeof(c.data)) { printf("len 1..4096\n"); return 2; }
          
              memset(&c, 0, sizeof(c));
              errno = 0;
              long r = prctl(KDBG_PRCTL_MAGIC, 5, &c, 0, 0);
              printf("probe : prctl(0x4E41, GET_PID) -> %ld %s\n", r,
                     r ? strerror(errno) : "(driver present)");
              if (r) {
                  printf("        no prctl driver, or you are not root\n");
                  return 1;
              }
          
              memset(&c, 0, sizeof(c));
              c.pid  = (unsigned int)pid;
              c.addr = addr;
              c.size = (unsigned int)len;
          
              errno = 0;
              r = prctl(KDBG_PRCTL_MAGIC, 1, &c, 0, 0);
              if (r || c.result) {
                  printf("read  : prctl(0x4E41, READ_MEM) -> %ld result %d %s\n",
                         r, c.result, r ? strerror(errno) : "");
                  return 1;
              }
          
              printf("read  : ok through prctl, %lu bytes from 0x%lx\n", len, addr);
              hexdump(addr, c.data, (int)len);
              return 0;
          }
          
          // ---------------------------------------------------------------- utilities
          
          static bool hex_to_bytes(const char *s, std::vector<unsigned char> &out)
          {
              size_t n = strlen(s);
              if (n == 0 || n % 2) return false;
          
              for (size_t i = 0; i < n; i += 2) {
                  unsigned v;
                  if (sscanf(s + i, "%2x", &v) != 1) return false;
                  out.push_back((unsigned char)v);
              }
              return true;
          }
          
          static void hexdump(unsigned long addr, const unsigned char *p, int n)
          {
              for (int i = 0; i < n; i += 16) {
                  printf("%016lx  ", addr + i);
                  for (int j = 0; j < 16; j++) {
                      if (i + j < n) printf("%02x ", p[i + j]);
                      else           printf("   ");
                      if (j == 7) printf(" ");
                  }
                  printf(" |");
                  for (int j = 0; j < 16 && i + j < n; j++) {
                      unsigned char c = p[i + j];
                      printf("%c", (c >= 32 && c < 127) ? c : '.');
                  }
                  printf("|\n");
              }
          }
          
          // ---------------------------------------------------------------- the one test
          
          static int cmd_test(int pid)
          {
              printf("syscall    : %lu\n", g_nr);
          
              long r = towa(TOWA_OP_PING);
              if (r < 0) {
                  perr("ping", r);
                  if (-r == ENOSYS)
                      printf("           ENOSYS means either the number is wrong or "
                             "towa_core.ko is not loaded\n");
                  return 1;
              }
              if ((unsigned long)r != TOWA_MAGIC) {
                  printf("ping       : unexpected reply 0x%lx\n", (unsigned long)r);
                  return 1;
              }
              printf("ping       : ok (0x%lx)\n", (unsigned long)r);
          
              if (pid <= 0) {
                  printf("no pid given and no process matched\n");
                  return 1;
              }
              printf("pid        : %d\n", pid);
          
              unsigned long base = towa_base(pid, "libil2cpp.so");
              if (!base) return 1;
              printf("libil2cpp  : 0x%lx\n", base);
          
              unsigned int magic = 0;
              if (towa_read(pid, base, &magic, 4) < 0) return 1;
              printf("first word : 0x%08x  (%s)\n", magic,
                     magic == kElfMagic ? "ELF - the kernel really read it" : "NOT elf, something is off");
          
              return magic == kElfMagic ? 0 : 1;
          }
          
          // ---------------------------------------------------------------- main
          
          static void usage(const char *me)
          {
              printf("towacli %s\n\n", TOWACLI_BUILD);
              printf(
                  "towacli [-n <syscall nr>] <command>\n"
                  "\n"
                  "  ping                          is the syscall there?\n"
                  "  test [pid]                    ping + libil2cpp base + ELF check\n"
                  "  compat on|off                 register/remove the device nodes the scene\n"
                  "                                hacks look for.  OFF by default - they\n"
                  "                                are the only visible part of this driver\n"
                  "  compat                        the same thing a scene hack does, through\n"
                  "                                /dev/wanbai and ioctl 0x800..0x803\n"
                  "  hijack [off|count|serve [pid]]  offer process_vm_readv/writev to the\n"
                  "                                first; count names the callers without\n"
                  "                                changing anything, serve answers them\n"
                  "  maps <pid|name>               every mapping of a process: start, end,\n"
                  "                                perms, offset, module - our own answer\n"
                  "                                to /proc/<pid>/maps\n"
                  "  xfer <pid> <addr> <len>       read through the batch op, one entry\n"
                  "  who                           IS a hack using the driver?  opens,\n"
                  "                                reads, writes, lookups, and who\n"
                  "  scan <pid|name> <string>      find one of a packed hack's own strings\n"
                  "                                in its memory, e.g. scan XuiModz /dev/\n"
                  "  pid <name>                    find a pid by process name\n"
                  "  kpm <pid> <hexaddr> <len>     read through the prctl family instead of a\n"
                  "                                node - needs root, and needs no /dev entry\n"
                  "  selftest                      arm a watch on our own page, write to it,\n"
                  "                                report - proves the watcher with\n"
                  "                                nothing at stake.  Run this first\n"
                  "  hunt                          watch the stack page of every Unity/IL2CPP\n"
                  "                                thread at once (4 slots), then return -\n"
                  "                                play, then run report\n"
                  "  report                        read every slot back, name each pc, and\n"
                  "                                release the slots\n"
                  "  watchstack [pid|tid|name]     watch the page a thread's stack pointer\n"
                  "                                is on right now.  A name is resolved\n"
                  "                                at that moment, because threads\n"
                  "                                come and go: watchstack UnityMain\n"
                  "  base <pid> <soname>           load address of a shared object\n"
                  "  where <pid> <hexaddr>         which module an address is in,\n"
                  "                                and its offset into it - turn a\n"
                  "                                pc from a watch into something\n"
                  "                                you could hook\n"
                  "  read <pid> <hexaddr> <len>    hexdump from the target\n"
                  "  write <pid> <hexaddr> <hex>   write bytes into the target\n"
                  "\n"
                  "hardware breakpoints (no byte of the target is touched):\n"
                  "  hbp arm   x <pid> <addr> <act> [v] [reg]   an action is mandatory\n"
                  "      act: none  skip        pc += 4, the instruction does not run\n"
                  "           ret   <v>        return from the function now, x0 = v\n"
                  "           pc    <addr>     jump\n"
                  "           x0    <v>        x0 = v, then skip that instruction\n"
                  "           reg   <v> <rn>   regs[rn] = v, then skip it\n"
                  "  hbp sweep x <pid> <addr> <act> [v]      arm, watch for 10 s, disarm\n"
                  "  hbp stat  <slot>                        hits, last pc, address\n"
                  "  hbp off   <slot>                        disarm\n"
                  "\n"
                  "page watches (the page table is touched, not the page):\n"
                  "  watch   <pid> <addr> [w|a]    next write (w) or next access (a)\n"
                  "                                this is the safe way to see who writes\n"
                  "                                what: the page table is touched, the\n"
                  "                                page's contents never are\n"
                  "  watch sweep <pid> <addr> [w|a]  arm, wait up to 20 s, report, disarm\n"
                  "  watch stat <slot>             who touched it, from which pc\n"
                  "  watch off  <slot>             disarm\n"
                  "\n"
                  "example:  towacli test\n"
                  "          towacli read 12345 0x71c2a5b000 64\n"
                  "          towacli hbp sweep x 12345 0x71c2a5b000 ret 1\n"
                  "          towacli hbp arm x 12345 0x71c2a5b000 ret 1\n"
                  "          towacli watch sweep 12345 0x71c2a5b400 w\n",
                  me);
          }
          
          int main(int argc, char **argv)
          {
              std::vector<std::string> a;
              for (int i = 1; i < argc; i++) {
                  if (!strcmp(argv[i], "-n") && i + 1 < argc) {
                      g_nr = strtoul(argv[++i], NULL, 0);
                      continue;
                  }
                  a.push_back(argv[i]);
              }
          
              if (a.empty()) { usage(argv[0]); return 2; }
          
              if (!g_nr) {
                  fprintf(stderr,
                          "towacli was built without -DNR_TOWA=<number>, so it does not\n"
                          "know the syscall.  Either use the binary the build produces, or\n"
                          "pass -n <number>.  Do not guess: the wrong number is another\n"
                          "syscall, with six arguments you did not mean.\n");
                  return 2;
              }
          
              const std::string &cmd = a[0];
          
              if (cmd == "ping") {
                  long r = towa(TOWA_OP_PING);
                  if (r < 0) { perr("ping", r); return 1; }
                  printf("towa alive, magic 0x%lx, syscall %lu, %s\n",
                         (unsigned long)r, g_nr, TOWACLI_BUILD);
                  return 0;
              }
          
              if (cmd == "test") {
                  int pid = a.size() > 1 ? atoi(a[1].c_str()) : find_game();
                  return cmd_test(pid);
              }
          
              // The device nodes are the only thing this driver leaves lying around, so
              // they are off unless asked for.  On when a hack is about to run, off again
              // after: nothing in /dev, /sys or /proc while they are not needed.
              // One command, one answer: is anything actually driving the kernel side?
              if (cmd == "who")
                  return cmd_who();
          
              if (cmd == "hijack")
                  return cmd_hijack(a.size() > 1 ? a[1].c_str() : nullptr,
                                    a.size() > 2 ? a[2].c_str() : nullptr);
          
              if (cmd == "maps") {
                  int pid = a.size() > 1 ? resolve_pid(a[1].c_str()) : find_game();
                  return cmd_maps(pid);
              }
          
              if (cmd == "xfer") {
                  if (a.size() < 4) {
                      printf("usage: xfer <pid|name> <hexaddr> <len>\n");
                      return 2;
                  }
                  return cmd_xfer(resolve_pid(a[1].c_str()),
                                  strtoul(a[2].c_str(), nullptr, 16),
                                  strtoul(a[3].c_str(), nullptr, 10));
              }
          
              // For a packed hack: find one of its own strings in its own memory.
              if (cmd == "scan") {
                  if (a.size() < 3) {
                      printf("usage: scan <pid|name> <string>\n"
                             "  e.g. scan TelegramXuiModz DIT\n"
                             "       scan TelegramXuiModz /dev/\n");
                      return 2;
                  }
                  return cmd_scan(resolve_pid(a[1].c_str()), a[2].c_str());
              }
          
              if (cmd == "compat") {
                  if (a.size() > 1 && (a[1] == "on" || a[1] == "off")) {
                      bool on = (a[1] == "on");
                      int was = compat_major(compat_status());   // the state before this call
          
                      long r = towa(TOWA_OP_COMPAT, on ? 1 : 0);
                      if (r < 0) { perr("compat", r); return 1; }
          
                      if (!on) {
                          if (was > 0)
                              compat_nodes(was, true);
                          printf("compat off - nodes removed; nothing left in /dev or /sys\n");
                          return 0;
                      }
          
                      std::string st = compat_status();
                      printf("compat on  - %s", st.empty() ? "registered\n" : st.c_str());
          
                      int major = compat_major(st);
                      if (major > 0) {
                          printf("  the kernel could not create the nodes itself, so:\n");
                          compat_nodes(major, false);
                      }
                      printf("  run a hack now\n");
                      return 0;
                  }
                  int pid = a.size() > 1 ? resolve_pid(a[1].c_str()) : find_game();
                  return cmd_compat(pid);
              }
          
              // Prove the whole mechanism on a page of our own, with nothing at stake.
              // Arm -> write -> fault -> restore -> report, in one second, on a throwaway
              // anonymous page.  Run this before pointing anything at the game.
              if (cmd == "selftest") {
                  void *p = mmap(NULL, 4096, PROT_READ | PROT_WRITE,
                                 MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (p == MAP_FAILED) { perror("mmap"); return 1; }
          
                  memset(p, 0, 4096);                 /* faulted in, so the PTE exists */
          
                  int me = getpid();
                  printf("selftest: pid %d, page %p\n", me, p);
          
                  long slot = towa_watch_arm(me, (unsigned long)p, TOWA_WATCH_WRITE, 0);
                  if (slot < 0) {
                      printf("selftest: arm failed - that alone is the bug\n");
                      munmap(p, 4096);
                      return 1;
                  }
                  printf("selftest: armed slot %ld\n", slot);
          
                  /* the write that must trip it */
                  *(volatile int *)((char *)p + 64) = 0x5eed;
          
                  towa_watch_stat(slot);
                  towa_watch_off(slot);
                  munmap(p, 4096);
          
                  printf("selftest: done - if that said hits 1 WROTE it, the watcher works\n");
                  return 0;
              }
          
              if (cmd == "kpm") {
                  if (a.size() < 4) { usage(argv[0]); return 2; }
                  int pid = resolve_pid(a[1].c_str());
                  if (pid <= 0) { printf("no such process\n"); return 1; }
                  return cmd_kpm(pid, strtoul(a[2].c_str(), NULL, 16),
                                 strtoul(a[3].c_str(), NULL, 0));
              }
          
              if (cmd == "hunt")   return cmd_hunt();
              if (cmd == "report") return cmd_report();
          
              if (cmd == "where") {
                  if (a.size() < 3) { usage(argv[0]); return 2; }
                  int pid = resolve_pid(a[1].c_str());
                  if (pid <= 0) { printf("no such process\n"); return 1; }
                  return cmd_where(pid, strtoul(a[2].c_str(), NULL, 16));
              }
          
              if (cmd == "pid") {
                  if (a.size() < 2) { usage(argv[0]); return 2; }
                  int pid = find_pid(a[1].c_str());
                  if (pid < 0) { printf("no process matching '%s'\n", a[1].c_str()); return 1; }
                  printf("%d\n", pid);
                  return 0;
              }
          
              if (cmd == "base") {
                  if (a.size() < 3) { usage(argv[0]); return 2; }
                  unsigned long b = towa_base(atoi(a[1].c_str()), a[2].c_str());
                  if (!b) return 1;
                  printf("0x%lx\n", b);
                  return 0;
              }
          
              // Hardware breakpoints. Nothing is written to the target: the address just
              // goes into a debug register, so unlike a hook there is no patched byte for
              // anything to find.
              if (cmd == "hbp" && a.size() >= 5 &&
                  (a[1] == "gp" || a[1] == "fp")) {
                  int pid = resolve_pid(a[2].c_str());
                  unsigned long addr = strtoul(a[3].c_str(), NULL, 16);
                  bool wide = false;
          
                  for (size_t i = 5; i < a.size(); i++)
                      if (a[i] == "wide") wide = true;
          
                  return cmd_hbp_set(pid, addr, a[1] == "fp", a[4].c_str(), wide);
              }
          
              if (cmd == "hbp") {
                  if (a.size() < 2) { usage(argv[0]); return 2; }
          
                  if (a[1] == "stat") {
                      if (a.size() < 3) { usage(argv[0]); return 2; }
                      towa_hbp_stat(strtoul(a[2].c_str(), NULL, 0));
                      return 0;
                  }
          
                  if (a[1] == "off") {
                      if (a.size() < 3) { usage(argv[0]); return 2; }
                      long r = towa_hbp_del(strtoul(a[2].c_str(), NULL, 0));
                      if (r < 0) return 1;
                      printf("slot %s cleared\n", a[2].c_str());
                      return 0;
                  }
          
                  // add | arm | sweep  <x|w>  <pid>  <hexaddr>  [action] [value] [reg]
                  bool sweep = a[1] == "sweep";
                  if ((a[1] != "add" && a[1] != "arm" && !sweep) || a.size() < 5) {
                      usage(argv[0]);
                      return 2;
                  }
          
                  unsigned long type = (a[2] == "w") ? TOWA_BP_W : TOWA_BP_X;
                  int pid = resolve_pid(a[3].c_str());
                  unsigned long addr = strtoul(a[4].c_str(), NULL, 16);
          
                  unsigned long action = TOWA_ACT_NONE, value = 0, reg = 0;
                  if (a.size() > 5) {
                      const std::string &act = a[5];
                      if      (act == "skip") action = TOWA_ACT_SKIP;
                      else if (act == "ret")  action = TOWA_ACT_RET;
                      else if (act == "pc")   action = TOWA_ACT_PC;
                      else if (act == "x0")   action = TOWA_ACT_X0;
                      else if (act == "reg")  action = TOWA_ACT_REG;
                      else if (act != "none") { printf("unknown action '%s'\n", act.c_str()); return 2; }
          
                      if (a.size() > 6) value = strtoul(a[6].c_str(), NULL, 0);
                      if (a.size() > 7) reg   = strtoul(a[7].c_str(), NULL, 0);
                  }
          
                  long slot = towa_hbp_arm(pid, addr, type, action, value, reg);
                  if (slot < 0) {
                      printf("(ENOSPC = all four debug registers in use;  "
                             "EINVAL/ENOTSUPP = the kernel will not take that address/type)\n");
                      return 1;
                  }
          
                  const char *what = type == TOWA_BP_W ? "write" : "execute";
                  if (action == TOWA_ACT_NONE)
                      printf("armed slot %ld on pid %d at 0x%lx (%s, counting)\n",
                             slot, pid, addr, what);
                  else
                      printf("armed slot %ld on pid %d at 0x%lx (%s, action %s, value 0x%lx)\n",
                             slot, pid, addr, what, a[5].c_str(), value);
          
                  if (sweep) {
                      for (int i = 0; i < 10; i++) { sleep(1); towa_hbp_stat(slot); }
                      towa_hbp_del(slot);
                      printf("disarmed slot %ld\n", slot);
                  }
                  return 0;
              }
          
              // One command that does the arithmetic: find the thread's stack pointer,
              // take the page it lives on, and watch that.  The address cannot be
              // remembered between runs - a reboot or a relaunch moves it.
              if (cmd == "watchstack") {
                  int pid = find_game();
                  if (pid <= 0) { printf("the game is not running\n"); return 1; }
          
                  int tid = pid;
                  if (a.size() > 1) {
                      const std::string &arg = a[1];
                      bool numeric = !arg.empty();
          
                      for (size_t i = 0; i < arg.size(); i++)
                          if (arg[i] < '0' || arg[i] > '9') { numeric = false; break; }
          
                      if (numeric) {
                          tid = atoi(arg.c_str());
                      } else if (arg.find('.') != std::string::npos) {
                          int other = find_pid(arg.c_str());
                          if (other <= 0) { printf("no process matching %s\n", arg.c_str()); return 1; }
                          pid = other;
                          tid = pid;
                      } else {
                          /* a thread name - resolved now, because threads come and go */
                          tid = find_thread(pid, arg.c_str());
                          if (tid < 0) {
                              printf("no live thread called '%s'.  Threads in pid %d right now:\n",
                                     arg.c_str(), pid);
                              char dir[64];
                              snprintf(dir, sizeof(dir), "/proc/%d/task", pid);
                              DIR *d = opendir(dir);
                              if (d) {
                                  struct dirent *e;
                                  int shown = 0;
                                  while ((e = readdir(d)) != NULL && shown < 25) {
                                      if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
                                      char comm[64];
                                      read_comm(atoi(e->d_name), comm, sizeof(comm));
                                      if (comm[0]) { printf("  %-6s %s\n", e->d_name, comm); shown++; }
                                  }
                                  closedir(d);
                              }
                              return 1;
                          }
                      }
                  }
          
                  unsigned long sp = 0;
                  for (int i = 0; i < 50 && !sp; i++) {
                      sp = proc_sp(tid);
                      if (!sp) usleep(20000);
                  }
                  if (!sp) {
                      printf("could not read the stack pointer of tid %d - is it still alive?\n", tid);
                      return 1;
                  }
          
                  char comm[64];
                  read_comm(tid, comm, sizeof(comm));
          
                  unsigned long page = sp & ~0xfffUL;
                  printf("pid %d  tid %d (%s)  sp 0x%lx  page 0x%lx\n",
                         pid, tid, comm, sp, page);
          
                  long slot = towa_watch_arm(tid, page, TOWA_WATCH_WRITE, 0);
                  if (slot < 0) {
                      printf("(the page under the live stack pointer should always be mapped;\n"
                             " EFAULT here means it is not faulted in yet - try again)\n");
                      return 1;
                  }
                  printf("watching slot %ld - play for ten seconds, then:\n", slot);
                  printf("    towacli watch stat %ld\n", slot);
                  return 0;
              }
          
              // Page watches: arm one page, see who touches it, put it back.
              if (cmd == "watch") {
                  if (a.size() < 2) { usage(argv[0]); return 2; }
          
                  if (a[1] == "stat") {
                      if (a.size() < 3) { usage(argv[0]); return 2; }
                      towa_watch_stat(strtoul(a[2].c_str(), NULL, 0));
                      return 0;
                  }
          
                  if (a[1] == "off") {
                      if (a.size() < 3) { usage(argv[0]); return 2; }
                      long r = towa_watch_off(strtoul(a[2].c_str(), NULL, 0));
                      if (r < 0) return 1;
                      printf("watch slot %s disarmed\n", a[2].c_str());
                      return 0;
                  }
          
                  // <pid> <hexaddr> [w|a]   or   sweep <pid> <hexaddr> [w|a]
                  //
                  // The documented form has no sub-command, so a[1] is the pid.  The
                  // earlier version demanded a literal "watch" there and printed the
                  // help instead, which is why the first attempt did nothing.
                  bool sweep = a[1] == "sweep";
                  size_t base = (a[1] == "watch" || sweep) ? 2 : 1;
                  if (a.size() < base + 3) { usage(argv[0]); return 2; }
          
                  int pid = resolve_pid(a[base].c_str());
                  unsigned long addr = strtoul(a[base + 1].c_str(), NULL, 16);
                  unsigned long mode = (a.size() > base + 2 && a[base + 2] == "a")
                                       ? TOWA_WATCH_ACCESS : TOWA_WATCH_WRITE;
          
                  unsigned long wlen = a.size() > (sweep ? 4u : 3u)
                          ? strtoul(a[sweep ? 4 : 3].c_str(), NULL, 0) : 0;
          
                  long slot = towa_watch_arm(pid, addr, mode, wlen);
                  if (slot < 0) {
                      printf("(ENOENT  = that address is not in any mapping of that pid -\n"
                             "          the layout changed, get the address again\n"
                             " EFAULT  = mapped, but the page is not faulted in yet\n"
                             " EOPNOTSUPP = access mode refused - it needs a read-only file page;\n"
                             "          use write mode on anything else\n"
                             " EPERM   = the page is not writable by that process at all)\n");
                      return 1;
                  }
                  printf("watching slot %ld: pid %d page 0x%lx, next %s\n",
                         slot, pid, addr & ~0xfffUL,
                         mode == TOWA_WATCH_ACCESS ? "read/write/execute" : "write");
          
                  if (sweep) {
                      for (int i = 0; i < 20; i++) {
                          sleep(1);
                          if (towa_watch_stat(slot)) break;
                      }
                      towa_watch_off(slot);
                  }
                  return 0;
              }
          
              if (cmd == "read") {
                  if (a.size() < 4) { usage(argv[0]); return 2; }
                  int pid = atoi(a[1].c_str());
                  unsigned long addr = strtoul(a[2].c_str(), NULL, 16);
                  unsigned long len = strtoul(a[3].c_str(), NULL, 0);
                  if (len > 1024 * 1024) { printf("len too big\n"); return 2; }
          
                  std::vector<unsigned char> buf(len);
                  int got = towa_read(pid, addr, &buf[0], len);
                  if (got < 0) return 1;
                  hexdump(addr, &buf[0], got);
                  return 0;
              }
          
              if (cmd == "write") {
                  if (a.size() < 4) { usage(argv[0]); return 2; }
                  int pid = atoi(a[1].c_str());
                  unsigned long addr = strtoul(a[2].c_str(), NULL, 16);
          
                  std::vector<unsigned char> bytes;
                  if (!hex_to_bytes(a[3].c_str(), bytes)) { printf("bad hex\n"); return 2; }
          
                  int put = towa_write(pid, addr, &bytes[0], bytes.size());
                  if (put < 0) return 1;
                  printf("wrote %d bytes to 0x%lx\n", put, addr);
                  return 0;
              }
          
              usage(argv[0]);
              return 2;
          }
          TW_CLI
          
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors --no-progress-meter \
            -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          rm -f /tmp/ndk.zip
          
          NDK=$(ls -d /opt/android-ndk-* | head -1)
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          test -x "$CXX" || { echo "no ndk clang++ at $CXX"; ls -d /opt/android-ndk-* 2>/dev/null; exit 1; }
          
          # The syscall number comes from the tree we just built, because it is NOT 294:
          # this kernel's table already runs to 442, so 294 is somebody else's syscall and
          # calling it with six arguments would be worse than useless.
          NR=$(grep -m1 '^#define __NR_syscalls' \
                 "$GITHUB_WORKSPACE/kernel/include/uapi/asm-generic/unistd.h" | awk '{print $3}')
          NR=$((NR-1))
          echo "building against TOWA_NR=$NR"
          test "$NR" -gt 0 || { echo "could not read the syscall number"; exit 1; }
          
          # -static-libstdc++ so the binary does not need libc++_shared.so pushed next to
          # it; libc, libm and libdl are on the device already.
          STAMP=$(date -u +%Y%m%d.%H%M)
          echo "towacli build stamp: $STAMP"
          
          "$CXX" -O2 -fPIE -pie -static-libstdc++ -Wall -DNR_TOWA=$NR \
                 -DTOWACLI_BUILD="\"$STAMP\"" \
                 -o "$GITHUB_WORKSPACE/tools/towacli" "$GITHUB_WORKSPACE/tools/towacli.cpp"
          
          cat > "$GITHUB_WORKSPACE/tools/towamod.cpp" <<'TW_MOD'
          // towamod.cpp - our own mod, on our own driver.
          //
          // Built in AIDE Pro as a plain C++ native executable, the same way towacli is.
          // It talks to kdbg through its syscall, which means:
          //
          //   - no device node, so nothing appears in /dev while this runs
          //   - `compat` never has to be switched on
          //   - no root needed for reads and writes (only the ioctl path checks
          //     CAP_SYS_PTRACE; the syscall path does not)
          //   - nothing injected into the game, no zygisk, no library of anyone else's
          //
          // The shell wrapper (towamod.sh) does the root check, unpacking and menu; this
          // binary is the thing that actually does the work.
          //
          // Layout of the work, so the file stays readable:
          //     driver        the syscall, and the three operations that matter
          //     target        finding the game, its module, its module base
          //     games         per-game knowledge (Free Fire first)
          //     menu          what to turn on
          //     main          the loop
          
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <cstdint>
          #include <cerrno>
          #include <string>
          #include <vector>
          #include <dirent.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          
          #ifndef NR_TOWA
          #define NR_TOWA 0        /* the build passes -DNR_TOWA=<number from the log> */
          #endif
          
          #define TOWA_COOKIE 0x9E3779B97F4A7C15ULL
          #define TOWA_MAGIC  0x5032300AUL
          
          enum {
              OP_PING       = 0,
              OP_READ       = 1,
              OP_WRITE      = 2,
              OP_BASE       = 3,
          };
          
          static unsigned long g_nr = NR_TOWA;
          
          static long drv(unsigned long op, unsigned long a1 = 0, unsigned long a2 = 0,
                          unsigned long a3 = 0, unsigned long a4 = 0)
          {
              return syscall((long)g_nr, (unsigned long)TOWA_COOKIE, op, a1, a2, a3, a4);
          }
          
          static bool drv_read(int pid, unsigned long addr, void *buf, unsigned long len)
          {
              return drv(OP_READ, (unsigned long)pid, addr, (unsigned long)buf, len) == (long)len;
          }
          
          static bool drv_write(int pid, unsigned long addr, const void *buf, unsigned long len)
          {
              return drv(OP_WRITE, (unsigned long)pid, addr,
                         (unsigned long)buf, len) == (long)len;
          }
          
          static unsigned long drv_base(int pid, const char *module)
          {
              unsigned long base = 0;
          
              if (drv(OP_BASE, (unsigned long)pid, (unsigned long)module,
                      (unsigned long)&base) < 0)
                  return 0;
          
              return base;
          }
          
          /* ------------------------------------------------------------------ target */
          
          // A pid or a process name - the same convenience towacli has, because the game
          // is found by its command line, not by `pidof` (which matches the 15-character
          // kernel name and therefore never matches a package name).
          static int find_pid(const char *name)
          {
              DIR *d = opendir("/proc");
              if (!d)
                  return -1;
          
              int loose = -1;
              size_t nlen = strlen(name);
              struct dirent *e;
          
              while ((e = readdir(d)) != NULL) {
                  if (e->d_name[0] < '0' || e->d_name[0] > '9')
                      continue;
          
                  char path[64], cmd[256] = {0};
                  snprintf(path, sizeof(path), "/proc/%s/cmdline", e->d_name);
          
                  int fd = open(path, O_RDONLY);
                  if (fd < 0)
                      continue;
                  ssize_t n = read(fd, cmd, sizeof(cmd) - 1);
                  close(fd);
                  if (n <= 0)
                      continue;
          
                  if (!strcmp(cmd, name)) {          /* exact */
                      int pid = atoi(e->d_name);
                      closedir(d);
                      return pid;
                  }
                  if (loose < 0 && strlen(cmd) >= nlen && !strncmp(cmd, name, nlen))
                      loose = atoi(e->d_name);       /* same prefix */
              }
          
              closedir(d);
              return loose;
          }
          
          /* ------------------------------------------------------------------- games */
          
          struct game {
              const char *label;
              const char *package;
              const char *module;        /* the module every offset is relative to */
          };
          
          static const struct game g_games[] = {
              { "Free Fire",       "com.dts.freefireth",  "libil2cpp.so" },
              { "Free Fire MAX",   "com.dts.freefiremax", "libil2cpp.so" },
              { "PUBG Mobile",     "com.tencent.ig",      "libUE4.so"    },
          };
          
          #define GAME_COUNT (int)(sizeof(g_games) / sizeof(g_games[0]))
          
          struct target {
              int pid = -1;
              const struct game *g = nullptr;
              unsigned long base = 0;
          };
          
          // Probes one game into its own local target and commits nothing, so a later
          // game that is not running cannot overwrite a target that was found.
          static bool target_acquire(target &t, const struct game &g)
          {
              int pid = find_pid(g.package);
              if (pid <= 0) {
                  printf("  %-16s not running\n", g.label);
                  return false;
              }
          
              unsigned long base = drv_base(pid, g.module);
              if (!base) {
                  printf("  %-16s pid %d, but no %s - is it loaded yet?\n",
                         g.label, pid, g.module);
                  return false;
              }
          
              t.pid  = pid;
              t.base = base;
              t.g    = &g;
              printf("  %-16s pid %d, %s at 0x%lx\n", g.label, pid, g.module, base);
              return true;
          }
          
          /* -------------------------------------------------------------------- menu */
          
          struct opts {
              bool esp   = false;
              bool aim   = false;
              int  aim_fov = 120;      /* degrees; 120 is generous on purpose */
              int  aim_key = 0;        /* 0 = always, otherwise a volume step */
          };
          
          static void menu(const target &t, opts &o)
          {
              printf("\n  target: %s   pid %d   base 0x%lx\n\n",
                     t.g->label, t.pid, t.base);
              printf("  [1] ESP            %s\n", o.esp ? "ON" : "off");
              printf("  [2] Aim            %s\n", o.aim ? "ON" : "off");
              printf("  [3] Aim FOV        %d\n", o.aim_fov);
              printf("  [4] Toggle aim key %s\n", o.aim_key ? "volume step" : "always on");
              printf("  [9] Start\n");
              printf("  [0] Quit\n");
              printf("\n  > ");
              fflush(stdout);
          }
          
          /* -------------------------------------------------------------------- main */
          
          static void banner(void)
          {
              printf("\n  towamod - our own, on our own driver\n");
              printf("  driver: syscall %lu\n", g_nr);
              printf("  nothing injected, no /dev entries, no root needed for reads\n\n");
          }
          
          int main(int argc, char **argv)
          {
              /*
               * The syscall number, in order of preference: -n on the command line, then
               * TOWA_NR from the environment, then whatever the build passed in.  It is
               * not guessed and never probed - calling an unknown syscall number with six
               * arguments is somebody else's syscall, with consequences nobody asked for.
               * The number is printed as TOWA_NR by the kernel build log.
               */
              if (argc > 1 && !strcmp(argv[1], "-n") && argc > 2)
                  g_nr = strtoul(argv[2], nullptr, 0);
              else if (getenv("TOWA_NR"))
                  g_nr = strtoul(getenv("TOWA_NR"), nullptr, 0);
          
              banner();
          
              if (!g_nr) {
                  fprintf(stderr, "built without -DNR_TOWA=<number>: pass -n <number>\n");
                  return 2;
              }
          
              long r = drv(OP_PING);
              if (r < 0 || (unsigned long)r != TOWA_MAGIC) {
                  fprintf(stderr, "driver did not answer (0x%lx) - is the kernel flashed?\n", r);
                  return 1;
              }
              printf("  driver: alive (0x%lx)\n\n", r);
          
              printf("  looking for a game...\n");
              target t;
              bool found = false;
              for (int i = 0; i < GAME_COUNT; i++) {
                  target probe;
                  if (target_acquire(probe, g_games[i]) && !found) {
                      t = probe;          /* the first game found wins */
                      found = true;
                  }
              }
          
              if (!found) {
                  fprintf(stderr, "\n  none of the supported games is running (or no module yet)\n");
                  return 1;
              }
          
              opts o;
          
              for (;;) {
                  menu(t, o);
                  char line[32];
                  if (!fgets(line, sizeof(line), stdin))
                      break;
          
                  switch (atoi(line)) {
                  case 1: o.esp = !o.esp; break;
                  case 2: o.aim = !o.aim; break;
                  case 3: o.aim_fov = o.aim_fov >= 180 ? 20 : o.aim_fov + 20; break;
                  case 4: o.aim_key = !o.aim_key; break;
                  case 9:
                      printf("\n  the read/link stage is what this build proves.\n"
                             "  ESP drawing and the aim come next, on top of it.\n");
                      return 0;
                  case 0:
                  default:
                      return 0;
                  }
              }
          
              return 0;
          }
          TW_MOD
          
          "$CXX" -O2 -fPIE -pie -static-libstdc++ -Wall -DNR_TOWA=$NR        -o "$GITHUB_WORKSPACE/tools/towamod" "$GITHUB_WORKSPACE/tools/towamod.cpp"
          
          echo "--- what we built ---"
          ls -l "$GITHUB_WORKSPACE/tools/towacli"
          file "$GITHUB_WORKSPACE/tools/towacli" || true
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$GITHUB_WORKSPACE/tools/towacli" | grep -E 'Class|Type|Machine'
          echo "--- libraries it asks for (libc/libm/libdl only) ---"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$GITHUB_WORKSPACE/tools/towacli" | grep NEEDED
          
          rm -rf /opt/android-ndk-*
          echo "--- usage it prints for itself ---"
          "$GITHUB_WORKSPACE/tools/towacli" 2>&1 | head -5 || true
      - name: Package AnyKernel3 zip
        run: |
          set -e
          curl -fsSL "https://codeload.github.com/Aflaungos/AnyKernel3/tar.gz/refs/heads/m23xq" -o /tmp/ak3.tar.gz
          mkdir -p /tmp/ak3 && tar -xzf /tmp/ak3.tar.gz -C /tmp/ak3 --strip-components=1
          cd /tmp/ak3
          chmod +x tools/* 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/out/Image" Image
          [ -f "$GITHUB_WORKSPACE/out/dtb" ]  && cp "$GITHUB_WORKSPACE/out/dtb"  dtb
          [ -f "$GITHUB_WORKSPACE/out/dtbo" ] && cp "$GITHUB_WORKSPACE/out/dtbo" dtbo
          # The module rides inside the zip too, so one download has everything.
          # With builtin=y there is no module and the block below does nothing.
          if [ -f "$GITHUB_WORKSPACE/out/kdbg.ko" ]; then
            cp "$GITHUB_WORKSPACE/out/kdbg.ko" kdbg.ko
          fi
          # Appended after write_boot, which is plain shell by that point.
          cat >> anykernel.sh <<'AK3EOF'

          # kdbg: leave the module somewhere that survives, so it does not have to
          # be pushed again after every flash
          for d in "$AKHOME" .; do
            if [ -f "$d/kdbg.ko" ]; then
              mkdir -p /data/adb/towa
              cp "$d/kdbg.ko" /data/adb/towa/kdbg.ko
              chmod 0644 /data/adb/towa/kdbg.ko
              ui_print "  kdbg.ko -> /data/adb/towa/"
              break
            fi
          done
          AK3EOF
          rm -rf .github README.md
          Z="$GITHUB_WORKSPACE/towa-kernel-${{ github.run_number }}.zip"
          zip -r9 "$Z" . -x '.git/*' -x '.github/*' -x 'README.md' >/dev/null
          echo "--- contents ---"; unzip -l "$Z" | head -25
          echo "--- self-test ---"; unzip -t "$Z" | tail -3
          echo "--- sha256 ---"; sha256sum "$Z"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            /tmp/build.log
            /tmp/kdbg.log
            /tmp/cfg.log
          if-no-files-found: warn

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: towa-kernel-${{ github.run_number }}
          path: ${{ github.workspace }}/towa-kernel-*.zip
          if-no-files-found: error

      - name: Upload kdbg.ko
        if: ${{ inputs.builtin != 'y' }}
        uses: actions/upload-artifact@v4
        with:
          name: kdbg_core-ko-${{ github.run_number }}
          path: ${{ github.workspace }}/out/kdbg.ko
          if-no-files-found: error

      - name: Upload the clients
        uses: actions/upload-artifact@v4
        with:
          name: clients-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/tools/towacli
            ${{ github.workspace }}/tools/towamod
          if-no-files-found: error

      - name: Attach to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Z="$GITHUB_WORKSPACE/towa-kernel-${{ github.run_number }}.zip"
          FILES="$Z"
          E="/tmp/extra.txt"
          if [ -f "$GITHUB_WORKSPACE/tools/towacli" ]; then
            cp "$GITHUB_WORKSPACE/tools/towacli" /tmp/towacli
            FILES="$FILES /tmp/towacli"
          fi
          if [ -f "$GITHUB_WORKSPACE/out/kdbg.ko" ]; then
            cp "$GITHUB_WORKSPACE/out/kdbg.ko" /tmp/kdbg.ko
            FILES="$FILES /tmp/kdbg.ko"
            echo "kdbg.ko is in this release" > "$E"
          else
            echo "built-in build: kdbg_core is in the Image, no .ko" > "$E"
          fi
          NR=$(grep -m1 '^#define __NR_syscalls' kernel/include/uapi/asm-generic/unistd.h | awk '{print $3}')
          gh release create "kdbg-${{ github.run_number }}" $FILES \
            --repo "$GITHUB_REPOSITORY" \
            --title "kdbg kernel build ${{ github.run_number }}" \
            --notes "TOWA_NR=$((NR-1))  cookie=0x9E3779B97F4A7C15  branch=${{ inputs.branch }}  builtin=${{ inputs.builtin }}
          $(cat "$E")
          sha256=$(sha256sum "$Z" | cut -d' ' -f1)" \
          || gh release upload "kdbg-${{ github.run_number }}" $FILES \
            --repo "$GITHUB_REPOSITORY" --clobber
