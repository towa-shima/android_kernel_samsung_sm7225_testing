          /* -------------------------------------------------------- wanbai.h compatibility */
          /*
           * Compatibility with the wanbai.h family of clients.
           *
           * Those hacks do not know about us and never will: they open a device node
           * and issue ioctl 0x800..0x803.
           *
           *   0x800  initKey, a per-build key string
           *   0x801  {int pid; uintptr_t addr; void *buffer; size_t size;}
           *   0x802  the same struct, writing
           *   0x803  {int pid; char *name; uintptr_t base;}
           *
           * Those struct layouts are copied from their header, so the offsets match
           * exactly.  One node per name they hunt for, plus a fake /proc entry for the
           * rt-proc shape, lets an unmodified hack work against us by picking its own
           * menu entry - nothing to recompile and nothing to rebuild.
           *
           * The key is accepted whatever it is.  We are not the build that minted it,
           * and refusing an unknown key would only break the handshake.
           *
           * Set TOWA_COMPAT to 0 when you want no device nodes at all.
           */
          #define TOWA_COMPAT_DEVS "wanbai,CheckMe,Ckanri,lanran,video188"
          #define TOWA_COMPAT_PROC "kvmstats"
          
          #define TOWA_IOCTL_INIT_KEY	0x800
          #define TOWA_IOCTL_READ_MEM	0x801
          #define TOWA_IOCTL_WRITE_MEM	0x802
          #define TOWA_IOCTL_MODULE_BASE	0x803
          
          struct towa_copy_memory {
          	pid_t		pid;
          	uintptr_t	addr;
          	void		*buffer;
          	size_t		size;
          };
          
          struct towa_module_base {
          	pid_t		pid;
          	char		*name;
          	uintptr_t	base;
          };
          
          static long towa_compat_ioctl(struct file *f, unsigned int cmd, unsigned long arg)
          {
          	void __user *uarg = (void __user *)arg;
          
          	switch (cmd) {
          	case TOWA_IOCTL_INIT_KEY:
          		/* any key, any length, even none */
          		return 0;
          
          	case TOWA_IOCTL_READ_MEM: {
          		struct towa_copy_memory cm;
          		long r;
          
          		if (copy_from_user(&cm, uarg, sizeof(cm)))
          			return -EFAULT;
          		if (!cm.buffer || !cm.size)
          			return -EINVAL;
          
          		r = towa_rw(cm.pid, cm.addr, (void __user *)cm.buffer, cm.size, false);
          		return r == (long)cm.size ? 0 : (r < 0 ? r : -EFAULT);
          	}
          
          	case TOWA_IOCTL_WRITE_MEM: {
          		struct towa_copy_memory cm;
          		long r;
          
          		if (copy_from_user(&cm, uarg, sizeof(cm)))
          			return -EFAULT;
          		if (!cm.buffer || !cm.size)
          			return -EINVAL;
          
          		r = towa_rw(cm.pid, cm.addr, (void __user *)cm.buffer, cm.size, true);
          		return r == (long)cm.size ? 0 : (r < 0 ? r : -EFAULT);
          	}
          
          	case TOWA_IOCTL_MODULE_BASE: {
          		struct towa_module_base mb;
          		unsigned long base = 0;
          		long r;
          
          		if (copy_from_user(&mb, uarg, sizeof(mb)))
          			return -EFAULT;
          		if (!mb.name)
          			return -EINVAL;
          
          		r = towa_find_base(mb.pid, (const char __user *)mb.name, &base);
          		if (r)
          			return r;
          		if (put_user(base, &((struct towa_module_base __user *)uarg)->base))
          			return -EFAULT;
          		return 0;
          	}
          
          	default:
          		return -ENOTTY;
          	}
          }
          
          static const struct file_operations towa_compat_fops = {
          	.owner		= THIS_MODULE,
          	.unlocked_ioctl	= towa_compat_ioctl,
          	.compat_ioctl	= towa_compat_ioctl,
          };
          
          #define TOWA_COMPAT_MAX	8
          
          static struct miscdevice towa_misc[TOWA_COMPAT_MAX];
          static char towa_misc_name[TOWA_COMPAT_MAX][32];
          static int towa_misc_n;
          static struct proc_dir_entry *towa_proc;
          
          static int towa_compat_init(void)
          {
          	char list[160];
