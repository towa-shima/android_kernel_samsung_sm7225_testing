name: Build CheetKernal 191 (m23xq)

# Same pipeline as the 325 build, pointed at the .191 source.
#
# The only kernel change RTkernel needs is CONFIG_HARDENED_USERCOPY=y, which
# this workflow applies to the defconfig automatically and then verifies by
# reading the built Image's embedded config back out.
#
# Fill in the branch name in the Run workflow box once mrsiri gives you the repo.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch (e.g. cheet)'
        required: true
        default: 'cheetkernel'
      model:
        description: 'Device model'
        required: true
        default: 'm23xq'
      clang_dir:
        description: 'AOSP clang revision directory'
        required: true
        default: 'clang-r487747c'
      ksu:
        description: 'Build KernelSU in? y = BakaSU root, n = rootless (for APatch)'
        required: true
        default: 'y'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git libelf-dev libssl-dev \
            lz4 python3 rsync unzip wget xz-utils zip

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 --branch "${{ inputs.branch }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/Aflaungos/android_kernel_samsung_sm7225_testing.git \
            "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          echo "--- version ---"
          head -5 Makefile
          echo "--- build script present? ---"
          ls -l build_lito_kernel.sh 2>/dev/null || echo "  NO build_lito_kernel.sh"
          echo "--- defconfigs ---"
          ls arch/arm64/configs/vendor/ 2>/dev/null | head -20 || true

      # r487747c is the clang 17.0.2 that built the original CheetKernal
      # (banner: "Android (10087095, ...) clang version 17.0.2"). AOSP deletes
      # old revisions from prebuilts/clang/host/linux-x86, so these are imports.
      - name: Toolchain - ${{ inputs.clang_dir }}
        run: |
          mkdir -p "$HOME/linux-x86-main"
          cd "$HOME/linux-x86-main"
          echo "--- disk before ---"; df -h / | tail -1
          fetch() {
            echo "=== trying: $1"
            curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --no-progress-meter \
                 -o /tmp/clang.tar.gz "$1" || { echo "  download failed"; return 1; }
            echo "  downloaded: $(stat -c%s /tmp/clang.tar.gz) bytes"
            rm -rf "${{ inputs.clang_dir }}" && mkdir -p "${{ inputs.clang_dir }}"
            tar -xzf /tmp/clang.tar.gz -C "${{ inputs.clang_dir }}" --strip-components="$2" \
              || { echo "  extract failed"; return 1; }
            rm -f /tmp/clang.tar.gz
            [ -x "${{ inputs.clang_dir }}/bin/clang" ] || { echo "  no bin/clang"; ls "${{ inputs.clang_dir }}" | head; return 1; }
            "${{ inputs.clang_dir }}/bin/clang" --version || return 1
          }
          D="${{ inputs.clang_dir }}"
          fetch "https://codeload.github.com/halogenOS/android_prebuilts_clang_host_linux-x86_$D/tar.gz/refs/heads/XOS-13.0" 1 \
          || fetch "https://codeload.github.com/project-raspberry/prebuilts_clang_host_linux-x86_$D/tar.gz/refs/heads/fifteen" 1 \
          || fetch "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/$D.tar.gz" 0 \
          || { echo "ALL CLANG SOURCES FAILED"; df -h /; exit 1; }
          echo "--- disk after ---"; df -h / | tail -1

      - name: Toolchain - aarch64-linux-android-4.9
        run: |
          mkdir -p "$HOME/aarch64-linux-android-4.9"
          curl -fsSL \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android11-release.tar.gz" \
            | tar -xz -C "$HOME/aarch64-linux-android-4.9"
          ls "$HOME/aarch64-linux-android-4.9/bin" | head

      # RTkernel (all b/c variants) imports exactly one symbol your kernel does
      # not export: __check_object_size. That comes from HARDENED_USERCOPY.
      # Note the non-b 4.19.191.sh build is a lockdep build and needs six more
      # symbols - do not use it.
      - name: Enable CONFIG_HARDENED_USERCOPY
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          # The cheetkernel branch builds from m23xq_eur_open_defconfig
          # (see build_kernel.sh), and the maintainer already enabled
          # HARDENED_USERCOPY / KPROBES / PROVE_LOCKING there.
          DEF="arch/arm64/configs/vendor/m23xq_eur_open_defconfig"
          [ -f "$DEF" ] || DEF="arch/arm64/configs/vendor/lito-perf_defconfig"
          if [ ! -f "$DEF" ]; then
            echo "!! $DEF not found. Available vendor defconfigs:"
            ls arch/arm64/configs/vendor/ 2>/dev/null || true
            ls arch/arm64/configs/ 2>/dev/null | head -20 || true
            exit 1
          fi
          if grep -q '^CONFIG_HARDENED_USERCOPY=y' "$DEF"; then
            echo "already enabled"
          else
            # drop any "# CONFIG_HARDENED_USERCOPY is not set" first
            sed -i '/^# CONFIG_HARDENED_USERCOPY is not set$/d' "$DEF"
            echo 'CONFIG_HARDENED_USERCOPY=y' >> "$DEF"
            echo "appended"
          fi
          grep -n 'HARDENED_USERCOPY' "$DEF"
          echo "--- module signing (must be OFF on the 191 tree) ---"
          grep -nE '^(# )?CONFIG_MODULE_SIG[ _]' "$DEF" || true

          # BakaSU on 4.19 can only hook via KSU_MANUAL_HOOK (the tracepoint
          # method needs 5.10+, and SUSFS needs kernel-side integration). That
          # hook patches sys_call_table - which is exactly what the RT driver
          # wants for [__NR_ioctl]. So for an APatch build we remove KernelSU
          # entirely and let APatch root the boot image instead.
          if [ "${{ inputs.ksu }}" = "n" ]; then
            echo "--- building ROOTLESS (APatch target) ---"
            sed -i -e '/^CONFIG_KSU=/d' \
                   -e '/^# CONFIG_KSU is not set$/d' \
                   -e '/^CONFIG_KSU_MANUAL_HOOK=/d' \
                   -e '/^# CONFIG_KSU_MANUAL_HOOK is not set$/d' "$DEF"
            printf '# CONFIG_KSU is not set\n# CONFIG_KSU_MANUAL_HOOK is not set\n' >> "$DEF"
            # the submodule is still cloned; it just will not be compiled
            grep -n '^# CONFIG_KSU' "$DEF"
          else
            echo "--- building WITH KernelSU (manual hook) ---"
            grep -nE '^(# )?CONFIG_KSU' "$DEF" || true
          fi

      - name: Build kernel
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          chmod +x tools/* 2>/dev/null || true
          # build_kernel.sh calls make without -j, which would build serially
          # for hours. MAKEFLAGS is inherited by every make it spawns.
          export MAKEFLAGS="-j$(nproc)"
          if [ -f build_kernel.sh ]; then
            echo "using build_kernel.sh (cheetkernel)"
            chmod +x build_kernel.sh
            cat build_kernel.sh
            ./build_kernel.sh
          elif [ -f build_lito_kernel.sh ]; then
            chmod +x build_lito_kernel.sh
            sed -i 's/^BUILD_JOB_NUMBER=8$/BUILD_JOB_NUMBER=4/' build_lito_kernel.sh
            echo "${{ inputs.model }}" | ./build_lito_kernel.sh
          else
            echo "no build script - falling back to a direct build"
            CC="$HOME/linux-x86-main/${{ inputs.clang_dir }}/bin/clang"
            GCC="$HOME/aarch64-linux-android-4.9"
            export PATH="$HOME/linux-x86-main/${{ inputs.clang_dir }}/bin:$GCC/bin:$PATH"
            P="CC=clang LLVM_IAS=1 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- DTC_OVERLAY_TEST_EXT=$PWD/tools/ufdt_apply_overlay"
            DEF=$(ls arch/arm64/configs/vendor/*perf_defconfig 2>/dev/null | head -1)
            echo "using defconfig: $DEF"
            make O=out $P ARCH=arm64 "$DEF" \
                 vendor/samsung/lito-sec-common.config \
                 "vendor/samsung/${{ inputs.model }}.config"
            make O=out $P ARCH=arm64 olddefconfig
            make O=out -j4 $P ARCH=arm64
            if [ -x tools/mkdtimg ]; then
              ./tools/mkdtimg create out/arch/arm64/boot/dtbo.img --page_size=4096 \
                $(find out/arch/arm64/boot/dts/samsung/m23/${{ inputs.model }}/ -name '*.dtbo') || true
            fi
          fi

      - name: Collect and verify output
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -e
          IMG=out/arch/arm64/boot/Image
          test -s "$IMG" || { echo "MISSING $IMG"; find out -name 'Image*' | head; exit 1; }
          echo "--- banner ---"
          strings -a "$IMG" | grep -m1 '^Linux version'
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$IMG" "$GITHUB_WORKSPACE/out/Image"
          DTB=$(ls out/arch/arm64/boot/dts/vendor/qcom/lagoon.dtb 2>/dev/null || find out/arch/arm64/boot -name 'lagoon.dtb' | head -1)
          [ -n "$DTB" ] && cp "$DTB" "$GITHUB_WORKSPACE/out/dtb" || echo "WARN: no lagoon.dtb"
          [ -s out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img "$GITHUB_WORKSPACE/out/dtbo" || echo "WARN: no dtbo.img"

          # Read the config back out of the built Image - this is the step that
          # proves the option actually took effect.
          python3 - "$IMG" <<'PYEOF'
          import sys, gzip, re
          d = open(sys.argv[1], 'rb').read()
          s, e = d.find(b'IKCFG_ST'), d.find(b'IKCFG_ED')
          if s < 0 or e < s:
              print('no embedded config found'); sys.exit(0)
          cfg = gzip.decompress(d[s+8:e]).decode('utf-8', 'replace')
          for opt in ('CONFIG_HARDENED_USERCOPY', 'CONFIG_MODULE_SIG',
                      'CONFIG_MODULE_SIG_FORCE', 'CONFIG_MODULE_FORCE_LOAD',
                      'CONFIG_MODVERSIONS', 'CONFIG_KPROBES'):
              m = [l for l in cfg.splitlines() if re.match(r'^(# )?' + opt + r'[ =]', l)]
              print('  %-30s %s' % (opt, m[0] if m else 'ABSENT'))
          PYEOF
          ls -l "$GITHUB_WORKSPACE/out/"

      - name: Package AnyKernel3 zip
        run: |
          set -e
          # mrsiri's own AnyKernel3 fork, so the flash template matches theirs
          curl -fsSL "https://codeload.github.com/Aflaungos/AnyKernel3/tar.gz/refs/heads/m23xq" -o /tmp/ak3.tar.gz
          mkdir -p /tmp/ak3 && tar -xzf /tmp/ak3.tar.gz -C /tmp/ak3 --strip-components=1
          cd /tmp/ak3
          chmod +x tools/* 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/out/Image" Image
          [ -f "$GITHUB_WORKSPACE/out/dtb" ]  && cp "$GITHUB_WORKSPACE/out/dtb"  dtb
          [ -f "$GITHUB_WORKSPACE/out/dtbo" ] && cp "$GITHUB_WORKSPACE/out/dtbo" dtbo
          rm -rf .github README.md
          Z="$GITHUB_WORKSPACE/CheetKernal-191-${{ github.run_number }}.zip"
          zip -r9 "$Z" . -x '.git/*' -x '.github/*' -x 'README.md' -x '*placeholder' >/dev/null
          echo "--- contents ---"; unzip -l "$Z" | head -25
          echo "--- self-test ---"; unzip -t "$Z" | tail -3
          echo "--- sha256 ---"; sha256sum "$Z"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: CheetKernal-191-${{ github.run_number }}
          path: ${{ github.workspace }}/CheetKernal-191-*.zip
          if-no-files-found: error

      - name: Attach zip to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Z="$GITHUB_WORKSPACE/CheetKernal-191-${{ github.run_number }}.zip"
          gh release create "cheet-${{ github.run_number }}" "$Z" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CheetKernal 191 build ${{ github.run_number }}" \
            --notes "sha256: $(sha256sum "$Z" | cut -d' ' -f1)" \
          || gh release upload "cheet-${{ github.run_number }}" "$Z" \
            --repo "$GITHUB_REPOSITORY" --clobber
